<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit Owner - Global OS</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#080808;color:#fff;font-family:Manrope,sans-serif;display:flex;min-height:100vh}
 .sidebar{width:280px;background:#0a0a0a;border-right:1px solid #1e1e1e;padding:14px 12px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:30;transition:.32s}
 .sidebar.hide{transform:translateX(-110%)}
 .side-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
 .logo{display:flex;gap:10px;align-items:center;cursor:pointer}
 .logo img{width:44px;height:44px;border-radius:10px;background:#111}
 .logo b{font-size:20px;line-height:1;font-weight:800}
 .orange{color:#ff6b00}
 .white{color:#fff;letter-spacing:5px;font-weight:300;font-size:11px;display:block}
 .logo small{font-size:10px;color:#555;letter-spacing:1px;display:block;margin-top:2px}
 .x-btn{width:36px;height:36px;background:#1a1a1a;border:1px solid #2a2a2a;color:#fff;border-radius:12px;font-weight:800;cursor:pointer}
 .nav{display:flex;flex-direction:column;gap:4px;flex:1}
 .nav button{background:transparent;border:none;color:#555;padding:12px 12px;border-radius:12px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600;transition:.2s}
 .nav button.active{background:#1c130a;color:#ff8c00}
 .owner-card{margin-top:auto;background:#151515;border:1px solid #242424;border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center}
 .owner-card img{width:32px;height:32px;border-radius:50%;background:#222;object-fit:cover}
 .main{margin-left:280px;flex:1;padding:16px;max-width:640px;width:100%}
  @media(max-width:820px){.main{margin-left:0}.sidebar{width:86%}}
 .top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
 .top h2{margin:0;font-size:22px;font-weight:800}
 .card{background:#121212;border:1px solid #242424;border-radius:20px;padding:16px;margin-bottom:14px;border-left:4px solid #ff6b00}
 .input{width:100%;background:#0a0a0a;border:1px solid #2a2a2a;color:#fff;padding:12px;border-radius:12px;margin-bottom:10px;outline:none}
 .input:focus{border-color:#ff6b00}
 .btn{width:100%;border:1px solid #ff6b00;color:#ff6b00;background:transparent;padding:12px;border-radius:12px;font-weight:800;cursor:pointer}
 .btn-fill{width:100%;background:#ff6b00;color:#000;border:none;padding:12px;border-radius:12px;font-weight:800;cursor:pointer}
 .muted{color:#666;font-size:12px}
 .person{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #1a1a1a}
 .avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:#1e1e1e;color:#fff;font-size:18px}
 .progress{height:10px;background:#1e1e1e;border-radius:10px;overflow:hidden;margin:12px 0}
 .progress div{height:100%;background:#ff6b00}
 .lang-main{background:#1a1a1a;border:1px solid #2a2a2a;color:#ff6b00;padding:8px 14px;border-radius:20px;font-weight:800;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;width:100%}
 .lang-popup{position:absolute;left:12px;top:110px;background:#151515;border:1px solid #2a2a2a;border-radius:14px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px;z-index:99;width:220px}
 .lang-popup.hidden{display:none}
 .lang-popup button{background:#0a0a0a;border:1px solid #242424;color:#999;padding:8px;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer;text-align:left}
 .lang-popup button.active{background:#ff6b00;color:#000;border-color:#ff6b00}
  /* GLOBAL MODAL - красивое окно */
 .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.3s}
 .modal-bg.show{opacity:1;pointer-events:all}
 .modal{width:90%;max-width:380px;background:#151515;border:1px solid #2a2a2a;border-radius:24px;padding:22px;border-left:4px solid #ff6b00}
 .modal h3{margin:0 0 8px;font-weight:800;font-size:18px}
 .modal.linkBox{background:#0a0a0a;border:1px solid #2a2a2a;border-radius:12px;padding:12px;font-size:11px;color:#ff8c00;word-break:break-all;margin:12px 0}
 .modal-btns{display:flex;gap:10px;margin-top:14px}
</style>
</head>
<body>

  <div class="side-head">
    <div class="logo" id="logoBtn">
      <img src="logo.png">
      <div><b><span class="orange">HotPit</span><br><span class="white">KITCHEN</span></b><small id="logoSub"></small></div>

  <button id="langBtn" class="lang-main">🌐 <span id="curLangCode">RU</span></button>
  <div id="langPopup" class="lang-popup hidden">
    <button data-l="ru">🇷🇺 RU</button><button data-l="az">🇦🇿 AZ</button><button data-l="tr">🇹🇷 TR</button><button data-l="en">🇺🇸 EN</button>
    <button data-l="ar">🇸🇦 AR</button><button data-l="es">🇪🇸 ES</button><button data-l="de">🇩🇪 DE</button><button data-l="it">🇮🇹 IT</button>
  </div>

  <div class="nav" style="margin-top:12px">
    <button data-tab="staff" class="active">👥 <span id="mStaff"></span></button>
    <button data-tab="orders">📋 <span id="mOrders"></span></button>
    <button data-tab="menu">🍽️ <span id="mMenu"></span></button>
    <button data-tab="fot">📊 <span id="mFot"></span></button>
    <button data-tab="stock">📦 <span id="mStock"></span></button>
    <button data-tab="history">📜 <span id="mHistory"></span></button>
    <button data-tab="settings">⚙️ <span id="mSettings"></span></button>

  <div class="owner-card">
    <img id="ownerImg" src="logo.png">
    <div style="flex:1"><div id="ownerName" style="font-weight:700;font-size:13px"></div><div id="ownerRest" style="font-size:11px;color:#666"></div></div>
    <div>›</div>
  </div>
  <button class="btn" id="logout" style="margin-top:10px;border-color:#2a2a2a;color:#666"></button>
</div>

<div class="main">
  <div class="top"><button id="burger" style="background:#1a1a1a;border:1px solid #2a2a2a;color:#fff;padding:8px 12px;border-radius:12px;cursor:pointer">☰</button><h2 id="pageTitle"></h2></div>
  <div id="content"></div>
</div>

</div>

const dict={
 ru:{sub:"система управления",staff:"Персонал",orders:"Заказы",menu:"Меню",fot:"Отчёты",stock:"Склад",history:"История списаний",settings:"Настройки",team:"Команда Кухни",onShift:"На смене",noStaff:"Нет персонала",invite:"Пригласить Шефа",invitePh:"email@пример.com",sendInvite:"Отправить приглашение",inviteHint:"Шеф получит ссылку",fotMonth:"ФОТ Месяц",limitNotSet:"Лимит не установлен",goSettings:"Настройки",sendPDF:"Отправить PDF →",left:"Осталось",logout:"Выйти",soon:"скоро",wasteHistory:"История списаний",wasteHint:"Все списания от шефа",noWaste:"Нет списаний",stockTitle:"Склад",stockHint:"Склад общий - списывает шеф",settingsTitle:"Настройки",fotLimitPh:"ФОТ лимит",emailPh:"Email бухгалтера",tgPh:"Telegram @",save:"Сохранить",saved:"Сохранено",motto:"Ресторан который кормит город",pdfTitle:"Отчет",pdfFooter:"Professional Kitchen OS • Baku",waste:"Списать",qtyAsk:"Сколько списать?"},

}

let curLang=localStorage.getItem('hp_lang')||'ru';
let myRestaurantId=null, settings=null, ownerId=null, restNameCache='Restaurant';

function t(k){return (dict[curLang]||dict.en)[k]||k;}

function applyLang(l){
  curLang=l;
  localStorage.setItem('hp_lang',l);
  document.documentElement.dir=l==='ar'?'rtl':'ltr';
  document.getElementById('curLangCode').textContent=l.toUpperCase();
  document.getElementById('logoSub').textContent=t('sub');
  document.getElementById('mStaff').textContent=t('staff');
  document.getElementById('mOrders').textContent=t('orders');
  document.getElementById('mMenu').textContent=t('menu');
  document.getElementById('mFot').textContent=t('fot');
  document.getElementById('mStock').textContent=t('stock');
  document.getElementById('mHistory').textContent=t('history');
  document.getElementById('mSettings').textContent=t('settings');
  document.getElementById('logout').textContent=t('logout');
  document.querySelectorAll('#langPopup button').forEach(b=>b.classList.toggle('active',b.dataset.l===l));
  const ac=document.querySelector('.nav button.active')?.dataset.tab||'staff';
  if(ac==='staff') renderStaff();
}

async function init(){
 try{
  const {data:{user}} = await sb.auth.getUser();
  if(!user){location.href='/'; return}
  const {data:p}=await sb.from('profiles').select('*').eq('id',user.id).single();
  if(p?.preferred_language) curLang=p.preferred_language;
  myRestaurantId=p.restaurant_id||localStorage.getItem('restaurant_id');
  document.getElementById('ownerName').textContent=p.full_name||'Owner';
  const {data:r}=await sb.from('restaurants').select('name,owner_id').eq('id',myRestaurantId).single();
  restNameCache = r?.name || 'Restaurant';
  document.getElementById('ownerRest').textContent=restNameCache;
  ownerId=r?.owner_id;
  const {data:s}=await sb.from('restaurant_settings').select('*').eq('restaurant_id',myRestaurantId).single();
  settings=s;
  applyLang(curLang);
 }catch(e){
  console.log(e);
  applyLang(curLang);
  renderStaff();
 }
}

document.getElementById('langBtn').addEventListener('click',()=>{
  document.getElementById('langPopup').classList.toggle('hidden')
});

document.getElementById('langPopup').addEventListener('click', async e=>{
  if(e.target.dataset.l){
    const l=e.target.dataset.l;
    applyLang(l);
    document.getElementById('langPopup').classList.add('hidden');
    try{
      const {data:{user}}=await sb.auth.getUser();
      if(user) await sb.from('profiles').update({preferred_language:l}).eq('id',user.id);
    }catch(_){}
  }
});

document.getElementById('burger').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.remove('hide')
});

document.getElementById('xBtn').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.add('hide')
});

document.getElementById('logoBtn').addEventListener('click',()=>{
  location.href='/'
});

document.querySelectorAll('.nav button').forEach(b=>{
 b.addEventListener('click',()=>{
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  const tab=b.dataset.tab;
  if(tab==='staff') renderStaff();
  else if(tab==='fot') renderFOT();
  else if(tab==='stock') renderStock();
  else if(tab==='history') renderHistory();
  else if(tab==='settings') renderSettings();
  else {
    document.getElementById('pageTitle').textContent=b.textContent;
    document.getElementById('content').innerHTML=`<div class="card"><div class="muted">${t('soon')}</div></div>`;
  }
  if(innerWidth<820) document.getElementById('sidebar').classList.add('hide');
 })});

document.getElementById('content').addEventListener('click', async e=>{
  const wasteBtn = e.target.closest('[data-waste-id]');
  if(wasteBtn){
    await doWaste(wasteBtn.dataset.wasteId);
    return;
  }

  if(e.target.id==='inviteBtn'){
    const em=document.getElementById('inviteEmail').value.trim();
    if(!em) return;
    const link=`https://hotpitmaster070.github.io/?invite=${myRestaurantId}&email=${encodeURIComponent(em)}`;
    document.getElementById('inviteLinkText').textContent=link;
    document.getElementById('inviteModal').classList.add('show');
  }

  if(e.target.id==='goSet'){
    document.querySelector('[data-tab=settings]').click();
  }
  if(e.target.id==='pdfBtn' || e.target.id==='pdfBtn2'){
    closeMonthAndPDF();
  }
  if(e.target.id==='saveSet'){
    saveSettings();
  }
});

async function renderStaff(){
  document.getElementById('pageTitle').textContent='👥 '+t('staff');
  let filtered=[];
  try{
    const {data}=await sb.from('profiles').select('*').eq('restaurant_id',myRestaurantId).eq('is_active',true);
    filtered=(data||[]).filter(u=>u.id!==ownerId && u.role!=='owner');
  }catch(_){}

  const colors=['#ff6b00','#a855f7','#3b82f6','#22c55e'];
  const team=filtered.map((u,i)=>`
    <div class="person">
      <div class="avatar" style="background:${colors[i%4]}22;color:${colors[i%4]}">${(u.full_name||'U').trim()[0].toUpperCase()}</div>
      <div style="flex:1"><b>${u.full_name}</b><div class="muted">${u.job_title||u.role||''}</div></div>
      <div style="background:#163a22;color:#4ade80;font-size:10px;padding:4px 8px;border-radius:10px">${t('onShift')}</div>
    </div>
  `).join('')||`<div class="muted">${t('noStaff')}</div>`;

  let used=0;
  const fotLimit=settings?.fot_limit;
  try{
    const {data:payouts}=await sb.from('payouts').select('*').eq('restaurant_id',myRestaurantId).gte('created_at',new Date(new Date().setDate(1)).toISOString());
    used=(payouts||[]).reduce((s,p)=>s+Number(p.amount),0);
  }catch(_){}

  document.getElementById('content').innerHTML=`
    <div class="card">
      <div style="display:flex;gap:10px;align-items:center"><span>👥</span><b>${t('team')}</b></div>
      <div style="margin-top:10px">${team}</div>
    </div>
    <div class="card">
      <div><span style="color:#ff6b00">+ </span><b>${t('invite')}</b></div>
      <input class="input" id="inviteEmail" placeholder="${t('invitePh')}" style="margin-top:12px;border-color:#ff6b00">
      <button class="btn" id="inviteBtn" style="border-color:#ff6b00;color:#ff6b00;margin-top:6px">${t('sendInvite')}</button>
      <div class="muted" style="margin-top:8px">${t('inviteHint')}</div>
    </div>
    <div class="card">
      <div><span>💰</span><b>${t('fotMonth')}</b></div>
      ${!fotLimit?`<div style="color:#ff8c00;margin:12px 0">${t('limitNotSet')}</div><button class="btn" id="goSet">${t('goSettings')}</button>`:
      `<div class="muted" style="margin-top:6px">${fotLimit?Math.round(used/fotLimit*100):0}% • ${used} / ${fotLimit}</div><div class="progress"><div style="width:${Math.min(100,fotLimit?Math.round(used/fotLimit*100):0)}%"></div></div><div style="display:flex;justify-content:space-between"><span class="muted">${t('left')} ${fotLimit-used}</span><span class="muted">${fotLimit?Math.round(used/fotLimit*100):0}%</span></div>`}
      <button class="btn-fill" id="pdfBtn" style="margin-top:14px">${t('sendPDF')}</button>
    </div>`;
}

async function renderFOT(){
  document.getElementById('pageTitle').textContent='📊 '+t('fot');
  document.getElementById('content').innerHTML=`<div class="card"><h3 style="margin:0 0 12px">${t('fotMonth')}</h3><button class="btn-fill" id="pdfBtn2">${t('sendPDF')}</button></div>`;
}

async function renderStock(){
  document.getElementById('pageTitle').textContent='📦 '+t('stock');
  let data=[];
  try{
    const r=await sb.from('products').select('*').eq('restaurant_id',myRestaurantId).order('name');
    data=r.data||[];
  }catch(_){}
  document.getElementById('content').innerHTML=`
    <div class="card">
      <h3 style="margin:0 0 8px">${t('stockTitle')}</h3>
      <div class="muted" style="margin-bottom:8px">${t('stockHint')}</div>
      ${(data||[]).map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #1a1a1a"><div><b>${p.name}</b><div class="muted">${p.qty||p.stock||0} ${p.unit||''}</div></div><button class="btn" style="width:auto;padding:6px 14px" data-waste-id="${p.id}">${t('waste')}</button></div>`).join('')||'—'}
    </div>`;
}

async function doWaste(id){
  const qty=prompt(t('qtyAsk'));
  if(!qty) return;
  try{
    const {data:{user}}=await sb.auth.getUser();
    await sb.from('waste_logs').insert({restaurant_id:myRestaurantId,product_id:id,qty:parseFloat(qty),profile_id:user.id,type:'waste'});
    const {data:prod}=await sb.from('products').select('qty,stock').eq('id',id).single();
    const cur=parseFloat(prod?.qty??prod?.stock??0);
    await sb.from('products').update({qty:cur-parseFloat(qty),stock:cur-parseFloat(qty)}).eq('id',id);
    renderHistory();
  }catch(e){alert(e.message)}
}

async function renderHistory(){
  document.getElementById('pageTitle').textContent='📜 '+t('history');
  let data=[];
  try{
    const r=await sb.from('waste_logs').select('*, products(name), profiles(full_name)').eq('restaurant_id',myRestaurantId).order('created_at',{ascending:false}).limit(100);
    data=r.data||[];
  }catch(_){}
  document.getElementById('content').innerHTML=`
    <div class="card">
      <h3 style="margin:0 0 8px">${t('wasteHistory')}</h3>
      <div class="muted">${t('wasteHint')}</div>
      <div style="margin-top:10px">
        ${(data||[]).map(m=>`<div style="padding:10px 0;border-bottom:1px solid #1a1a1a"><div style="display:flex;justify-content:space-between"><b>${m.products?.name||m.product_id} — ${m.qty}</b><span style="color:#ff6b00;font-weight:800">${m.profiles?.full_name||'Chef'}</span></div><div class="muted">${new Date(m.created_at).toLocaleString(curLang)}</div></div>`).join('')||t('noWaste')}
      </div>
    </div>`;
}

async function renderSettings(){
  document.getElementById('pageTitle').textContent='⚙️ '+t('settings');
  document.getElementById('content').innerHTML=`
    <div class="card">
      <h3 style="margin:0 0 12px">${t('settingsTitle')}</h3>
      <div class="muted">${t('fotMonth')}</div>
      <input class="input" id="fotLimit" type="number" value="${settings?.fot_limit||''}" placeholder="${t('fotLimitPh')}">
      <div class="muted">Motto</div>
      <input class="input" id="mottoInput" value="
