<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit - Персонал</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Manrope,sans-serif;display:flex;min-height:100vh}
.sidebar{width:260px;background:#0f0f0f;border-right:1px solid #1e1e1e;display:flex;flex-direction:column;justify-content:space-between;padding:20px 14px;position:fixed;left:0;top:0;bottom:0;z-index:50;transition:.3s}
.logo{display:flex;gap:12px;align-items:center;margin-bottom:36px}
.logo-img{width:48px;height:48px;border-radius:12px}
.hot2{font-size:26px;font-weight:800;color:#fff;line-height:1}
.kit2{font-size:13px;letter-spacing:4px;color:#fff;opacity:.9}
.sub{font-size:10px;color:#666}
.menu{display:flex;flex-direction:column;gap:6px}
.menu-item{padding:12px 14px;border-radius:12px;color:#777;display:flex;gap:12px;cursor:pointer;font-size:14px;border:1px solid transparent}
.menu-item.active{background:rgba(255,107,0,.15);color:#ff8c00;border-color:rgba(255,107,0,.25);font-weight:700}
.bottom{margin-top:auto;padding-top:20px;border-top:1px solid #1e1e1e}
.user-card{display:flex;align-items:center;gap:10px;background:#151515;border:1px solid #222;border-radius:14px;padding:10px 12px}
.main{margin-left:260px;flex:1;padding:20px;max-width:800px}
.burger{display:none;width:36px;height:36px;background:#151515;border:1px solid #222;border-radius:10px;align-items:center;justify-content:center;cursor:pointer}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.burger{display:flex}}
.card{background:#151515;border:1px solid #222;border-radius:18px;padding:18px;margin-bottom:14px;position:relative}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:#ff6b00}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
<div>
<div class="logo"><img src="logo.png" class="logo-img"><div><div class="hot2">HotPit</div><div class="kit2">KITCHEN</div><div class="sub">система управления</div></div></div>
<div class="menu">
<div class="menu-item">Дашборд</div>
<div class="menu-item active">Персонал</div>
<div class="menu-item">Заказы</div>
<div class="menu-item">Меню</div>
<div class="menu-item">Отчёты</div>
<div class="menu-item">Настройки</div>
</div>
</div>
<div class="bottom">
<div class="user-card"><div>👑</div><div><div id="profileName">Загрузка...</div><div id="profileRest" style="font-size:10px;color:#666">...</div></div></div>
</div>
</div>

<div class="main">
<div style="display:flex;gap:14px;margin-bottom:20px"><div class="burger" id="burger">☰</div><div style="font-size:22px;font-weight:800">Персонал</div></div>

<div class="card">
<div style="font-weight:800;margin-bottom:12px">👥 Команда Кухни</div>
<div id="teamList">Загрузка команды...</div>
</div>

<div class="card">
<div style="font-weight:800;margin-bottom:12px">✦ Пригласить Шефа</div>
<input id="inviteEmail" style="width:100%;background:#0f0f0f;border:1px solid #333;border-radius:12px;padding:14px;color:#fff;margin-bottom:12px" placeholder="email@пример.com">
<button id="btnInvite" style="width:100%;background:transparent;border:1px solid #ff6b00;color:#ff8c00;padding:12px;border-radius:12px;font-weight:700">Отправить приглашение</button>
</div>

<div class="card">
<div style="font-weight:800;margin-bottom:12px">💲 ФОТ Месяц</div>
<div id="fotText">Загрузка...</div>
</div>
</div>

<script>
document.getElementById('burger').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
</script>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const sb=createClient('https://xljogkyropyocvuuodfl.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs')

const {data:{user}} = await sb.auth.getUser()
if(!user) location.href='/'

const {data:profile} = await sb.from('profiles').select('full_name, restaurant_id, restaurants(name)').eq('id',user.id).single()
if(profile){
  document.getElementById('profileName').textContent = profile.full_name
  document.getElementById('profileRest').textContent = profile.restaurants?.name || ''
  
  // Грузим команду из базы - без хардкода
  const {data:team} = await sb.from('profiles').select('full_name, role').eq('restaurant_id', profile.restaurant_id)
  if(team && team.length){
    document.getElementById('teamList').innerHTML = team.map(p=>`<div style="padding:8px 0;border-bottom:1px solid #222"><b>${p.full_name}</b> <span style="color:#666;font-size:12px">${p.role}</span></div>`).join('')
  } else {
    document.getElementById('teamList').innerHTML = '<div style="color:#666">Команда пока пустая — пригласите шефа</div>'
  }
}
</script>
</body>
 </html>
