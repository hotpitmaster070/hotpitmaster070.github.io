<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Manrope,sans-serif;display:flex;min-height:100vh}
.sidebar{width:268px;background:#0a0a0a;border-right:1px solid #1e1e1e;padding:14px 12px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:30;transition:.32s}
.sidebar.hide{transform:translateX(-110%)}
.side-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.logo{display:flex;gap:10px;align-items:center;cursor:pointer}
.logo img{width:44px;height:44px;border-radius:10px;background:#111}
.logo b{font-size:20px;line-height:1;font-weight:800}.logo b.orange{color:#ff6b00}.logo b.white{color:#fff}
.logo small{font-size:10px;color:#555;letter-spacing:1px;display:block;margin-top:2px}
.x-btn{width:36px;height:36px;background:#1a1a1a;border:1px solid #2a2a2a;color:#fff;border-radius:12px;font-weight:800;cursor:pointer}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav button{background:transparent;border:none;color:#555;padding:12px 12px;border-radius:12px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600}
.nav button.active{background:#1c130a;color:#ff8c00}
.owner-card{margin-top:auto;background:#151515;border:1px solid #242424;border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center}
.owner-card img{width:32px;height:32px;border-radius:50%;background:#222;object-fit:cover}
.main{margin-left:268px;flex:1;padding:16px;max-width:640px;width:100%}
@media(max-width:820px){.main{margin-left:0}.sidebar{width:86%}}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.top h2{margin:0;font-size:22px;font-weight:800}
.card{background:#121212;border:1px solid #242424;border-radius:16px;padding:16px;margin-bottom:14px;border-left:4px solid #ff6b00}
.input{width:100%;background:#0a0a0a;border:1px solid #2a2a2a;color:#fff;padding:12px;border-radius:12px;margin-bottom:10px;outline:none}
.input:focus{border-color:#ff6b00}
.btn{width:100%;border:1px solid #ff6b00;color:#ff6b00;background:transparent;padding:12px;border-radius:12px;font-weight:800;cursor:pointer}
.btn-fill{width:100%;background:#ff6b00;color:#000;border:none;padding:12px;border-radius:12px;font-weight:800;cursor:pointer}
.muted{color:#666;font-size:12px}
.person{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #1a1a1a}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:#1e1e1e;color:#fff}
.progress{height:8px;background:#1e1e1e;border-radius:10px;overflow:hidden;margin:10px 0}.progress div{height:100%;background:#ff6b00}
.lang-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.lang-bar button{background:#1a1a1a;border:1px solid #2a2a2a;color:#666;padding:5px 10px;border-radius:20px;font-weight:800;font-size:11px;cursor:pointer}.lang-bar button.active{background:#ff6b00;color:#000;border-color:#ff6b00}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="side-head">
    <div class="logo" id="logoBtn"><img src="logo.png"><div><b><span class="orange">HotPit</span><br><span class="white">KITCHEN</span></b><small id="logoSub">система управления</small></div></div>
    <button class="x-btn" id="xBtn">✕</button>
  </div>
  <div class="lang-bar" id="langBar"><button data-l="ru">RU</button><button data-l="az">AZ</button><button data-l="tr">TR</button><button data-l="en">EN</button><button data-l="ar">AR</button><button data-l="es">ES</button><button data-l="de">DE</button><button data-l="it">IT</button></div>
  <div class="nav">
    <button data-tab="staff" class="active">👥 <span id="mStaff">Персонал</span></button>
    <button data-tab="orders">📋 <span id="mOrders">Заказы</span></button>
    <button data-tab="menu">🍽️ <span id="mMenu">Меню</span></button>
    <button data-tab="fot">📊 <span id="mFot">Отчёты</span></button>
    <button data-tab="stock">📦 <span id="mStock">Склад</span></button>
    <button data-tab="history">📜 <span id="mHistory">История списаний</span></button>
    <button data-tab="settings">⚙️ <span id="mSettings">Настройки</span></button>
  </div>
  <div class="owner-card"><img id="ownerImg" src="logo.png"><div style="flex:1"><div id="ownerName" style="font-weight:700;font-size:13px">Mubariz</div><div id="ownerRest" style="font-size:11px;color:#666">Land</div></div><div>›</div></div>
  <button class="btn" id="logout" style="margin-top:10px;border-color:#2a2a2a;color:#666">Выйти</button>
</div>
<div class="main">
  <div class="top"><button id="burger" style="background:#1a1a1a;border:1px solid #2a2a2a;color:#fff;padding:8px 12px;border-radius:12px;cursor:pointer">☰</button><h2 id="pageTitle">Персонал</h2></div>
  <div id="content"></div>
</div>

let curLang=localStorage.getItem('hp_lang')||'ru';
let myRestaurantId=null, settings=null, ownerId=null, restNameCache='Restaurant';
function t(k){return (dict[curLang]||dict.en)[k]||k;}
function applyLang(l){
  curLang=l; localStorage.setItem('hp_lang',l);
  document.documentElement.dir=l==='ar'?'rtl':'ltr';
  document.getElementById('logoSub').textContent=t('sub');
  document.getElementById('mStaff').textContent=t('staff');
  document.getElementById('mOrders').textContent=t('orders');
  document.getElementById('mMenu').textContent=t('menu');
  document.getElementById('mFot').textContent=t('fot');
  document.getElementById('mStock').textContent=t('stock');
  document.getElementById('mHistory').textContent=t('history');
  document.getElementById('mSettings').textContent=t('settings');
  document.querySelectorAll('.lang-bar button').forEach(b=>b.classList.toggle('active',b.dataset.l===l));
  const ac=document.querySelector('.nav button.active')?.dataset.tab||'staff';
  if(ac==='staff') renderStaff(); else if(ac==='fot') renderFOT(); else if(ac==='stock') renderStock(); else if(ac==='history') renderHistory(); else if(ac==='settings') renderSettings();
}
async function init(){
  const {data:{user}} = await sb.auth.getUser(); if(!user){location.href='/'; return}
  const {data:p}=await sb.from('profiles').select('*').eq('id',user.id).single();
  if(p.preferred_language) curLang=p.preferred_language;
  localStorage.setItem('hp_lang',curLang);
  myRestaurantId=p.restaurant_id||localStorage.getItem('restaurant_id');
  document.getElementById('ownerName').textContent=p.full_name||'Owner';
  const {data:r}=await sb.from('restaurants').select('name,owner_id').eq('id',myRestaurantId).single();
  restNameCache = r?.name || 'Restaurant';
  document.getElementById('ownerRest').textContent=restNameCache;
  ownerId=r?.owner_id;
  const {data:s}=await sb.from('restaurant_settings').select('*').eq('restaurant_id',myRestaurantId).single(); settings=s;
  applyLang(curLang); renderStaff();
}
document.getElementById('langBar').onclick=e=>{if(e.target.dataset.l) applyLang(e.target.dataset.l)}
document.getElementById('burger').onclick=()=>document.getElementById('sidebar').classList.remove('hide');
document.getElementById('xBtn').onclick=()=>document.getElementById('sidebar').classList.add('hide');
document.querySelectorAll('.nav button').forEach(b=>{b.onclick=()=>{
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active')); b.classList.add('active');
  document.getElementById('pageTitle').textContent=b.textContent.trim();
  if(b.dataset.tab==='staff') renderStaff(); else if(b.dataset.tab==='fot') renderFOT(); else if(b.dataset.tab==='stock') renderStock(); else if(b.dataset.tab==='history') renderHistory(); else if(b.dataset.tab==='settings') renderSettings(); else document.getElementById('content').innerHTML=`<div class="card">${b.textContent} - ${t('soon')}</div>`;
  if(innerWidth<820) document.getElementById('sidebar').classList.add('hide');
}});

async function renderStaff(){
  document.getElementById('pageTitle').textContent='👥 '+t('staff');
  const {data}=await sb.from('profiles').select('*').eq('restaurant_id',myRestaurantId).eq('is_active',true).neq('id',ownerId||'00000000-0000-0000-0000-000000000000');
  const filtered=(data||[]).filter(u=>u.role!=='owner');
  const team=filtered.map(u=>`<div class="person"><div class="avatar">${(u.full_name||'U').trim()[0].toUpperCase()}</div><div style="flex:1"><b>${u.full_name}</b><div class="muted">${u.job_title||u.role||''} - данные от шефа: на смене</div></div><div style="color:#22c55e;font-size:11px">● На смене</div></div>`).join('')||`<div class="muted">${t('noStaff')}</div>`;
  const fotLimit=settings?.fot_limit;
  const {data:payouts}=await sb.from('payouts').select('*').eq('restaurant_id',myRestaurantId).gte('created_at',new Date(new Date().setDate(1)).toISOString());
  const used=(payouts||[]).reduce((s,p)=>s+Number(p.amount),0);
  document.getElementById('content').innerHTML=`
    <div class="card"><div><b>👥 ${t('team')} - данные от шефа</b></div><div style="margin-top:10px">${team}</div></div>
    <div class="card"><div><b>➕ ${t('invite')}</b></div><input class="input" id="inviteEmail" placeholder="${t('invitePh')}"><button class="btn" id="inviteBtn">${t('sendInvite')}</button><div class="muted" style="margin-top:8px">${t('inviteHint')}</div></div>
    <div class="card"><div><b>💰 ${t('fotMonth')}</b></div>${!fotLimit?`<div style="color:#ff8c00;margin:8px 0">${t('limitNotSet')}</div><button class="btn" id="goSet">${t('goSettings')}</button>`: `<div class="muted">${Math.round(used/fotLimit*100)}% • ${used} / ${fotLimit}</div><div class="progress"><div style="width:${Math.min(100,Math.round(used/fotLimit*100))}%"></div></div><div class="muted">${t('left')} ${fotLimit-used}</div>`}<button class="btn-fill" id="pdfBtn" style="margin-top:12px">${t('sendPDF')}</button></div>`;
  document.getElementById('inviteBtn')?.addEventListener('click',()=>{const e=document.getElementById('inviteEmail').value.trim(); if(!e) return; alert('Invite link: https://itmaster070.github.io/?invite='+myRestaurantId+' for '+e)});
  document.getElementById('goSet')?.addEventListener('click',()=>document.querySelector('[data-tab=settings]').click());
  document.getElementById('pdfBtn')?.addEventListener('click',closeMonthAndPDF);
}

async function renderFOT(){
  document.getElementById('pageTitle').textContent='📊 '+t('fot');
  const fotLimit=settings?.fot_limit;
  const {data:payouts}=await sb.from('payouts').select('*,profiles(full_name)').eq('restaurant_id',myRestaurantId).gte('created_at',new Date(new Date().setDate(1)).toISOString());
  const used=(payouts||[]).reduce((s,p)=>s+Number(p.amount),0);
  document.getElementById('content').innerHTML=`<div class="card"><h3 style="margin:0 0 8px">${t('fotMonth')} - данные от шефа (часы)</h3>${!fotLimit?`<div style="color:#ff8c00">${t('limitNotSet')}</div>`: `<div>${used} / ${fotLimit}</div><div class="progress"><div style="width:${Math.min(100,Math.round(used/fotLimit*100))}%"></div></div>`}<button class="btn-fill" id="pdfBtn2" style="margin-top:12px">${t('sendPDF')}</button></div><div class="card">${(payouts||[]).map(p=>`<div style="display:flex;justify-content:space-between;padding:6px 0"><span>${p.profiles?.full_name||p.profile_id} (от шефа)</span><b>${p.amount}</b></div>`).join('')||'—'}</div>`;
  document.getElementById('pdfBtn2')?.addEventListener('click',closeMonthAndPDF);
}

async function renderStock(){
  document.getElementById('pageTitle').textContent='📦 '+t('stock');
  const {data}=await sb.from('products').select('*').eq('restaurant_id',myRestaurantId).order('name');
  document.getElementById('content').innerHTML=`<div class="card"><h3 style="margin:0 0 8px">${t('stockTitle')}</h3><div class="muted" style="margin-bottom:8px">Склад общий - списывает шеф-повар, овнер видит</div>${(data||[]).map(p=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1a1a1a"><div><b>${p.name}</b><div class="muted">${p.qty||p.stock||0} ${p.unit||''}</div></div><button class="btn" style="width:auto;padding:6px 12px" onclick="window.doWaste('${p.id}')">Списать</button></div>`).join('')||'—'}</div>`;
}

window.doWaste=async(id)=>{
  const qty=prompt('Qty? Сколько списать?'); if(!qty) return;
  const {data:{user}}=await sb.auth.getUser();
  await sb.from('stock_moves').insert({restaurant_id:myRestaurantId,item_id:id,qty:parseFloat(qty),type:'waste',profile_id:user.id});
  const {data:prod}=await sb.from('products').select('qty,stock').eq('id',id).single();
  const cur=parseFloat(prod?.qty??prod?.stock??0);
  await sb.from('products').update({qty:cur-parseFloat(qty),stock:cur-parseFloat(qty)}).eq('id',id);
  renderHistory();
};

async function renderHistory(){
  document.getElementById('pageTitle').textContent='📜 '+t('history');
  const {data}=await sb.from('stock_moves').select('*, products(name), profiles(full_name)').eq('restaurant_id',myRestaurantId).order('created_at',{ascending:false}).limit(150);
  document.getElementById('content').innerHTML=`<div class="card"><h3 style="margin:0 0 8px">${t('wasteHistory')}</h3><div class="muted">Все списания от шеф-повара - кто и что списал</div><div style="margin-top:10px">${(data||[]).map(m=>`<div style="padding:10px 0;border-bottom:1px solid #1a1a1a"><div style="display:flex;justify-content:space-between"><b>${m.products?.name||m.item_id} — ${m.qty} ${m.type}</b><span style="color:#ff6b00;font-weight:800">${m.profiles?.full_name||'Chef'}</span></div><div class="muted">${new Date(m.created_at).toLocaleString(curLang)}</div></div>`).join('')||t('noWaste')}</div></div>`;
}

async function renderSettings(){
  document.getElementById('pageTitle').textContent='⚙️ '+t('settings');
  document.getElementById('content').innerHTML=`<div class="card"><h3 style="margin:0 0 12px">${t('settingsTitle')}</h3><div class="muted">${t('fotMonth')}</div><input class="input" id="fotLimit" type="number" value="${settings?.fot_limit||''}" placeholder="${t('fotLimitPh')}"><div class="muted">Accounting</div><input class="input" id="accEmail" value="${settings?.accountant_email||''}" placeholder="${t('emailPh')}"><input class="input" id="accTg" value="${settings?.accountant_telegram||''}" placeholder="${t('tgPh')}"><button class="btn-fill" id="saveSet">${t('save')}</button></div>`;
  document.getElementById('saveSet').onclick=async()=>{
    const upd={fot_limit:document.getElementById('fotLimit').value?parseInt(document.getElementById('fotLimit').value):null,accountant_email:document.getElementById('accEmail').value,accountant_telegram:document.getElementById('accTg').value};
    const {error}=await sb.from('restaurant_settings').update(upd).eq('restaurant_id',myRestaurantId);
    if(error) alert(error.message); else {settings={...settings,...upd}; alert(t('saved')); renderStaff();}
  };
}

async function closeMonthAndPDF(){
  const start=new Date(); start.setDate(1);
  const {data:attend}=await sb.from('attendance').select('*,profiles!inner(full_name)').eq('restaurant_id',myRestaurantId).gte('work_date',start.toISOString().split('T')[0]);
  const {data:payouts}=await sb.from('payouts').select('*,profiles(full_name)').eq('restaurant_id',myRestaurantId).gte('created_at',start.toISOString());
  const {data:wastes}=await sb.from('stock_moves').select('*,products(name),profiles(full_name)').eq('restaurant_id',myRestaurantId).gte('created_at',start.toISOString());
  const fot_used=(payouts||[]).reduce((s,p)=>s+Number(p.amount),0);
  const {jsPDF}=window.jspdf; const doc=new jsPDF();

  // === БЕЗ ХАРДКОДА — ИЗ БД И ПЕРЕВОДА ===
  const restName = restNameCache || document.getElementById('ownerRest').textContent || 'Restaurant';
  const motto = t('motto');
  const title = t('pdfTitle');
  const footer = t('pdfFooter');

  doc.setFontSize(14);
  doc.text(`${restName} - ${motto}`, 10, 15);
  doc.setFontSize(10);
  doc.text(`${title} ${start.toLocaleDateString(curLang)} | FOT ${fot_used}/${settings?.fot_limit||'-'}`, 10, 22);

  let y=32;
  doc.setFontSize(9);
  (attend||[]).forEach(a=>{doc.text(`${a.profiles.full_name} ${a.hours_worked||0}h ${a.work_date}`,10,y); y+=6; if(y>270){doc.addPage(); y=15;}});
  y+=5;
  (wastes||[]).forEach(w=>{doc.text(`WASTE ${w.products?.name||w.item_id} ${w.qty} by ${w.profiles?.full_name||'chef'}`,10,y); y+=6; if(y>270){doc.addPage(); y=15;}});

  doc.setFontSize(8);
  doc.text(footer,10,285);
  doc.text(`HotPit KITCHEN v3.2 • ${restName}`,10,290);

  doc.save(`${restName}_${start.getMonth()+1}_${title}.pdf`);
  if(settings?.accountant_email) window.open(`mailto:${settings.accountant_email}?subject=${restName} - ${title} ${start.getMonth()+1}`);
}
document.getElementById('logout').onclick=async()=>{await sb.auth.signOut(); localStorage.clear(); location.href='/';};
init();
</script>
