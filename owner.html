<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit - Персонал</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Manrope,sans-serif;display:flex;min-height:100vh}
.sidebar{width:200px;background:#0f0f0f;border-right:1px solid #1e1e1e;position:fixed;left:0;top:0;bottom:0;padding:16px 10px;display:flex;flex-direction:column;z-index:100;transition:.3s}
.logo{margin-bottom:24px;padding-left:4px}
.hot{font-size:22px;font-weight:800;color:#fff;line-height:1;letter-spacing:-.5px}
.kit{font-size:11px;letter-spacing:3px;color:#ff6b00;font-weight:700}
.sub{font-size:9px;color:#555;margin-top:2px}
.close-btn{position:absolute;top:14px;right:10px;width:28px;height:28px;background:#1a1a1a;border:1px solid #222;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#888}
.menu{flex:1;display:flex;flex-direction:column;gap:4px;margin-top:20px}
.menu-item{padding:10px 10px;border-radius:10px;color:#666;display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer;border:1px solid transparent}
.menu-item.active{background:rgba(255,107,0,.18);color:#ff8c00;border-color:rgba(255,107,0,.25)}
.bottom{margin-top:auto;padding-top:14px;border-top:1px solid #1a1a1a}
.user-mini{display:flex;align-items:center;gap:8px;background:#151515;border:1px solid #222;border-radius:10px;padding:8px 10px;font-size:12px}
.main{margin-left:200px;flex:1;padding:16px;background:#080808;transition:.3s}
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.burger{width:36px;height:36px;background:#151515;border:1px solid #222;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.card{background:#151515;border:1px solid #222;border-radius:16px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:#ff6b00}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0);width:200px}.main{margin-left:0}.main.dim{opacity:.3}}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
<div class="close-btn" id="closeBtn">✕</div>
<div class="logo"><div class="hot">HotPit</div><div class="kit">KITCHEN</div><div class="sub">система управления</div></div>
<div class="menu">
<div class="menu-item">☰ Дашборд</div>
<div class="menu-item active">👥 Персонал</div>
<div class="menu-item">≡ Заказы</div>
<div class="menu-item">🍽 Меню</div>
<div class="menu-item">📊 Отчёты</div>
<div class="menu-item">⚙ Настройки</div>
</div>
<div class="bottom"><div class="user-mini"><div>👑</div><div><div id="pName" style="font-weight:700">Загрузка...</div><div id="pRest" style="font-size:10px;color:#666"></div></div><div style="margin-left:auto">›</div></div></div>
</div>

<div class="main" id="main">
<div class="topbar"><div class="burger" id="openBtn">☰</div><div style="font-size:20px;font-weight:800">Персонал</div></div>
<div id="content">Загрузка...</div>
</div>

<script>
const sbd=document.getElementById('sidebar'), main=document.getElementById('main');
document.getElementById('openBtn').onclick=()=>{sbd.classList.add('open');main.classList.add('dim')}
document.getElementById('closeBtn').onclick=()=>{sbd.classList.remove('open');main.classList.remove('dim')}
main.onclick=(e)=>{if(window.innerWidth<769 && sbd.classList.contains('open') && !e.target.closest('#openBtn')){sbd.classList.remove('open');main.classList.remove('dim')}}
</script>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const sb=createClient('https://xljogkyropyocvuuodfl.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs')
const {data:{user}}=await sb.auth.getUser()
if(!user) location.href='/'
const {data:prof}=await sb.from('profiles').select('full_name,restaurant_id,restaurants(name)').eq('id',user.id).single()
if(prof){
 document.getElementById('pName').textContent=prof.full_name||'Владелец'
 document.getElementById('pRest').textContent=prof.restaurants?.name||''
 const {data:team}=await sb.from('profiles').select('full_name,role').eq('restaurant_id',prof.restaurant_id)
 let html=`<div class="card"><div style="font-weight:800;margin-bottom:12px">👥 Команда Кухни</div>`
 if(team?.length){html+=team.map(t=>`<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #222"><div style="width:36px;height:36px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center">${t.full_name[0]}</div><div><b>${t.full_name}</b><div style="font-size:12px;color:#666">${t.role}</div></div></div>`).join('')}else{html+='<div style="color:#666">Команда пуста</div>'}
 html+=`</div><div class="card"><div style="font-weight:800">✦ Пригласить Шефа</div><input style="width:100%;background:#0f0f0f;border:1px solid #333;border-radius:12px;padding:12px;color:#fff;margin:10px 0" placeholder="email@пример.com"><button style="width:100%;border:1px solid #ff6b00;background:transparent;color:#ff8c00;padding:12px;border-radius:12px">Отправить приглашение</button></div><div class="card"><div style="font-weight:800">💲 ФОТ Месяц</div><div style="color:#888;margin-top:8px">Данные из базы...</div></div>`
 document.getElementById('content').innerHTML=html
}
</script>
</body>
</html>
