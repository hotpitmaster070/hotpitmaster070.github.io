<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit - Owner OS</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Manrope,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:16px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.header h1{margin:0;font-size:22px;font-weight:800}.header span{color:#ff6b00}
.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:8px;margin-bottom:14px}
.tab{white-space:nowrap;background:#151515;border:1px solid #2a2a2a;color:#666;padding:8px 14px;border-radius:20px;font-weight:800;font-size:12px;cursor:pointer}
.tab.active{background:#ff6b00;color:#000;border-color:#ff6b00}
.card{background:#121212;border:1px solid #242424;border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center}
.btn{background:#ff6b00;color:#000;border:none;padding:12px 16px;border-radius:12px;font-weight:800;cursor:pointer;width:100%}
.btn-sec{background:#1a1a1a;color:#fff;border:1px solid #2a2a2a;padding:10px 14px;border-radius:12px;font-weight:700;cursor:pointer}
input{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:12px;color:#fff;margin-bottom:10px;outline:none}
</style>
</head>
<body>
<div class="wrap">
<div class="header"><h1>HotPit <span>OWNER</span></h1><button class="btn-sec" id="logout">Выйти</button></div>
<div id="restName" style="color:#666;font-size:12px;margin-bottom:12px">Загрузка...</div>
<div class="tabs">
<button class="tab active" data-tab="staff">Персонал</button>
<button class="tab" data-tab="fot">ФОТ</button>
<button class="tab" data-tab="stock">Склад</button>
<button class="tab" data-tab="history">История списаний</button>
<button class="tab" data-tab="requests">Запросы</button>
<button class="tab" data-tab="settings">Бухгалтерия</button>
</div>
<div id="tab-staff"></div><div id="tab-fot" style="display:none"></div><div id="tab-stock" style="display:none"></div><div id="tab-history" style="display:none"></div><div id="tab-requests" style="display:none"></div><div id="tab-settings" style="display:none"></div>
</div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const sb=createClient('https://xljogkyropyocvuuodfl.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs')
let myRestaurantId=null, settings=null;
async function init(){
  const {data:{user}} = await sb.auth.getUser(); if(!user){location.href='/'; return}
  const {data:p} = await sb.from('profiles').select('*').eq('id',user.id).single();
  myRestaurantId=p.restaurant_id||localStorage.getItem('restaurant_id');
  const {data:r} = await sb.from('restaurants').select('name').eq('id',myRestaurantId).single();
  document.getElementById('restName').textContent=r?.name||myRestaurantId;
  const {data:s} = await sb.from('restaurant_settings').select('*').eq('restaurant_id',myRestaurantId).single(); settings=s;
  renderStaff(); renderFOT(); renderStock(); renderHistory(); renderRequests(); renderSettings();
}
document.querySelectorAll('.tab').forEach(t=>{t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.querySelectorAll('[id^="tab-"]').forEach(d=>d.style.display='none');document.getElementById('tab-'+t.dataset.tab).style.display='block';}});

async function renderStaff(){
  const {data}=await sb.from('profiles').select('*').eq('restaurant_id',myRestaurantId).eq('is_active',true);
  document.getElementById('tab-staff').innerHTML=`<div class="card"><h3>Команда</h3>${(data||[]).map(u=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1a1a1a"><div><b>${u.full_name}</b><div style="color:#666;font-size:12px">${u.job_title||u.role} • ${u.salary||0}</div></div><span style="color:#888">${u.role}</span></div>`).join('')}</div>`;
}
async function renderFOT(){
  const fotLimit=settings?.fot_limit||400000;
  const {data:payouts}=await sb.from('payouts').select('*,profiles(full_name)').eq('restaurant_id',myRestaurantId).gte('created_at',new Date(new Date().setDate(1)).toISOString());
  const used=(payouts||[]).reduce((s,p)=>s+Number(p.amount),0);
  document.getElementById('tab-fot').innerHTML=`<div class="card"><h3>ФОТ</h3><div>Лимит (только овнер): <b>${fotLimit}</b></div><div>Использовано: <b style="color:${used>fotLimit?'#ff4444':'#00ff88'}">${used}</b></div><input id="fotLimitInput" type="number" value="${fotLimit}"><button class="btn-sec" id="saveFot">Сохранить лимит</button><button class="btn" id="closeMonthBtn" style="margin-top:12px">Закрыть месяц и отправить PDF в бухгалтерию →</button></div><div class="card">${(payouts||[]).map(p=>`<div>${p.profiles?.full_name} - ${p.amount}</div>`).join('')||'Нет выплат'}</div>`;
  document.getElementById('saveFot').onclick=async()=>{await sb.from('restaurant_settings').update({fot_limit:parseInt(document.getElementById('fotLimitInput').value)}).eq('restaurant_id',myRestaurantId);alert('Сохранено')};
  document.getElementById('closeMonthBtn').onclick=closeMonthAndPDF;
}
async function renderStock(){
  const {data}=await sb.from('products').select('*').eq('restaurant_id',myRestaurantId);
  document.getElementById('tab-stock').innerHTML=`<div class="card"><h3>Склад - списывает только овнер</h3>${(data||[]).map(p=>`<div style="display:flex;justify-content:space-between;padding:8px 0"><div><b>${p.name}</b><div style="color:#666">${p.qty||p.stock||0} ${p.unit||''}</div></div><button class="btn-sec" onclick="doWaste('${p.id}')">Списать</button></div>`).join('')}</div>`;
}
window.doWaste=async(id)=>{
  const qty=prompt('Сколько?'); if(!qty) return; const reason=prompt('Причина?')||'waste';
  await sb.from('stock_moves').insert({restaurant_id:myRestaurantId,item_id:id,qty:parseFloat(qty),type:'waste'});
  const {data:prod}=await sb.from('products').select('qty,stock').eq('id',id).single();
  const cur=parseFloat(prod?.qty??prod?.stock??0);
  await sb.from('products').update({qty:cur-parseFloat(qty),stock:cur-parseFloat(qty)}).eq('id',id);
  alert('Списано в Историю'); renderStock(); renderHistory();
};
async function renderHistory(){
  const {data:moves}=await sb.from('stock_moves').select('*').eq('restaurant_id',myRestaurantId).order('created_at',{ascending:false}).limit(100);
  document.getElementById('tab-history').innerHTML=`<div class="card"><h3>История списаний - отдельный раздел</h3>${(moves||[]).map(m=>`<div style="padding:8px 0;border-bottom:1px solid #1a1a1a"><b>${m.type}</b> - ${m.qty} - ${new Date(m.created_at).toLocaleString()}</div>`).join('')||'Нет'}</div>`;
}
async function renderRequests(){
  const {data}=await sb.from('dismiss_requests').select('*').eq('restaurant_id',myRestaurantId).eq('status','pending');
  document.getElementById('tab-requests').innerHTML=`<div class="card"><h3>Запросы</h3>${(data||[]).map(r=>`<div class="card" style="background:#1a1a1a"><b>${r.user_id}</b><div>${r.reason}</div><button class="btn-sec" onclick="approveDismiss('${r.id}','${r.user_id}')">Одобрить увольнение</button></div>`).join('')||'Нет запросов'}</div>`;
}
window.approveDismiss=async(id,uid)=>{await sb.from('dismiss_requests').update({status:'approved'}).eq('id',id);await sb.from('profiles').update({is_active:false}).eq('id',uid);alert('OK');};
async function renderSettings(){
  document.getElementById('tab-settings').innerHTML=`<div class="card"><h3>Бухгалтерия</h3><input id="accEmail" value="${settings?.accountant_email||''}" placeholder="Email бухгалтера"><input id="accTg" value="${settings?.accountant_telegram||''}" placeholder="Telegram @"><button class="btn-sec" id="saveAcc">Сохранить</button></div>`;
  document.getElementById('saveAcc').onclick=async()=>{await sb.from('restaurant_settings').update({accountant_email:document.getElementById('accEmail').value,accountant_telegram:document.getElementById('accTg').value}).eq('restaurant_id',myRestaurantId);alert('Сохранено')};
}
async function closeMonthAndPDF(){
  const btn=document.getElementById('closeMonthBtn'); btn.textContent='Формирую...'; btn.disabled=true;
  const start=new Date(); start.setDate(1);
  const {data:attend}=await sb.from('attendance').select('*,profiles!inner(full_name)').eq('restaurant_id',myRestaurantId).gte('work_date',start.toISOString().split('T')[0]);
  const {data:payouts}=await sb.from('payouts').select('*,profiles(full_name)').eq('restaurant_id',myRestaurantId).gte('created_at',start.toISOString());
  const {data:wastes}=await sb.from('stock_moves').select('*').eq('restaurant_id',myRestaurantId).gte('created_at',start.toISOString());
  const fot_used=(payouts||[]).reduce((s,p)=>s+Number(p.amount),0);
  const {jsPDF}=window.jspdf; const doc=new jsPDF();
  doc.text(`HotPit Report ${start.toLocaleDateString()}`,10,15);
  doc.text(`FOT ${fot_used}/${settings?.fot_limit||400000}`,10,25);
  let y=35; (attend||[]).forEach(a=>{doc.text(`${a.profiles.full_name} - ${a.hours_worked||0}h`,10,y); y+=6; if(y>270){doc.addPage(); y=15}});
  y+=5; (payouts||[]).forEach(p=>{doc.text(`Pay ${p.profiles?.full_name} ${p.amount}`,10,y); y+=6});
  y+=5; (wastes||[]).forEach(w=>{doc.text(`Waste ${w.qty} ${w.type}`,10,y); y+=6});
  doc.text('Built to help children without parents',10,285);
  doc.save(`HotPit_${myRestaurantId}_${start.getMonth()+1}.pdf`);
  if(settings?.accountant_email) window.open(`mailto:${settings.accountant_email}?subject=HotPit Report&body=FOT ${fot_used}`);
  btn.textContent='Закрыть месяц и отправить PDF в бухгалтерию →'; btn.disabled=false;
}
document.getElementById('logout').onclick=async()=>{await sb.auth.signOut(); localStorage.clear(); location.href='/';};
init();
</script>
</body>
</html>
