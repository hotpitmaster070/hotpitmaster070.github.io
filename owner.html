<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit Owner</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Manrope,sans-serif;display:flex;min-height:100vh}
.sidebar{width:240px;background:#0a0a0a;border-right:1px solid #1a1a1a;padding:16px 12px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:20}
.logo{margin-bottom:32px}.logo b{font-size:26px;font-weight:800;line-height:1}.logo b span{color:#ff6b00}.logo div{font-size:10px;color:#444;letter-spacing:1px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav button{background:transparent;border:none;color:#555;padding:12px 12px;border-radius:12px;text-align:left;font-weight:500;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13px}
.nav button.active{background:#1c130a;color:#ff8c00}
.owner-card{margin-top:auto;background:#151515;border:1px solid #242424;border-radius:14px;padding:10px;display:flex;align-items:center;gap:10px;cursor:pointer}
.owner-card img{width:32px;height:32px;border-radius:50%;background:#222}
.main{margin-left:240px;flex:1;padding:16px;background:#080808}
@media(max-width:800px){.sidebar{transform:translateX(-110%);width:85%;transition:.3s}.sidebar.show{transform:translateX(0)}.main{margin-left:0}}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.top h1{margin:0;font-size:22px;font-weight:800}
.card{background:#121212;border:1px solid #242424;border-radius:16px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.card.orange{border-left:4px solid #ff6b00}
.person{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #1a1a1a}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:#1e1e1e}
.avatar.ak{background:#2a1a14;color:#ff6b00}.avatar.m{background:#1e1530;color:#8b5cf6}.avatar.d{background:#152030;color:#60a5fa}
.badge{font-size:10px;padding:3px 8px;border-radius:10px;background:#1a2a1a;color:#22c55e;border:1px solid #22c55e33}
.badge.off{background:#2a2a2a;color:#888;border-color:#333}
.input{width:100%;background:#0a0a0a;border:1px solid #ff6b00;color:#fff;padding:12px;border-radius:10px;margin-bottom:10px;outline:none}
.btn{width:100%;background:transparent;border:1px solid #ff6b00;color:#ff6b00;padding:12px;border-radius:10px;font-weight:800;cursor:pointer}
.btn-fill{background:#ff6b00;color:#000;border:none;padding:12px 16px;border-radius:10px;font-weight:800;cursor:pointer;width:100%}
.progress{height:8px;background:#1e1e1e;border-radius:10px;overflow:hidden;margin:10px 0}.progress div{height:100%;background:#ff6b00}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="logo"><b>HotPit<br><span>KITCHEN</span></b><div>система управления</div></div>
  <div class="nav">
    <button data-tab="dash">📊 Дашборд</button>
    <button data-tab="staff" class="active">👥 Персонал</button>
    <button data-tab="orders">📋 Заказы</button>
    <button data-tab="menu">🍽️ Меню</button>
    <button data-tab="fot">📊 Отчёты</button>
    <button data-tab="stock">📦 Склад</button>
    <button data-tab="history">📜 История списаний</button>
    <button data-tab="settings">⚙️ Настройки</button>
  </div>
  <div class="owner-card" id="ownerCard"><img id="ownerImg" src=""><div><div style="font-size:13px;font-weight:700" id="ownerName">Владелец</div><div class="muted" style="font-size:11px;color:#666" id="ownerRest">Загрузка...</div></div><div style="margin-left:auto">›</div></div>
</div>
<div class="main">
  <div class="top"><button id="burger" style="background:#1a1a1a;border:1px solid #2a2a2a;color:#fff;padding:8px 12px;border-radius:10px">☰</button><h1 id="pageTitle">Персонал</h1></div>

  <div id="tab-staff">
    <div class="card orange"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="color:#ff6b00">👥</span><b>Команда Кухни</b></div><div id="teamList"></div></div>
    <div class="card orange"><div style="display:flex;gap:8px;margin-bottom:12px"><span style="color:#ff6b00">➕</span><b>Пригласить Шефа</b></div><input class="input" id="inviteEmail" placeholder="email@пример.com"><button class="btn" id="inviteBtn">Отправить приглашение</button><div class="muted" style="font-size:11px;color:#666;margin-top:8px">Шеф получит ссылку и создаст аккаунт повара - без костылей для аренды</div></div>
    <div class="card orange" id="fotCard"></div>
  </div>

  <div id="tab-fot" style="display:none"></div>
  <div id="tab-stock" style="display:none"></div>
  <div id="tab-history" style="display:none"></div>
  <div id="tab-settings" style="display:none"></div>
  <div id="tab-dash" style="display:none"><div class="card">Дашборд в разработке - используй Персонал и ФОТ</div></div>
  <div id="tab-orders" style="display:none"><div class="card">Заказы - скоро</div></div>
  <div id="tab-menu" style="display:none"><div class="card">Меню - скоро</div></div>
</div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const sb=createClient('https://xljogkyropyocvuuodfl.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs')
let myRestaurantId=null, settings=null, ownerId=null, ownerProfile=null;
async function init(){
  const {data:{user}} = await sb.auth.getUser(); if(!user){location.href='/'; return}
  const {data:p}=await sb.from('profiles').select('*').eq('id',user.id).single(); myRestaurantId=p.restaurant_id||localStorage.getItem('restaurant_id'); ownerProfile=p;
  const {data:r}=await sb.from('restaurants').select('name,owner_id').eq('id',myRestaurantId).single(); ownerId=r?.owner_id;
  document.getElementById('ownerRest').textContent=r?.name||'Ресторан'; document.getElementById('ownerName').textContent=p.full_name||'Владелец';
  const {data:s}=await sb.from('restaurant_settings').select('*').eq('restaurant_id',myRestaurantId).single(); settings=s;
  renderTeam(); renderFOTCards(); renderStock(); renderHistory(); renderSettingsTab();
}
document.getElementById('burger').onclick=()=>document.getElementById('sidebar').classList.toggle('show');
document.querySelectorAll('.nav button').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); document.getElementById('pageTitle').textContent=b.textContent.trim(); document.querySelectorAll('[id^="tab-"]').forEach(d=>d.style.display='none'); const tab=document.getElementById('tab-'+b.dataset.tab); if(tab) tab.style.display='block'; if(innerWidth<800) document.getElementById('sidebar').classList.remove('show');}});

async function renderTeam(){
  const {data}=await sb.from('profiles').select('*').eq('restaurant_id',myRestaurantId).eq('is_active',true).neq('id',ownerId||'');
  const filtered=(data||[]).filter(u=>u.role!=='owner');
  const list=document.getElementById('teamList');
  list.innerHTML=filtered.map((u,i)=>{
    const initials=(u.full_name||'U').split(' ').map(s=>s[0]).join('').slice(0,2).toUpperCase();
    const cls=i===0?'ak':i===1?'m':'d';
    return `<div class="person"><div class="avatar ${cls}">${initials}</div><div style="flex:1"><div style="display:flex;gap:8px;align-items:center"><b>${u.full_name}</b><span class="badge">На смене</span></div><div style="color:#888;font-size:13px">${u.job_title||u.role||'Повар'}</div></div></div>`;
  }).join('')||`<div style="color:#666">Нет персонала - пригласи шефа ниже</div>`;
}
async function renderFOTCards(){
  const limit=settings?.fot_limit; // без хардкода
  const {data:payouts}=await sb.from('payouts').select('*').eq('restaurant_id',myRestaurantId).gte('created_at',new Date(new Date().setDate(1)).toISOString());
  const used=(payouts||[]).reduce((s,p)=>s+Number(p.amount),0);
  const percent=limit?Math.round(used/limit*100):0;
  const left=limit?limit-used:0;
  const html=`<div style="display:flex;gap:8px;margin-bottom:8px"><span style="color:#ff6b00">💰</span><b>ФОТ Месяц</b></div>${!limit?`<div style="color:#ff8c00">Лимит не установлен - введи в Настройках</div><button class="btn" onclick="document.querySelector('[data-tab=settings]').click()">Перейти в Настройки</button>`:`<div style="color:#888;font-size:13px">${percent}% • ${used} / ${limit} ${settings?.currency||'₽'}</div><div class="progress"><div style="width:${Math.min(100,percent)}%"></div></div><div style="display:flex;justify-content:space-between;color:#666;font-size:12px"><span>До лимита осталось ${left} ${settings?.currency||'₽'}</span><span>${percent}%</span></div>`}<button class="btn-fill" id="pdfBtn" style="margin-top:12px">Отправить PDF в бухгалтерию →</button>`;
  document.getElementById('fotCard').innerHTML=html;
  document.getElementById('tab-fot').innerHTML=`<div class="card orange">${html}</div><div class="card">${(payouts||[]).map(p=>`<div style="display:flex;justify-content:space-between;padding:6px 0"><span>${p.profile_id}</span><b>${p.amount}</b></div>`).join('')||'Нет выплат'}</div>`;
  document.getElementById('pdfBtn')?.addEventListener('click',closeMonthAndPDF);
  document.getElementById('tab-fot').querySelector('#pdfBtn')?.addEventListener('click',closeMonthAndPDF);
}
async function renderStock(){const {data}=await sb.from('products').select('*').eq('restaurant_id',myRestaurantId); document.getElementById('tab-stock').innerHTML=`<div class="card orange"><h3>Склад - списывает только овнер</h3>${(data||[]).map(p=>`<div style="display:flex;justify-content:space-between;padding:8px 0"><div><b>${p.name}</b><div style="color:#666">${p.qty||p.stock||0}</div></div><button class="btn" style="width:auto;padding:6px 12px" onclick="doWaste('${p.id}')">Списать</button></div>`).join('')}</div>`;}
window.doWaste=async(id)=>{const qty=prompt('Сколько?'); if(!qty) return; await sb.from('stock_moves').insert({restaurant_id:myRestaurantId,item_id:id,qty:parseFloat(qty),type:'waste'}); const {data:prod}=await sb.from('products').select('qty,stock').eq('id',id).single(); const cur=parseFloat(prod?.qty??prod?.stock??0); await sb.from('products').update({qty:cur-parseFloat(qty),stock:cur-parseFloat(qty)}).eq('id',id); renderHistory();};
async function renderHistory(){const {data}=await sb.from('stock_moves').select('*').eq('restaurant_id',myRestaurantId).order('created_at',{ascending:false}).limit(100); document.getElementById('tab-history').innerHTML=`<div class="card orange"><h3>📜 История списаний - отдельный раздел</h3>${(data||[]).map(m=>`<div style="padding:8px 0;border-bottom:1px solid #1a1a1a">${m.type} ${m.qty} ${new Date(m.created_at).toLocaleString()}</div>`).join('')||'Нет'}</div>`;}
async function renderSettingsTab(){
  document.getElementById('tab-settings').innerHTML=`<div class="card orange"><h3>⚙️ Настройки для аренды</h3><div style="color:#666;font-size:12px">ФОТ лимит (своя валюта)</div><input class="input" id="fotLimit" type="number" value="${settings?.fot_limit||''}" placeholder="5000"><div style="color:#666;font-size:12px">Бухгалтерия</div><input class="input" id="accEmail" value="${settings?.accountant_email||''}" placeholder="Email"><input class="input" id="accTg" value="${settings?.accountant_telegram||''}" placeholder="Telegram"><button class="btn-fill" id="saveSettings">Сохранить</button></div>`;
  document.getElementById('saveSettings').onclick=async()=>{const upd={fot_limit:document.getElementById('fotLimit').value?parseInt(document.getElementById('fotLimit').value):null,accountant_email:document.getElementById('accEmail').value,accountant_telegram:document.getElementById('accTg').value}; await sb.from('restaurant_settings').update(upd).eq('restaurant_id',myRestaurantId); settings={...settings,...upd}; alert('Сохранено'); renderFOTCards();};
}
document.getElementById('inviteBtn').onclick=async()=>{
  const email=document.getElementById('inviteEmail').value.trim(); if(!email){alert('Введи email'); return}
  // Для аренды - создаем приглашение, можно через таблицу invites или просто показываем ссылку
  alert(`Приглашение для ${email} - скинь ему ссылку: https://itmaster070.github.io/?invite=${myRestaurantId}. Он создаст аккаунт шефа в твоем ресторане`);
};
async function closeMonthAndPDF(){
  const start=new Date(); start.setDate(1);
  const {data:attend}=await sb.from('attendance').select('*,profiles!inner(full_name)').eq('restaurant_id',myRestaurantId).gte('work_date',start.toISOString().split('T')[0]);
  const {data:payouts}=await sb.from('payouts').select('*').eq('restaurant_id',myRestaurantId).gte('created_at',start.toISOString());
  const {data:wastes}=await sb.from('stock_moves').select('*').eq('restaurant_id',myRestaurantId).gte('created_at',start.toISOString());
  const {jsPDF}=window.jspdf; const doc=new jsPDF(); doc.text(`HotPit ${start.toLocaleDateString()} FOT ${settings?.fot_limit||''}`,10,15); let y=25; (attend||[]).forEach(a=>{doc.text(`${a.profiles.full_name} ${a.hours_worked}h`,10,y); y+=6}); doc.save(`HotPit.pdf`); if(settings?.accountant_email) window.open(`mailto:${settings.accountant_email}?subject=Report`);
}
init();
</script>
</body>
</html>
