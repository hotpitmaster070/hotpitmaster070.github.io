<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit Owner</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Manrope,sans-serif;display:flex;min-height:100vh}
.sidebar{width:260px;background:#0f0f0f;border-right:1px solid #1e1e1e;padding:18px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:10;transform:translateX(0);transition:.3s}
.sidebar.hide{transform:translateX(-100%)}
.logo{display:flex;gap:10px;align-items:center;margin-bottom:28px}.logo-img{width:44px;height:44px;border-radius:10px}
.nav{display:flex;flex-direction:column;gap:6px;flex:1}
.nav button{background:transparent;border:1px solid transparent;color:#666;padding:11px 14px;border-radius:12px;text-align:left;font-weight:700;cursor:pointer;display:flex;gap:10px;align-items:center}
.nav button.active{background:#1a1a1a;border-color:#2a2a2a;color:#fff}.nav button.active span{color:#ff6b00}
.main{margin-left:260px;flex:1;padding:18px;max-width:600px;width:100%}
@media(max-width:800px){.sidebar{width:85%}.main{margin-left:0}}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.card{background:#121212;border:1px solid #242424;border-radius:16px;padding:14px;margin-bottom:12px}
.btn{background:#ff6b00;color:#000;border:none;padding:12px 16px;border-radius:12px;font-weight:800;cursor:pointer;width:100%}
.btn-sec{background:#1a1a1a;color:#fff;border:1px solid #2a2a2a;padding:10px 14px;border-radius:12px;font-weight:700;cursor:pointer}
input{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:12px;color:#fff;margin-bottom:10px;outline:none}
.muted{color:#666;font-size:12px}
.burger{display:none}@media(max-width:800px){.burger{display:block}}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="logo"><img src="logo.png" class="logo-img"><div><div style="font-weight:800;color:#ff6b00">HotPit</div><div style="font-size:11px;letter-spacing:3px;color:#aaa">OWNER</div></div></div>
  <div class="nav">
    <button data-tab="dash" class="active"><span>📊</span> Дашборд</button>
    <button data-tab="staff"><span>👥</span> Персонал</button>
    <button data-tab="shifts"><span>⏰</span> Смены</button>
    <button data-tab="fot"><span>💰</span> ФОТ</button>
    <button data-tab="stock"><span>📦</span> Склад</button>
    <button data-tab="history"><span>📜</span> История списаний</button>
    <button data-tab="requests"><span>📩</span> Запросы</button>
    <button data-tab="settings"><span>⚙️</span> Настройки</button>
  </div>
  <button class="btn-sec" id="logout">Выйти</button>
</div>
<div class="main">
  <div class="topbar"><button class="btn-sec burger" id="burger">☰</button><div id="restName" class="muted">Загрузка...</div></div>
  <div id="tab-dash"></div><div id="tab-staff" style="display:none"></div><div id="tab-shifts" style="display:none"></div><div id="tab-fot" style="display:none"></div><div id="tab-stock" style="display:none"></div><div id="tab-history" style="display:none"></div><div id="tab-requests" style="display:none"></div><div id="tab-settings" style="display:none"></div>
</div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const sb=createClient('https://xljogkyropyocvuuodfl.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs')
let myRestaurantId=null, settings=null;
async function init(){
  const {data:{user}} = await sb.auth.getUser(); if(!user){location.href='/'; return}
  const {data:p}=await sb.from('profiles').select('*').eq('id',user.id).single(); myRestaurantId=p.restaurant_id||localStorage.getItem('restaurant_id');
  const {data:r}=await sb.from('restaurants').select('name').eq('id',myRestaurantId).single(); document.getElementById('restName').textContent=r?.name||'';
  const {data:s}=await sb.from('restaurant_settings').select('*').eq('restaurant_id',myRestaurantId).single(); settings=s;
  renderDash(); renderStaff(); renderShifts(); renderFOT(); renderStock(); renderHistory(); renderRequests(); renderSettings();
}
document.getElementById('burger').onclick=()=>document.getElementById('sidebar').classList.toggle('hide');
document.querySelectorAll('.nav button').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); document.querySelectorAll('[id^="tab-"]').forEach(d=>d.style.display='none'); document.getElementById('tab-'+b.dataset.tab).style.display='block'; if(innerWidth<800) document.getElementById('sidebar').classList.add('hide');}});

async function renderDash(){
  const {data:profiles}=await sb.from('profiles').select('id').eq('restaurant_id',myRestaurantId).eq('is_active',true);
  document.getElementById('tab-dash').innerHTML=`<div class="card"><h3 style="margin:0">Дашборд</h3><div class="muted">Команда: ${profiles?.length||0} • Ресторан ${myRestaurantId?.slice(0,8)}</div><div style="margin-top:12px"><button class="btn" id="btnPDFDash">Отправить отчет PDF в бухгалтерию →</button></div></div>`;
  document.getElementById('btnPDFDash').onclick=closeMonthAndPDF;
}
async function renderStaff(){const {data}=await sb.from('profiles').select('*').eq('restaurant_id',myRestaurantId).eq('is_active',true); document.getElementById('tab-staff').innerHTML=`<div class="card"><h3>Персонал</h3>${(data||[]).map(u=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1a1a1a"><div><b>${u.full_name}</b><div class="muted">${u.job_title||u.role} • ${u.salary||''}</div></div></div>`).join('')}</div>`;}
async function renderShifts(){const {data}=await sb.from('attendance').select('*,profiles!inner(full_name)').eq('restaurant_id',myRestaurantId).order('work_date',{ascending:false}).limit(50); document.getElementById('tab-shifts').innerHTML=`<div class="card"><h3>Смены / Часы</h3>${(data||[]).map(a=>`<div style="padding:6px 0;border-bottom:1px solid #1a1a1a"><b>${a.profiles.full_name}</b> ${a.work_date} ${a.hours_worked||0}ч</div>`).join('')||'<span class="muted">Нет данных</span>'}</div>`;}
async function renderFOT(){
  const fotLimit = settings?.fot_limit; // НЕТ ХАРДКОДА!
  const {data:payouts}=await sb.from('payouts').select('*,profiles(full_name)').eq('restaurant_id',myRestaurantId).gte('created_at',new Date(new Date().setDate(1)).toISOString());
  const used=(payouts||[]).reduce((s,p)=>s+Number(p.amount),0);
  document.getElementById('tab-fot').innerHTML=`<div class="card"><h3>ФОТ месяца</h3>${!fotLimit?`<div style="color:#ff8c00">⚠️ ФОТ лимит не установлен. Зайди в Настройки → установи лимит.</div>`: `<div>Лимит: <b>${fotLimit}</b> • Использовано: <b style="color:${used>(fotLimit||0)?'#ff4444':'#00ff88'}">${used}</b> • Остаток: <b>${(fotLimit||0)-used}</b></div>`}<button class="btn" id="closeMonthBtn" style="margin-top:12px">Закрыть месяц и отправить PDF →</button><div class="muted" style="margin-top:8px">В PDF войдет: часы, выплаты, история списаний (отдельный раздел)</div></div><div class="card">${(payouts||[]).map(p=>`<div style="display:flex;justify-content:space-between"><span>${p.profiles?.full_name}</span><b>${p.amount}</b></div>`).join('')||'<span class="muted">Нет выплат</span>'}</div>`;
  document.getElementById('closeMonthBtn').onclick=closeMonthAndPDF;
}
async function renderStock(){const {data}=await sb.from('products').select('*').eq('restaurant_id',myRestaurantId); document.getElementById('tab-stock').innerHTML=`<div class="card"><h3>Склад</h3><div class="muted">Списание делает только овнер (защита)</div>${(data||[]).map(p=>`<div style="display:flex;justify-content:space-between;padding:8px 0"><div><b>${p.name}</b><div class="muted">${p.qty||p.stock||0} ${p.unit||''}</div></div><button class="btn-sec" onclick="doWaste('${p.id}')">Списать</button></div>`).join('')}</div>`;}
window.doWaste=async(id)=>{const qty=prompt('Сколько?'); if(!qty) return; await sb.from('stock_moves').insert({restaurant_id:myRestaurantId,item_id:id,qty:parseFloat(qty),type:'waste'}); const {data:prod}=await sb.from('products').select('qty,stock').eq('id',id).single(); const cur=parseFloat(prod?.qty??prod?.stock??0); await sb.from('products').update({qty:cur-parseFloat(qty),stock:cur-parseFloat(qty)}).eq('id',id); alert('Списано в Историю'); renderHistory(); renderStock();}
async function renderHistory(){const {data}=await sb.from('stock_moves').select('*').eq('restaurant_id',myRestaurantId).order('created_at',{ascending:false}).limit(100); document.getElementById('tab-history').innerHTML=`<div class="card"><h3>📜 История списаний - отдельный раздел</h3>${(data||[]).map(m=>`<div style="padding:8px 0;border-bottom:1px solid #1a1a1a"><b>${m.type}</b> • ${m.qty} • ${new Date(m.created_at).toLocaleString()}</div>`).join('')||'Нет списаний'}</div>`;}
async function renderRequests(){const {data}=await sb.from('dismiss_requests').select('*').eq('restaurant_id',myRestaurantId).eq('status','pending'); document.getElementById('tab-requests').innerHTML=`<div class="card"><h3>Запросы от шефа</h3>${(data||[]).map(r=>`<div class="card" style="background:#1a1a1a"><div>${r.reason}</div><button class="btn-sec" onclick="approveDismiss('${r.id}','${r.user_id}')">Одобрить</button></div>`).join('')||'Нет запросов'}</div>`;}
window.approveDismiss=async(id,uid)=>{await sb.from('dismiss_requests').update({status:'approved'}).eq('id',id); await sb.from('profiles').update({is_active:false}).eq('id',uid); alert('OK')};

async function renderSettings(){
  document.getElementById('tab-settings').innerHTML=`
  <div class="card"><h3>⚙️ Настройки ресторана</h3>
    <div class="muted">ФОТ лимит - ставишь сам, без хардкода</div><input id="fotLimit" type="number" value="${settings?.fot_limit||''}" placeholder="ФОТ лимит, напр 5000">
    <div class="muted">Бухгалтерия</div><input id="accEmail" value="${settings?.accountant_email||''}" placeholder="Email бухгалтера"><input id="accTg" value="${settings?.accountant_telegram||''}" placeholder="Telegram бухгалтера">
    <div class="muted">Смены</div><input id="shiftStart" value="${settings?.shift_start||''}" placeholder="Начало смены 09:00"><input id="shiftEnd" value="${settings?.shift_end||''}" placeholder="Конец смены 23:00">
    <button class="btn" id="saveSettings">Сохранить все настройки</button>
  </div>`;
  document.getElementById('saveSettings').onclick=async()=>{
    const upd={fot_limit:document.getElementById('fotLimit').value?parseInt(document.getElementById('fotLimit').value):null, accountant_email:document.getElementById('accEmail').value, accountant_telegram:document.getElementById('accTg').value, shift_start:document.getElementById('shiftStart').value, shift_end:document.getElementById('shiftEnd').value};
    const {error}=await sb.from('restaurant_settings').update(upd).eq('restaurant_id',myRestaurantId);
    if(error) alert(error.message); else {settings={...settings,...upd}; alert('Сохранено'); renderFOT();}
  };
}
async function closeMonthAndPDF(){
  const start=new Date(); start.setDate(1);
  const {data:attend}=await sb.from('attendance').select('*,profiles!inner(full_name)').eq('restaurant_id',myRestaurantId).gte('work_date',start.toISOString().split('T')[0]);
  const {data:payouts}=await sb.from('payouts').select('*,profiles(full_name)').eq('restaurant_id',myRestaurantId).gte('created_at',start.toISOString());
  const {data:wastes}=await sb.from('stock_moves').select('*').eq('restaurant_id',myRestaurantId).gte('created_at',start.toISOString());
  const fot_used=(payouts||[]).reduce((s,p)=>s+Number(p.amount),0);
  const fot_limit=settings?.fot_limit||'не установлен';
  const {jsPDF}=window.jspdf; const doc=new jsPDF();
  doc.text(`HotPit - ${document.getElementById('restName').textContent} - ${start.toLocaleDateString()}`,10,15);
  doc.text(`FOT ${fot_used} / ${fot_limit}`,10,25);
  let y=35; doc.text('--- Staff ---',10,y); y+=7; (attend||[]).forEach(a=>{doc.text(`${a.profiles.full_name} ${a.work_date} ${a.hours_worked||0}h`,10,y); y+=6; if(y>270){doc.addPage(); y=15}});
  y+=5; doc.text('--- Payouts ---',10,y); y+=7; (payouts||[]).forEach(p=>{doc.text(`${p.profiles?.full_name} ${p.amount}`,10,y); y+=6});
  y+=5; doc.text('--- History waste (separate) ---',10,y); y+=7; (wastes||[]).forEach(w=>{doc.text(`${w.type} ${w.qty} ${new Date(w.created_at).toLocaleDateString()}`,10,y); y+=6});
  doc.text('Built to help children',10,285);
  doc.save(`HotPit_${myRestaurantId}_${start.getMonth()+1}.pdf`);
  if(settings?.accountant_email) window.open(`mailto:${settings.accountant_email}?subject=HotPit Report&body=FOT ${fot_used}/${fot_limit}`);
}
document.getElementById('logout').onclick=async()=>{await sb.auth.signOut(); localStorage.clear(); location.href='/';};
init();
</script>
</body>
</html>
