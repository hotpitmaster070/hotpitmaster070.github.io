<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit Owner - Final Reliable</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Manrope,sans-serif;display:flex;min-height:100vh;overflow-x:hidden}
.sidebar{width:200px;background:#0a0a0a;border-right:1px solid #1e1e1e;padding:12px 8px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:30;transition:transform.32s ease}
.sidebar.hide{transform:translateX(-100%)}
.side-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.logo{display:flex;gap:8px;align-items:center;cursor:pointer}
.logo img{width:38px;height:38px;border-radius:10px;background:#111}
.orange{color:#ff6b00}.white{color:#fff;letter-spacing:4px;font-weight:300;font-size:10px;display:block}
.logo small{font-size:9px;color:#555;display:block;margin-top:2px;line-height:1.2}
.x-btn{width:30px;height:30px;background:#1a1a1a;border:1px solid #2a2a2a;color:#fff;border-radius:10px;cursor:pointer}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav button{background:transparent;border:none;color:#555;padding:10px 10px;border-radius:10px;text-align:left;cursor:pointer;display:flex;gap:8px;font-size:12px;font-weight:600}
.nav button.active{background:#1c130a;color:#ff8c00}
.owner-card{margin-top:auto;background:#151515;border:1px solid #242424;border-radius:12px;padding:8px;display:flex;gap:8px;align-items:center}
.main{margin-left:0;flex:1;padding:16px;width:100%;max-width:100%;transition:margin-left.32s ease, max-width.32s ease}
.main.shifted{margin-left:200px;max-width:calc(100% - 200px)}
@media(max-width:820px){.sidebar{width:165px}.main.shifted{margin-left:165px;max-width:calc(100% - 165px)}}
.card{background:#121212;border:1px solid #242424;border-radius:18px;padding:16px;margin-bottom:12px;border-left:4px solid #ff6b00}
.input{width:100%;background:#0a0a0a;border:1px solid #2a2a2a;color:#fff;padding:12px;border-radius:12px;margin-bottom:10px;outline:none}
.btn{width:100%;border:1px solid #ff6b00;color:#ff6b00;background:transparent;padding:12px;border-radius:12px;font-weight:800;cursor:pointer}
.btn-fill{width:100%;background:#ff6b00;color:#000;border:none;padding:12px;border-radius:12px;font-weight:800;cursor:pointer}
.muted{color:#666;font-size:12px}
.lang-main{background:#1a1a1a;border:1px solid #2a2a2a;color:#ff6b00;padding:8px 10px;border-radius:20px;font-weight:800;font-size:11px;cursor:pointer;width:100%}
.lang-popup{position:absolute;left:8px;top:100px;background:#151515;border:1px solid #2a2a2a;border-radius:12px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:5px;z-index:99;width:150px}
.lang-popup.hidden{display:none}
.lang-popup button{background:#0a0a0a;border:1px solid #242424;color:#999;padding:7px;border-radius:8px;font-size:11px;cursor:pointer}
.lang-popup button.active{background:#ff6b00;color:#000}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.3s}
.modal-bg.show{opacity:1;pointer-events:all}
.modal{width:90%;max-width:360px;background:#151515;border:1px solid #2a2a2a;border-radius:20px;padding:20px;border-left:4px solid #ff6b00}
</style>
</head>
<body>

<div class="sidebar hide" id="sidebar">
  <div class="side-head">
    <div class="logo" id="logoBtn"><img src="logo.png"><div><b><span class="orange">HotPit</span><br><span class="white">KITCHEN</span></b><small id="logoSub"></small></div></div>
    <button class="x-btn" id="xBtn">✕</button>
  </div>
  <button id="langBtn" class="lang-main">🌐 <span id="curLangCode">RU</span></button>
  <div id="langPopup" class="lang-popup hidden">
    <button data-l="ru">🇷🇺 RU</button><button data-l="az">🇦🇿 AZ</button><button data-l="tr">🇹🇷 TR</button><button data-l="en">🇺🇸 EN</button>
    <button data-l="ar">🇸🇦 AR</button><button data-l="es">🇪🇸 ES</button><button data-l="de">🇩🇪 DE</button><button data-l="it">🇮🇹 IT</button>
  </div>
  <div class="nav" style="margin-top:12px">
    <button data-tab="staff" class="active">👥 <span id="mStaff"></span></button>
    <button data-tab="orders">📋 <span id="mOrders"></span></button>
    <button data-tab="menu">🍽️ <span id="mMenu"></span></button>
    <button data-tab="fot">📊 <span id="mFot"></span></button>
    <button data-tab="stock">📦 <span id="mStock"></span></button>
    <button data-tab="history">📜 <span id="mHistory"></span></button>
    <button data-tab="settings">⚙️ <span id="mSettings"></span></button>
  </div>
  <div class="owner-card"><img id="ownerImg" src="logo.png" style="width:28px;height:28px;border-radius:50%"><div style="flex:1"><div id="ownerName" style="font-weight:700;font-size:12px"></div><div id="ownerRest" style="font-size:10px;color:#666"></div></div></div>
  <button class="btn" id="logout" style="margin-top:8px;border-color:#2a2a2a;color:#666;font-size:12px"></button>
</div>

<div class="main" id="mainBox">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><button id="burger" style="background:#1a1a1a;border:1px solid #2a2a2a;color:#fff;padding:8px 12px;border-radius:12px;cursor:pointer">☰</button><h2 id="pageTitle" style="margin:0;font-size:20px"></h2></div>
  <div id="content"></div>
</div>

<div class="modal-bg" id="inviteModal"><div class="modal"><h3>🔥 Приглашение готово</h3><div class="muted" style="font-size:12px">Ссылка для шефа:</div><div id="inviteLinkText" style="background:#0a0a0a;border:1px solid #2a2a2a;border-radius:10px;padding:10px;font-size:11px;color:#ff8c00;word-break:break-all;margin:10px 0"></div><div style="display:flex;gap:8px"><button class="btn-fill" id="copyInvite">Копировать →</button><button class="btn" id="closeInvite">Закрыть</button></div></div></div>

<script type="module">

const dict={

}
let curLang=localStorage.getItem('hp_lang')||'ru', myRestaurantId=null, settings=null, ownerId=null, restNameCache='Restaurant';
let currentTab='staff';
function t(k){return (dict[curLang]||dict.en)[k]||k;}
function renderCurrentTab(){
 if(currentTab==='staff') renderStaff();
 else if(currentTab==='settings') renderSettings();
 else {
   document.getElementById('pageTitle').textContent=t(currentTab);
   document.getElementById('content').innerHTML=`<div class="card"><div class="muted">${t('soon')}</div></div>`;
 }
}
function applyLang(l){
 curLang=l; localStorage.setItem('hp_lang',l);
 document.getElementById('curLangCode').textContent=l.toUpperCase();
 document.getElementById('logoSub').textContent=t('sub');
 document.getElementById('mStaff').textContent=t('staff');
 document.getElementById('mOrders').textContent=t('orders');
 document.getElementById('mMenu').textContent=t('menu');
 document.getElementById('mFot').textContent=t('fot');
 document.getElementById('mStock').textContent=t('stock');
 document.getElementById('mHistory').textContent=t('history');
 document.getElementById('mSettings').textContent=t('settings');
 document.getElementById('logout').textContent=t('logout');
 document.querySelectorAll('#langPopup button').forEach(b=>b.classList.toggle('active',b.dataset.l===l));
 renderCurrentTab();
}
async function init(){
 const {data:{user}}=await sb.auth.getUser(); if(!user){location.href='/';return}
 const {data:p}=await sb.from('profiles').select('*').eq('id',user.id).single();
 if(p?.preferred_language) curLang=p.preferred_language;
 myRestaurantId=p.restaurant_id; document.getElementById('ownerName').textContent=p.full_name||'Owner';
 const {data:r}=await sb.from('restaurants').select('name,owner_id').eq('id',myRestaurantId).single();
 restNameCache=r?.name||'Restaurant'; document.getElementById('ownerRest').textContent=restNameCache; ownerId=r?.owner_id;
 const {data:s}=await sb.from('restaurant_settings').select('*').eq('restaurant_id',myRestaurantId).single(); settings=s;
 applyLang(curLang);
}
document.getElementById('langBtn').onclick=()=>document.getElementById('langPopup').classList.toggle('hidden');
document.getElementById('langPopup').onclick=async e=>{
 if(e.target.dataset.l){
  const l=e.target.dataset.l;
  applyLang(l);
  document.getElementById('langPopup').classList.add('hidden');
  try{const {data:{user}}=await sb.auth.getUser(); if(user) await sb.from('profiles').update({preferred_language:l}).eq('id',user.id);}catch(_){}
 }
};
document.getElementById('burger').onclick=()=>{document.getElementById('sidebar').classList.remove('hide');document.getElementById('mainBox').classList.add('shifted')};
document.getElementById('xBtn').onclick=()=>{document.getElementById('sidebar').classList.add('hide');document.getElementById('mainBox').classList.remove('shifted')};
document.getElementById('logoBtn').onclick=()=>location.href='/';
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active')); b.classList.add('active');
 currentTab=b.dataset.tab;
 renderCurrentTab();
 if(innerWidth<820){document.getElementById('sidebar').classList.add('hide');document.getElementById('mainBox').classList.remove('shifted')}
});
document.getElementById('content').onclick=e=>{
 if(e.target.id==='inviteBtn'){
  const em=document.getElementById('inviteEmail').value.trim(); if(!em) return;
  const link=`${location.origin}/?invite=${myRestaurantId}&email=${encodeURIComponent(em)}`;
  document.getElementById('inviteLinkText').textContent=link; document.getElementById('inviteModal').classList.add('show');
 }
 if(e.target.id==='goSet'){currentTab='settings'; document.querySelector('[data-tab=settings]').click();}
 if(e.target.id==='saveSet') saveSettings();
};
async function renderStaff(){
 document.getElementById('pageTitle').textContent='👥 '+t('staff');
 let filtered=[]; try{ const {data}=await sb.from('profiles').select('*').eq('restaurant_id',myRestaurantId).eq('is_active',true); filtered=(data||[]).filter(u=>u.id!==ownerId && u.role!=='owner'); }catch(_){}
 const colors=['#ff6b00','#a855f7','#3b82f6','#22c55e'];
 const team=filtered.map((u,i)=>`<div style="display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #1a1a1a"><div style="width:38px;height:38px;border-radius:50%;background:${colors[i%4]}22;color:${colors[i%4]};display:flex;align-items:center;justify-content:center;font-weight:800">${(u.full_name||'U')[0]}</div><div><b>${u.full_name}</b><div class="muted">${u.job_title||u.role||''}</div></div><div style="margin-left:auto;background:#163a22;color:#4ade80;font-size:9px;padding:4px 8px;border-radius:10px">${t('onShift')}</div></div>`).join('')||`<div class="muted">${t('noStaff')}</div>`;
 document.getElementById('content').innerHTML=`
  <div class="card"><div style="font-weight:800">👥 ${t('team')}</div><div style="margin-top:10px">${team}</div></div>
  <div class="card"><div><span style="color:#ff6b00">+ </span><b>${t('invite')}</b></div><input class="input" id="inviteEmail" placeholder="${t('invitePh')}" style="margin-top:12px"><button class="btn" id="inviteBtn">${t('sendInvite')}</button><div class="muted" style="margin-top:8px">${t('inviteHint')}</div></div>
  <div class="card"><div>💰 <b>${t('fotMonth')}</b></div><div class="muted" style="margin-top:8px">${settings?.fot_limit?settings.fot_limit:t('limitNotSet')}</div><button class="btn" id="goSet" style="margin-top:10px">${t('goSettings')}</button></div>`;
}
async function renderSettings(){
 document.getElementById('pageTitle').textContent='⚙️ '+t('settings');
 document.getElementById('content').innerHTML=`
  <div class="card">
    <h3 style="margin:0 0 12px">${t('settingsTitle')}</h3>
    <div class="muted">${t('fotMonth')}</div>
    <input class="input" id="fotLimit" type="number" value="${settings?.fot_limit||''}" placeholder="${t('fotLimitPh')}">
    <div class="muted" style="margin-top:8px">${t('motto')}</div>
    <input class="input" id="mottoInput" value="${settings?.motto||''}" placeholder="${t('motto')}">
    <button class="btn-fill" id="saveSet">${t('save')}</button>
  </div>`;
}
async function saveSettings(){
 const upd={fot_limit:document.getElementById('fotLimit').value?parseInt(document.getElementById('fotLimit').value):null,motto:document.getElementById('mottoInput').value};
 const {error}=await sb.from('restaurant_settings').update(upd).eq('restaurant_id',myRestaurantId);
 if(error) alert(error.message); else {settings={...settings,...upd}; alert(t('saved')); renderStaff(); currentTab='staff';}
}
document.getElementById('closeInvite').onclick=()=>document.getElementById('inviteModal').classList.remove('show');
document.getElementById('copyInvite').onclick=()=>{navigator.clipboard.writeText(document.getElementById('inviteLinkText').textContent); document.getElementById('copyInvite').textContent='✓'; setTimeout(()=>document.getElementById('copyInvite').textContent='Копировать →',1200)};
document.getElementById('inviteModal').onclick=e=>{if(e.target.id==='inviteModal') e.currentTarget.classList.remove('show')};
document.getElementById('logout').onclick=async()=>{await sb.auth.signOut(); location.href='/'};
init();
</script>
