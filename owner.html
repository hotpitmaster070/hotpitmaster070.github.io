<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit Owner - Global</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--card:#121212;--card-2:#1a1a1a;--border:#242424;--text:#fff;--muted:#777;--accent:#ff6b00;--radius:20px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Manrope,sans-serif;min-height:100vh}
.app{display:flex;min-height:100vh}
.sidebar{width:280px;background:var(--card);border-right:1px solid var(--border);padding:28px 18px;display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:95;transition:transform .35s}
.sidebar.open{transform:translateX(0)}
.sidebar-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.logo-img{width:44px;height:44px;border-radius:10px}
.logo-text{line-height:.9}.logo-text .hot{color:var(--accent);font-weight:800;font-size:20px}.logo-text .kit{font-weight:300;font-size:10px;letter-spacing:3px}
.rest-name{color:var(--muted);font-size:11px;letter-spacing:1px;margin:16px 0 24px;padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{display:flex;flex-direction:column;gap:6px}
.menu button{background:transparent;border:1px solid transparent;color:#888;text-align:left;padding:12px 14px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:500;transition:.2s;font-family:Manrope,sans-serif;display:flex;align-items:center;gap:10px}
.menu button.active{border-color:rgba(255,107,0,.3);color:var(--accent);background:linear-gradient(90deg,rgba(255,107,0,.12),transparent)}
.content{flex:1;padding:24px;max-width:1100px;width:100%}
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:32px}
.topbar h1{flex:1;font-size:28px;font-weight:800}
.burger,.close-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:12px;cursor:pointer;font-size:18px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);display:none;z-index:90}
.overlay.show{display:block}
.card{background:var(--card);padding:24px;border-radius:var(--radius);margin-bottom:16px;border:1px solid var(--border)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stat{background:linear-gradient(180deg,#1a1a1a,#121212);border:1px solid var(--border);padding:20px;border-radius:16px}
.stat .num{font-size:28px;font-weight:800;margin:6px 0}
.progress{height:6px;background:#1e1e1e;border-radius:20px;overflow:hidden;margin:12px 0}
.progress>div{height:100%;background:var(--accent);transition:width .4s}
input{width:100%;padding:14px;background:#1a1a1a;border:1px solid var(--border);border-radius:12px;color:#fff;margin-top:8px;outline:none}input:focus{border-color:var(--accent)}
.btn-outline{border:1px solid var(--border);background:transparent;color:#fff;padding:12px;border-radius:12px;width:100%;font-weight:700;cursor:pointer;margin-top:10px}.btn-outline:hover{border-color:var(--accent)}
@media(min-width:901px){.sidebar{position:sticky;top:0;height:100vh;transform:translateX(0)}.burger,.close-btn{display:none}.overlay{display:none !important}}
</style>
</head>
<body>
<div class="app">
<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar">
<div class="sidebar-head"><img src="logo.png" class="logo-img"><div class="logo-text"><div class="hot">HotPit</div><div class="kit">KITCHEN</div></div><button class="close-btn" id="closeBtn">✕</button></div>
<div class="rest-name" id="restName">Загрузка...</div>
<nav class="menu">
<button class="tab-btn active" data-tab="personal">Персонал</button>
<button class="tab-btn" data-tab="fot">ФОТ</button>
<button class="tab-btn" data-tab="zaprosy">Запросы <span id="reqBadge" style="display:none;background:#ff6b00;color:#000;padding:2px 7px;border-radius:20px;font-size:10px;margin-left:auto">0</span></button>
<button class="tab-btn" data-tab="missia">Миссия</button>
<button id="logoutBtn" style="color:#555;margin-top:20px">Выйти</button>
</nav>
</aside>
<main class="content">
<div class="topbar"><button class="burger" id="burgerBtn">☰</button><h1 id="pageTitle">Персонал</h1></div>
<div id="tab-content">
<div class="card" data-tab-content="personal"><h3>Команда</h3><div id="povaraList" style="margin-top:12px;color:#777">Загрузка...</div><h4 style="margin-top:24px;color:#666;font-size:11px;letter-spacing:1px">ПРИГЛАСИТЬ ШЕФА</h4><input id="chefEmail" placeholder="Email шефа"><button id="inviteChefBtn" class="btn-outline">Сгенерировать ссылку</button><div id="inviteLink" style="margin-top:12px"></div><div id="qrcode" style="margin-top:12px;background:#fff;padding:12px;border-radius:12px;display:inline-block"></div></div>
<div class="card" data-tab-content="fot" style="display:none"><div class="stat-grid"><div class="stat"><div style="color:#777;font-size:11px">ФОТ Использовано</div><div class="num" id="fotUsed">0</div><div class="progress"><div id="fotBar"></div></div></div></div><div id="salaryList"></div></div>
<div class="card" data-tab-content="zaprosy" style="display:none"><h3>Запросы</h3><div id="dismissList" style="margin-top:12px"></div></div>
<div class="card" data-tab-content="missia" style="display:none"><h3>Миссия — для детей</h3><p style="color:#888;margin-top:12px;line-height:1.6">Спасибо, что с HotPit. Часть подписки идет детям без родителей.</p></div>
</div>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supabase = createClient('https://xljogkyropyocvuuodfl.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs')
const sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay');
burgerBtn.onclick=()=>{sidebar.classList.add('open');overlay.classList.add('show')}
closeBtn.onclick=()=>{sidebar.classList.remove('open');overlay.classList.remove('show')}
overlay.onclick=()=>{sidebar.classList.remove('open');overlay.classList.remove('show')}
document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('pageTitle').textContent=b.textContent;document.querySelectorAll('[data-tab-content]').forEach(c=>c.style.display=c.dataset.tabContent===b.dataset.tab?'block':'none')})
logoutBtn.onclick=()=>supabase.auth.signOut().then(()=>location.href='/index.html')
let myRestaurantId=null;
inviteChefBtn.onclick=()=>{
  const email=chefEmail.value.trim(); if(!email) return inviteLink.innerHTML='<span style="color:#ff6b6b">Email нужен</span>';
  const link=`${location.origin}/register.html?role=chef&restaurant_id=${myRestaurantId}&email=${encodeURIComponent(email)}`;
  inviteLink.innerHTML=`<a href="${link}" target="_blank" style="color:#ff6b00">${link}</a><div style="color:#4ade80;margin-top:6px">Скопировано</div>`;
  navigator.clipboard.writeText(link); qrcode.innerHTML=''; new QRCode(qrcode,{text:link,width:180,height:180});
}
async function init(){
  const {data:{user}}=await supabase.auth.getUser(); if(!user) return location.href='/index.html';
  const {data:prof,error}=await supabase.from('profiles').select('restaurant_id, role, restaurants(name)').eq('id',user.id).single();
  if(error || !prof){ return location.href='/index.html'; }
  if(prof.role!=='owner'){ alert('Доступ только для овнера'); return location.href='/chef.html'; }
  myRestaurantId=prof.restaurant_id; restName.textContent=prof.restaurants?.name || 'Ресторан';
  const {data:povara}=await supabase.from('profiles').select('full_name, role, salary').eq('restaurant_id',myRestaurantId).eq('is_active',true);
  povaraList.innerHTML=povara?.map(p=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1e1e1e"><span>${p.full_name}</span><span style="color:#666">${p.role} • ${p.salary||0}р</span></div>`).join('') || 'Нет сотрудников';
}
init();
</script>
</body>
</html>
