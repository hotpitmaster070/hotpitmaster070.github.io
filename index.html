<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit Kitchen</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
.wrap{max-width:380px;margin:0 auto;padding:20px 18px 30px}
.logo{display:flex;align-items:center;gap:14px;margin-top:10px}
.logo-icon{width:88px;height:88px;flex-shrink:0}
.hot{font-size:42px;font-weight:900;color:#ff6b00;line-height:1;letter-spacing:-1px}
.kit{font-size:19px;letter-spacing:6px;color:#fff;font-weight:400;margin-top:2px}
.sub{font-size:12px;color:#aaa;font-weight:300;letter-spacing:.8px;margin-top:4px;width:175px;white-space:nowrap}
.welcome{font-size:30px;font-weight:800;margin:28px 0 20px}
.card{height:86px;background:#212121;border-radius:16px;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 0;margin-bottom:16px;position:relative;overflow:hidden;cursor:pointer;border:1.5px solid #2a2a2a;transition:.2s}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:9px;background:#ff6b00}
.card.active{border-color:#ff6b00;background:#241c12}
.card span{margin-left:30px;font-size:18px;font-weight:700}
.card .ico{color:#ff6b00}
.btns{display:flex;gap:12px;margin-top:26px}
.btn{flex:1;height:56px;background:#ff6b00;border:none;border-radius:14px;color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.form{display:none;margin-top:18px;background:#151515;border:1px solid #222;border-radius:16px;padding:14px}
.form.show{display:block}
input{width:100%;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:10px;padding:12px;color:#fff;margin-bottom:8px}
input:focus{outline:none;border-color:#ff6b00}
</style>
</head>
<body>
<div class="wrap">
  <!-- ЛОГО РОВНО КАК НА КАРТИНКЕ -->
  <div class="logo">
    <svg class="logo-icon" viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg">
      <!-- огонь -->
      <path fill="#ff6b00" d="M45 4 C47 10, 50 14, 53 16 C50 14, 47 10, 45 4 Z M45 0 C43 8, 44 13, 48 17 C44 12, 43 7, 45 0 Z M45 6 C45 10, 46 13, 48 15 C46 12, 45 9, 45 6 Z"/>
      <!-- колпак -->
      <path fill="#ff6b00" d="M45 18 C30 18, 18 26, 20 36 C14 35, 10 40, 14 45 C18 48, 25 47, 28 43 C28 47, 32 50, 45 50 C58 50, 62 47, 62 43 C65 47, 72 48, 76 45 C80 40, 76 35, 70 36 C72 26, 60 18, 45 18 Z"/>
      <path fill="#ff6b00" d="M22 48 Q45 56 68 48 L66 62 Q45 68 24 62 Z"/>
    </svg>
    <div>
      <div class="hot">HotPit</div>
      <div class="kit">KITCHEN</div>
      <div class="sub">management system</div>
    </div>
  </div>

  <div class="welcome">Welcome</div>

  <div class="card active" id="cOwner">
    <span>Owner</span>
    <div class="ico"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ff6b00" stroke-width="1.8"><circle cx="12" cy="8" r="4.2"/><path d="M5.5 20c0-3.8 3.3-6 6.5-6s6.5 2.2 6.5 6"/></svg></div>
  </div>

  <div class="card" id="cChef">
    <span>Chef</span>
    <div class="ico"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ff6b00" stroke-width="1.8"><path d="M6 11c0-2.8 2-5 4-5 1.2 0 1.5.8 2 1.2C12.5 6.8 13 6 14 6c2 0 4 2.2 4 5v1H6v-1z"/><path d="M7 12v7h10v-7"/><path d="M9 16h6"/></svg></div>
  </div>

  <div class="btns">
    <button class="btn" id="bLog">Log in</button>
    <button class="btn" id="bReg">Create account</button>
  </div>

  <div class="form" id="fReg"><input id="fn" placeholder="Full name"><input id="rn" placeholder="Restaurant name"><input id="em" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="btn" id="doReg" style="width:100%">Create account</button><div id="m1" style="color:#f66;font-size:12px;text-align:center;margin-top:6px"></div></div>
  <div class="form" id="fLog"><input id="emL" placeholder="Email"><input id="pwL" type="password" placeholder="Password"><button class="btn" id="doLog" style="width:100%">Log in</button><div id="m2" style="color:#f66;font-size:12px;text-align:center;margin-top:6px"></div></div>
</div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const sb=createClient('https://xljogkyropyocvuuodfl.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs')
let role='owner'
function sel(r){role=r;document.getElementById('cOwner').classList.toggle('active',r==='owner');document.getElementById('cChef').classList.toggle('active',r==='chef')}
document.getElementById('cOwner').onclick=()=>sel('owner')
document.getElementById('cChef').onclick=()=>sel('chef')
document.getElementById('bReg').onclick=()=>{document.getElementById('fReg').classList.add('show');document.getElementById('fLog').classList.remove('show')}
document.getElementById('bLog').onclick=()=>{document.getElementById('fLog').classList.add('show');document.getElementById('fReg').classList.remove('show')}
document.getElementById('doReg').onclick=async()=>{const b=document.getElementById('doReg');b.disabled=true;const msg=document.getElementById('m1');msg.textContent='...';try{const email=document.getElementById('em').value.trim(),password=document.getElementById('pw').value,full_name=document.getElementById('fn').value.trim(),rest_name=document.getElementById('rn').value.trim();const {error}=await sb.auth.signUp({email,password});if(error) throw error;await sb.auth.signInWithPassword({email,password});const u=(await sb.auth.getUser()).data.user;const {data:nr,error:re}=await sb.from('restaurants').insert({owner_id:u.id,name:rest_name,subscription_type:role}).select('id').single();if(re) throw re;await sb.from('profiles').insert({id:u.id,full_name,restaurant_id:nr.id,role,is_active:true});await sb.from('restaurant_settings').insert({restaurant_id:nr.id,language:'en'});location.href=role==='chef'?'/chef.html':'/owner.html'}catch(e){msg.textContent=e.message;b.disabled=false}}
document.getElementById('doLog').onclick=async()=>{const b=document.getElementById('doLog');b.disabled=true;const msg=document.getElementById('m2');msg.textContent='...';try{await sb.auth.signInWithPassword({email:document.getElementById('emL').value.trim(),password:document.getElementById('pwL').value});const u=(await sb.auth.getUser()).data.user;const {data:p}=await sb.from('profiles').select('role').eq('id',u.id).single();location.href=p?.role==='chef'?'/chef.html':'/owner.html'}catch(e){msg.textContent=e.message;b.disabled=false}}
</script>
</body>
  </html>
