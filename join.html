<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit - Присоединиться</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="auth-wrap">
  <h1>Присоединиться к HotPit</h1>
  <p style="color:var(--muted);font-size:14px;text-align:center" id="restName">Проверка ссылки...</p>
  <form id="join" class="hidden">
    <input name="fullName" placeholder="Ваше ФИО" required>
    <input name="email" type="email" placeholder="Ваш Email" required>
    <input name="password" type="password" placeholder="Придумай пароль 6+" required minlength="6">
    <button type="submit" id="submitBtn" class="btn-primary">Принять приглашение</button>
  </form>
  <div id="err"></div>
</div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
import {SUPABASE_URL, SUPABASE_ANON_KEY} from './js/config.js'
const supabase=createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const token=new URLSearchParams(location.search).get('token');
const form=document.getElementById('join');
const err=document.getElementById('err');
const restName=document.getElementById('restName');
const btn=document.getElementById('submitBtn');

if(!token){ 
  restName.textContent='Ссылка невалидна: нет token в URL'; 
} else {
  restName.textContent='Вас приглашают в ресторан';
  form.classList.remove('hidden');
}

form.addEventListener('submit',async e=>{
  e.preventDefault();
  btn.disabled=true;
  err.style.color='var(--muted)';
  err.textContent='Регистрирую...';
  
  const fd=new FormData(form);
  const fullName=fd.get('fullName').trim();
  const email=fd.get('email').trim();
  const password=fd.get('password');

  try {
    const {data:{user}, error:ae}=await supabase.auth.signUp({email, password});
    if(ae) throw ae;
    if(!user) throw new Error('Не удалось создать пользователя');
    await supabase.auth.signInWithPassword({email, password});
    const {error:fe}=await supabase.rpc('accept_invite', {p_token:token, p_full_name:fullName});
    if(fe) throw fe;
    err.style.color='#22c55e';
    err.textContent='Готово! Перекидываю в кабинет...';
    setTimeout(()=>location.href='./owner.html',1200);
  } catch(e) {
    err.style.color='#f87171';
    err.textContent = 'Ошибка: ' + e.message;
    await supabase.auth.signOut();
    btn.disabled=false;
  }
})
</script></body></html>
