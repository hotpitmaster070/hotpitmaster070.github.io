<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit - Присоединиться</title>
<style>
:root{--bg:#0a0a0a;--card:#171717;--card-2:#262626;--text:#f5f5f5;--muted:#a3a3a3;--accent:#f97316}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 80% -20%,rgba(249,115,22,0.12),transparent),var(--bg);color:var(--text);font-family:-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-wrap{background:var(--card);padding:24px;border-radius:20px;width:100%;max-width:420px;border:1px solid #262626}
h1{font-size:22px;text-align:center;color:var(--accent)}
.info-box{background:var(--card-2);padding:12px;border-radius:12px;margin:16px 0;font-size:14px;line-height:1.5}
.info-box b{color:var(--accent)}
input{width:100%;padding:12px;background:var(--card-2);border:1px solid #333;border-radius:10px;color:var(--text);margin-top:10px}
.btn-primary{width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#000;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px}
.hidden{display:none}
#err{font-size:14px;margin-top:10px;text-align:center}
</style>
</head>
<body>
<div class="auth-wrap">
  <h1>Присоединиться к HotPit</h1>
  <p style="color:var(--muted);font-size:14px;text-align:center;margin-top:8px" id="restName">Проверка ссылки...</p>
  
  <div class="info-box hidden" id="inviteInfo"></div>

  <form id="join" class="hidden">
    <input name="fullName" id="fullName" placeholder="Ваше ФИО" required>
    <input name="email" id="email" type="email" placeholder="Ваш Email" required>
    <input name="password" type="password" placeholder="Придумай пароль 6+" required minlength="6">
    <button type="submit" id="submitBtn" class="btn-primary">Принять приглашение</button>
  </form>
  <div id="err"></div>
</div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supabase=createClient('https://xljogkyropyocvuuodfl.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs');

const token=new URLSearchParams(location.search).get('token');
const form=document.getElementById('join');
const err=document.getElementById('err');
const restName=document.getElementById('restName');
const infoBox=document.getElementById('inviteInfo');
const btn=document.getElementById('submitBtn');

if(!token){ 
  restName.textContent='Ссылка невалидна: нет token'; 
} else {
  // ГРУЗИМ ДЕТАЛИ ПРИГЛАШЕНИЯ КАК НА СТАРОМ СКРИНЕ
  const {data, error} = await supabase.from('invites').select('*, restaurants(name)').eq('token', token).single();
  if(error || !data){
    restName.textContent='Приглашение не найдено или использовано';
  } else {
    const typeText = data.salary_type==='hourly'?'₽/час':'₽/день';
    restName.textContent=`Вас пригласили в ресторан: ${data.restaurants?.name || ''}`;
    infoBox.classList.remove('hidden');
    infoBox.innerHTML=`Вас приглашают на должность: <b>${data.job_title}</b><br>Ставка: <b>${data.salary}${typeText}</b>`;
    document.getElementById('email').value = data.email || '';
    form.classList.remove('hidden');
  }
}

form.addEventListener('submit',async e=>{
  e.preventDefault();
  btn.disabled=true;
  err.style.color='#a3a3a3';
  err.textContent='Регистрирую...';
  const fd=new FormData(form);
  try {
    const {data:{user}, error:ae}=await supabase.auth.signUp({email: fd.get('email').trim(), password: fd.get('password')});
    if(ae) throw ae;
    await supabase.auth.signInWithPassword({email: fd.get('email').trim(), password: fd.get('password')});
    const {error:fe}=await supabase.rpc('accept_invite', {p_token:token, p_full_name:fd.get('fullName').trim()});
    if(fe) throw fe;
    err.style.color='#22c55e';
    err.textContent='Готово! Перекидываю...';
    setTimeout(()=>location.href='./cook.html',1200);
  } catch(e) {
    err.style.color='#f87171';
    err.textContent='Ошибка: '+e.message;
    btn.disabled=false;
  }
})
</script></body></html>
