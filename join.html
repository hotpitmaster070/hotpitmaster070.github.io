<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit - Присоединиться</title>
<style>
:root{--bg:#0a0a0a;--card:#171717;--card-2:#262626;--text:#f5f5f5;--muted:#a3a3a3;--accent:#f97316}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 80% -20%,rgba(249,115,22,0.12),transparent),var(--bg);color:var(--text);font-family:Manrope,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-wrap{background:var(--card);padding:24px;border-radius:20px;width:100%;max-width:420px;border:1px solid #262626}
h1{font-size:22px;text-align:center;color:var(--accent)}.info-box{background:var(--card-2);padding:12px;border-radius:12px;margin:16px 0;font-size:14px;line-height:1.5}.info-box b{color:var(--accent)}
input{width:100%;padding:12px;background:var(--card-2);border:1px solid #333;border-radius:10px;color:var(--text);margin-top:10px}
.btn-primary{width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#000;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px}
.hidden{display:none}#err{font-size:14px;margin-top:10px;text-align:center;white-space:pre-wrap}
/* ТОП МОДАЛКА ДЛЯ ШЕФА */
#chefModal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}
#chefModal.show{display:flex}
.chef-card{background:linear-gradient(180deg,#21180f,#151515);border:1px solid #f97316;border-radius:24px;padding:28px;max-width:380px;width:100%;text-align:center;box-shadow:0 0 40px rgba(249,115,22,.25);animation:pop .4s cubic-bezier(.175,.885,.32,1.275)}
@keyframes pop{from{transform:scale(.8) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.chef-badge{display:inline-block;background:#f97316;color:#000;font-size:10px;font-weight:800;letter-spacing:2px;padding:4px 10px;border-radius:20px;margin-bottom:12px}
</style>
</head>
<body>
<div class="auth-wrap">
  <h1>Присоединиться к HotPit</h1>
  <p style="color:var(--muted);font-size:14px;text-align:center;margin-top:8px" id="restName">Проверка ссылки...</p>
  <div class="info-box hidden" id="inviteInfo"></div>
  <form id="join" class="hidden">
    <input name="fullName" id="fullName" placeholder="Ваше ФИО" required>
    <input name="email" id="email" type="email" placeholder="Ваш Email" required>
    <input name="password" type="password" placeholder="Придумай пароль 6+" required minlength="6">
    <button type="submit" id="submitBtn" class="btn-primary">Принять приглашение</button>
  </form>
  <div id="err"></div>
</div>

<!-- МОДАЛКА ДЛЯ ШЕФА -->
<div id="chefModal">
  <div class="chef-card">
    <div class="chef-badge">ПРИГЛАШЕНИЕ ДЛЯ ШЕФА</div>
    <div id="chefAvatar"></div>
    <h2 id="chefTitle" style="font-size:22px;margin:12px 0 6px"></h2>
    <p id="chefRest" style="color:#a3a3a3;font-size:13px"></p>
    <div id="chefDetails" style="background:#00000066;padding:12px;border-radius:12px;margin:16px 0;font-size:14px;text-align:left"></div>
    <p style="font-size:11px;color:#666;margin-bottom:12px">Вы получите полный доступ к кухне, рецептам и команде этого ресторана</p>
    <button onclick="document.getElementById('chefModal').classList.remove('show')" style="background:transparent;border:1px solid #333;color:#fff;padding:10px 20px;border-radius:10px;cursor:pointer">Продолжить регистрацию ↓</button>
  </div>
</div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supabase=createClient('https://xljogkyropyocvuuodfl.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs');

const token=new URLSearchParams(location.search).get('token');
const form=document.getElementById('join'), err=document.getElementById('err'), restName=document.getElementById('restName'), infoBox=document.getElementById('inviteInfo'), btn=document.getElementById('submitBtn');
let invite=null;

if(!token){
  restName.textContent='Ссылка невалидна: нет token';
} else {
  const {data,error}=await supabase.from('invites').select('*, restaurants(name)').eq('token',token).maybeSingle();
  if(error||!data){
    restName.textContent='Приглашение не найдено или уже использовано';
  } else {
    invite=data;
    const typeText=data.salary_type==='hourly'?'₽/час':data.salary_type==='daily'?'₽/день':'₽/смена';
    restName.textContent=`Вас пригласили в: ${data.restaurants?.name || 'HotPit'}`;
    infoBox.classList.remove('hidden');
    const avatarHtml = data.avatar_url ? `<img src="${data.avatar_url}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;margin-bottom:10px;border:2px solid #f97316"><br>` : '';
    infoBox.innerHTML=`${avatarHtml}Должность: <b>${data.job_title}</b><br>Ставка: <b>${data.salary} ${typeText}</b><br>Роль: <b>${data.role==='chef'?'Шеф-повар':'Повар'}</b>`;
    document.getElementById('email').value=data.email||'';

    // ТОПОВАЯ МОДАЛКА ТОЛЬКО ЕСЛИ ШЕФ
    if(data.role==='chef'){
      document.getElementById('chefAvatar').innerHTML = avatarHtml || '🔥';
      document.getElementById('chefTitle').textContent = `Привет, ${data.job_title}!`;
      document.getElementById('chefRest').textContent = data.restaurants?.name;
      document.getElementById('chefDetails').innerHTML = `Должность: <b>${data.job_title}</b><br>Ставка: <b>${data.salary} ${typeText}</b><br>Email: <b>${data.email}</b>`;
      document.getElementById('chefModal').classList.add('show');
    }

    form.classList.remove('hidden');
  }
}

form.addEventListener('submit',async e=>{
  e.preventDefault();
  if(!invite){ err.textContent='Нет данных приглашения'; return; }
  btn.disabled=true; err.style.color='#a3a3a3'; err.textContent='Регистрирую...';
  const fd=new FormData(form);
  const fullName=fd.get('fullName').trim();
  const email=fd.get('email').trim().toLowerCase();
  const password=fd.get('password');

  try{
    let userId=null;
    let {data:signUp,error:signErr}=await supabase.auth.signUp({email,password});
    if(signErr && signErr.message.includes('already registered')){
      const {data:signIn,error:signInErr}=await supabase.auth.signInWithPassword({email,password});
      if(signInErr) throw signInErr;
      userId=signIn.user.id;
    } else {
      if(signErr) throw signErr;
      if(signUp.user) userId=signUp.user.id;
      if(!signUp.session){
        const {data:signIn}=await supabase.auth.signInWithPassword({email,password});
        if(signIn?.user) userId=signIn.user.id;
      }
    }
    if(!userId){
      const {data:{user}}=await supabase.auth.getUser();
      if(user) userId=user.id;
    }
    if(!userId) throw new Error('Не удалось получить ID пользователя');

    // ВМЕСТО ПРЯМОГО INSERT - ВЫЗЫВАЕМ ФУНКЦИЮ
    const {error: joinErr} = await supabase.rpc('join_by_invite',{
      p_token: token,
      p_user_id: userId,
      p_full_name: fullName,
      p_lang: 'ru'
    });
    if(joinErr) throw joinErr;

    // Обновляем доп поля
    await supabase.from('profiles').update({
      email: email,
      job_title: invite.job_title,
      salary: invite.salary,
      salary_type: invite.salary_type,
      avatar_url: invite.avatar_url
    }).eq('id', userId);

    err.style.color='#22c55e';
    err.textContent='Готово! Перекидываю в кабинет...';
    setTimeout(()=>{
      if(invite.role==='chef') location.href='./chef.html?v=301';
      else location.href='./cook.html?v=301';
    },1000);

  }catch(e){
    err.style.color='#f87171';
    err.textContent='Ошибка: '+e.message;
    btn.disabled=false;
  }
});
</script></body></html>
