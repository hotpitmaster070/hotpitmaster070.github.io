<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шеф Панель - HotPit KITCHEN</title>
<link rel="stylesheet" href="./css/style.css">
<style>
body{background:#0a0a0a;color:#fff}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px}
.brand{font-size:24px;font-weight:800;color:#f97316}
.rest-info{font-size:14px;color:#aaa}
.shef-info{font-size:16px;font-weight:600;margin-bottom:20px}
.btn-primary{background:#f97316;color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600}
.btn-primary:hover{opacity:0.9}
.card{background:#111;border:1px solid #222;border-radius:12px;padding:14px;margin-bottom:10px}
.sub{color:#888;font-size:14px}
input,select{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:10px;margin-bottom:10px;color:#fff}

/* БОКОВОЕ МЕНЮ */
.menu-link{display:block;padding:12px 0;color:#fff;text-decoration:none;border-bottom:1px solid #222;font-size:16px}
.menu-link:hover{color:#f97316}
#sidebar.open{left:0}
</style>
</head>
<body style="padding:20px;max-width:900px;margin:0 auto">
  
  <!-- КНОПКА БУРГЕРА -->
  <button onclick="openSidebar()" style="background:#222;border:none;padding:10px 14px;border-radius:8px;font-size:20px;margin-bottom:20px;cursor:pointer">☰</button>

  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
  <div class="topbar">
    <div>
      <div class="brand">HotPit KITCHEN</div>
      <div class="rest-info" id="restName">Загрузка ресторана...</div>
      <div class="shef-info" id="shefName">Загрузка шефа...</div>
    </div>
    <button class="btn-primary" onclick="openInviteModal()">+ Пригласить</button>
  </div>

  <h2>Команда</h2>
  <div id="teamLoad" class="sub">Загрузка...</div>
  <div id="teamList"></div>

  <!-- ФОН ЗАТЕМНЕНИЕ ДЛЯ МЕНЮ -->
  <div id="sidebarOverlay" onclick="closeSidebar()" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:998"></div>

  <!-- БОКОВОЕ МЕНЮ -->
  <div id="sidebar" style="position:fixed;top:0;left:-280px;width:280px;height:100%;background:#111;z-index:999;transition:0.3s;padding:20px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h3 style="color:#f97316">Меню</h3>
      <button onclick="closeSidebar()" style="font-size:28px;background:none;border:none;color:#fff;cursor:pointer">×</button>
    </div>
    <a href="./chef.html" onclick="closeSidebar()" class="menu-link">Главная</a>
    <a href="./orders.html" onclick="closeSidebar()" class="menu-link">Заказы</a>
    <a href="./menu.html" onclick="closeSidebar()" class="menu-link">Меню ресторана</a>
    <a href="#" onclick="logout()" class="menu-link">Выйти</a>
  </div>

  <!-- МОДАЛКА ПРИГЛАСИТЬ -->
  <div id="inviteModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;z-index:1000">
    <div class="card" style="width:90%;max-width:400px">
      <h3>Пригласить сотрудника</h3>
      <input id="inviteEmail" type="email" placeholder="Email сотрудника">
      <select id="inviteRole"><option value="cook">Повар</option><option value="chef">Шеф</option></select>
      <input id="inviteJob" placeholder="Должность: Су-шеф">
      <input id="inviteSalary" type="number" placeholder="Зарплата">
      <button class="btn-primary" onclick="generateLink()" style="width:100%">Сгенерировать ссылку</button>
      <input id="inviteLink" readonly style="margin-top:10px">
      <button onclick="closeInviteModal()" style="margin-top:10px;width:100%;background:#333">Закрыть</button>
    </div>
  </div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
import {SUPABASE_URL, SUPABASE_ANON_KEY} from './js/config.js'
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let myRestaurantId = null;

async function loadChefData(){
  const { data: { user } } = await supabase.auth.getUser();
  if(!user){ location.href='./index.html'; return; }

  // 1. Грузим профиль шефа + название ресторана
  const {data: profile} = await supabase
    .from('profiles')
    .select('full_name, restaurant_id, restaurants(name)')
    .eq('id', user.id).single();
  
  if(!profile){ alert('Профиль не найден'); return; }
  
  myRestaurantId = profile.restaurant_id;
  document.getElementById('restName').innerText = `Ресторан: ${profile.restaurants?.name || '...'}`;
  document.getElementById('shefName').innerText = `Шеф: ${profile.full_name}`;
  document.getElementById('teamLoad').innerText = '';

  // 2. Грузим команду
  const {data: team} = await supabase.from('profiles').select('*').eq('restaurant_id', myRestaurantId);
  const teamDiv = document.getElementById('teamList');
  teamDiv.innerHTML = '';
  if(team.length === 0){ teamDiv.innerHTML = '<div class="sub">Команда пуста</div>' }
  team.forEach(p=>{
    teamDiv.innerHTML += `<div class="card"><b>${p.full_name}</b> - ${p.job_title} <span style="color:#888">(${p.role})</span></div>`
  })
}
loadChefData();

// ФУНКЦИИ МЕНЮ
function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').style.display='block';
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').style.display='none';
}
window.openSidebar=openSidebar; 
window.closeSidebar=closeSidebar;

// ФУНКЦИИ МОДАЛКИ
function openInviteModal(){document.getElementById('inviteModal').style.display='flex'}
function closeInviteModal(){document.getElementById('inviteModal').style.display='none'}
window.openInviteModal=openInviteModal; 
window.closeInviteModal=closeInviteModal;

async function generateLink(){
  const email=document.getElementById('inviteEmail').value;
  const role=document.getElementById('inviteRole').value;
  const job=document.getElementById('inviteJob').value;
  const salary=document.getElementById('inviteSalary').value;
  const link = `register.html?role=${role}&restaurant_id=${myRestaurantId}&email=${encodeURIComponent(email)}&job=${job}&salary=${salary}`;
  document.getElementById('inviteLink').value = location.origin + '/' + link;
}
window.generateLink=generateLink;

async function logout(){
  await supabase.auth.signOut();
  location.href='./index.html';
}
window.logout=logout;
</script></body></html>
