<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HotPit KITCHEN</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #171717;
      --card-2: #262626;
      --text: #f5f5f5;
      --muted: #a3a3a3;
      --accent: #f97316;
      --work: #22c55e;
      --sick: #f59e0b;
      --vac: #3b82f6;
      --off: #64748b;
      --danger: #ef4444
    }

    * { box-sizing: border-box }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0 }

  .app { display: flex; min-height: 100vh }

  .sidebar {
      width: 260px;
      background: var(--card);
      padding: 20px;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      transform: translateX(-100%);
      z-index: 95;
      transition:.3s
    }
  .sidebar.open { transform: translateX(0) }

  .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0,.8);
      display: none;
      z-index: 90
    }
  .overlay.show { display: block }

  .menu button {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      text-align: left;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      font-size: 15px
    }
  .menu button.active { background: var(--card-2) }

  .content { flex: 1; padding: 20px }

  .topbar {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px
    }

  .burger {
      background: var(--card-2);
      border: 1px solid #333;
      color: var(--text);
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 20px
    }

  .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px
    }

  .btn-outline {
      background: var(--card-2);
      border: 1px solid #333;
      color: var(--text);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700
    }

  .btn-danger {
      background: var(--danger);
      color: #fff;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px
    }

    input, select {
      width: 100%;
      padding: 12px;
      background: var(--card-2);
      border: 1px solid #333;
      border-radius: 12px;
      color: var(--text);
      margin-top: 8px
    }

  .povar-card {
      background: var(--card);
      padding: 16px;
      border-radius: 16px;
      border: 1px solid #262626;
      margin-bottom: 12px;
      cursor: pointer
    }
  .povar-card:hover { border-color: var(--accent) }

  .povar-info { display: flex; gap: 12px; align-items: center }

  .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #000;
      font-size: 20px
    }

  .avatar-big {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #000;
      font-size: 36px;
      margin: 0 auto 16px
    }

  .tinder-card {
      background: var(--card);
      padding: 24px;
      border-radius: 24px;
      border: 1px solid #262626;
      text-align: center;
      margin-bottom: 16px;
      cursor: pointer
    }

  .tinder-actions {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px
    }
  .tinder-actions button {
      background: var(--card-2);
      border: 1px solid #333;
      color: var(--text);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      font-weight: 700
    }

  .calendar-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 8px
    }
  .calendar-header div {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600
    }

  .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px
    }

  .day {
      aspect-ratio: 1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      background: #222;
      border: 1px solid #333;
      cursor: pointer;
      font-size: 16px
    }
  .day.work { background: var(--work); color: #000; border-color: var(--work) }
  .day.sick { background: var(--sick); color: #000; border-color: var(--sick) }
  .day.vac { background: var(--vac); color: #000; border-color: var(--vac) }

  .brush-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card);
      padding: 12px;
      display: flex;
      gap: 8px;
      z-index: 80;
      border-top: 1px solid #262626
    }
  .brush-btn {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #333;
      background: var(--card-2);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      font-size: 12px
    }
  .brush-btn.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #000
    }

  .table-grid { display: grid; gap: 8px }
  .table-name {
      padding: 12px;
      background: var(--card);
      border-radius: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer
    }
  .table-name:hover { background: var(--card-2) }

  .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0,.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px
    }
  .modal.show { display: flex }
  .modal-card {
      background: var(--card);
      padding: 24px;
      border-radius: 20px;
      width: 100%;
      max-width: 480px
    }

  .brand-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 700
    }
  .brand-name { color: var(--accent) }
  .brand-separator { color: var(--muted) }
  .restaurant-name { color: var(--text) }

  .chef-role {
      font-size: 14px;
      color: var(--muted);
      margin-top: 4px
    }
  .chef-name {
      font-size: 20px;
      font-weight: 700;
      margin-top: 2px
    }

  .sidebar-chef {
      padding: 12px;
      border-radius: 12px;
      background: var(--card-2);
      margin-bottom: 20px
    }

    #qrcode {
      margin-top: 12px;
      padding: 12px;
      background: #fff;
      border-radius: 12px;
      display: inline-block
    }
  .link-box {
      word-break: break-all;
      background: #000;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
      font-size: 12px
    }

  .salary-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #262626;
      cursor: pointer
    }
  .salary-row:hover { background: var(--card-2) }

  .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #262626
    }

  .hint-bottom { padding-bottom: 90px }
  .header-info { flex: 1 }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<div class="app">
  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2 style="color:var(--accent);margin:0">HotPit</h2>
      <button class="close-btn" style="background:var(--card-2);border:none;color:var(--text);width:36px;height:36px;border-radius:10px;font-size:20px" id="closeSidebar">×</button>
    </div>

    <div id="sidebarChef" class="sidebar-chef">
      <div style="font-size:12px;color:var(--muted)" id="sidebarRole">Шеф-повар</div>
      <div id="sidebarChefName" style="font-weight:700"></div>
    </div>

    <div id="restName" style="color:var(--muted);font-size:12px"></div>

    <nav class="menu">
      <button class="tab-btn active" data-tab="personal">👨‍🍳 Команда</button>
      <button class="tab-btn" data-tab="tabel">📋 Табель</button>
      <button class="tab-btn" data-tab="grafik">📅 График</button>
      <button class="tab-btn" data-tab="salary">💰 Зарплата</button>
      <button id="logoutBtn">Выйти</button>
    </nav>
  </aside>

  <main class="content hint-bottom">
    <div class="topbar">
      <button class="burger" id="burgerBtn">☰</button>
      <div class="header-info">
        <div class="brand-line">
          <span class="brand-name">HotPit KITCHEN</span>
          <span class="brand-separator">|</span>
          <span class="restaurant-name" id="pageSubtitle"></span>
        </div>
        <div class="chef-role" id="pageRole"></div>
        <div class="chef-name" id="pageTitle"></div>
        <button class="btn" id="addBtn">+ Пригласить</button>
      </div>
    </div>

    <div id="tab-content">
      <div data-tab-content="personal">
        <h3>Команда</h3>
        <div id="povaraList"></div>
      </div>

      <div data-tab-content="tabel" style="display:none">
        <div style="display:flex;gap:10px;margin-bottom:20px">
          <button class="btn-outline" id="prevMonthT"><</button>
          <div id="monthYearT" style="flex:1;text-align:center;font-weight:700;font-size:18px"></div>
          <button class="btn-outline" id="nextMonthT">></button>
        </div>
        <div id="tabelList"></div>
        <div id="tabelSingle" style="display:none"></div>
      </div>

      <div data-tab-content="grafik" style="display:none">
        <div style="display:flex;gap:10px;margin-bottom:12px;align-items:center">
          <button class="btn-outline" id="prevMonthG"><</button>
          <div id="monthYearG" style="flex:1;text-align:center;font-weight:700;font-size:18px"></div>
          <button class="btn-outline" id="nextMonthG">></button>
        </div>
        <div id="tinderView">
          <div class="tinder-actions">
            <button onclick="prevCook()">←</button>
            <button onclick="nextCook()">→</button>
          </div>
          <div class="tinder-card" id="currentCookCard"></div>
          <div id="currentCookCalendar"></div>
        </div>
      </div>

      <div data-tab-content="salary" style="display:none">
        <h3>Ведомость за <span id="monthYearS"></span></h3>
        <button class="btn" id="exportBtn">📄 Экспорт PDF</button>
        <div id="salaryList"></div>
      </div>
    </div>
  </main>
</div>

<div class="brush-bar" id="brushBar" style="display:none">
  <button class="brush-btn active" data-status="work">🟢 Смена</button>
  <button class="brush-btn" data-status="sick">🟡 Больничный</button>
  <button class="brush-btn" data-status="vac">🔵 Отпуск</button>
  <button class="brush-btn" data-status="off">⚪ Стереть</button>
</div>

<div class="modal" id="addModal">
  <div class="modal-card">
    <h3>Пригласить повара</h3>
    <input id="cookEmail" placeholder="Email повара">
    <select id="cookJob">
      <option>Повар</option>
      <option>Повар-универсал</option>
    </select>
    <input id="cookSalary" type="number" placeholder="Ставка в час">
    <button class="btn" id="genInviteBtn">Сгенерировать ссылку</button>
    <div id="inviteLink"></div>
    <div id="qrcode"></div>
    <button class="btn-outline" style="margin-top:12px;width:100%" onclick="document.getElementById('addModal').classList.remove('show')">Закрыть</button>
  </div>
</div>

<div class="modal" id="cookModal">
  <div class="modal-card" id="cookModalCard"></div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

  const supabase = createClient(
    'https://xljogkyropyocvuuodfl.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs'
  );

  let currentTab = 'personal';
  let myRestaurantId = null;
  let currentDate = new Date();
  let povaraCache = [];
  let attendanceCache = {};
  let brushStatus = 'work';
  let currentCookIndex = 0;

  document.getElementById('burgerBtn').onclick = () => {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('overlay').classList.add('show')
  }
  document.getElementById('closeSidebar').onclick = () => {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show')
  }
  document.getElementById('overlay').onclick = () => {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show')
  }

  document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = () => {
    currentTab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('[data-tab-content]').forEach(c => c.style.display = c.dataset.tabContent === currentTab? 'block' : 'none');
    document.getElementById('brushBar').style.display = currentTab === 'grafik'? 'flex' : 'none';
    loadData()
  });

  document.querySelectorAll('.brush-btn').forEach(btn => btn.onclick = () => {
    document.querySelectorAll('.brush-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    brushStatus = btn.dataset.status
  });

  function updateMonthLabels() {
    const month = currentDate.toLocaleString('ru', { month: 'long', year: 'numeric' });
    document.getElementById('monthYearT').textContent = month;
    document.getElementById('monthYearG').textContent = month;
    document.getElementById('monthYearS').textContent = month;
  }

  document.getElementById('prevMonthT').onclick = () => { currentDate.setMonth(currentDate.getMonth() - 1); updateMonthLabels(); renderTabel() }
  document.getElementById('nextMonthT').onclick = () => { currentDate.setMonth(currentDate.getMonth() + 1); updateMonthLabels(); renderTabel() }
  document.getElementById('prevMonthG').onclick = () => { currentDate.setMonth(currentDate.getMonth() - 1); updateMonthLabels(); renderGrafik() }
  document.getElementById('nextMonthG').onclick = () => { currentDate.setMonth(currentDate.getMonth() + 1); updateMonthLabels(); renderGrafik() }
  document.getElementById('addBtn').onclick = () => document.getElementById('addModal').classList.add('show');

  async function genInvite() {
    const email = document.getElementById('cookEmail').value.trim();
    const job = document.getElementById('cookJob').value;
    const salary = Number(document.getElementById('cookSalary').value) || 0;
    const link = `${location.origin}/register.html?role=cook&restaurant_id=${myRestaurantId}&email=${encodeURIComponent(email)}&job=${encodeURIComponent(job)}&salary=${salary}`;
    document.getElementById('inviteLink').innerHTML = `<div class="link-box"><a href="${link}" target="_blank" style="color:var(--accent)">${link}</a></div>`;
    new QRCode(document.getElementById("qrcode"), { text: link, width: 200, height: 200 });
  }
  document.getElementById('genInviteBtn').onclick = genInvite;

  function nextCook() { currentCookIndex = (currentCookIndex + 1) % povaraCache.length; renderTinderCard() }
  function prevCook() { currentCookIndex = (currentCookIndex - 1 + povaraCache.length) % povaraCache.length; renderTinderCard() }

  function renderTinderCard() {
    if (povaraCache.length === 0) return;
    const p = povaraCache[currentCookIndex];
    document.getElementById('currentCookCard').innerHTML = `<div class="avatar-big">${p.full_name[0]}</div><h2 onclick="openCookCard('${p.id}')">${p.full_name}</h2><div style="color:var(--muted)">${p.job_title} • ${p.salary}₽/ч</div>`;
    renderSingleCalendar('currentCookCalendar', p.id);
  }

  function openCookCard(cookId) {
    const cook = povaraCache.find(p => p.id === cookId);
    const data = attendanceCache[cookId]?.days || [];
    const stats = { work: 0, sick: 0, vac: 0, off: 0 };
    data.forEach(d => stats[d.status]++);
    const zp = stats.work * 8 * Number(cook.salary);
    document.getElementById('cookModalCard').innerHTML = `
      <div style="display:flex;gap:16px">
        <div class="avatar-big" style="width:60px;height:60px;font-size:28px;margin:0">${cook.full_name[0]}</div>
        <div><h3>${cook.full_name}</h3><div style="color:var(--muted)">${cook.job_title}</div></div>
      </div>
      <h4>Статистика</h4>
      <div class="stat-row"><span>Смен</span><b>${stats.work}</b></div>
      <div class="stat-row"><span>ЗП</span><b style="color:#22c55e">${zp.toLocaleString()}₽</b></div>
      <button class="btn-danger" style="width:100%;margin:16px 0" onclick="fireCook('${cookId}','${cook.full_name}')">Уволить</button>
      <button class="btn-outline" style="width:100%" onclick="document.getElementById('cookModal').classList.remove('show')">Закрыть</button>
    `;
    document.getElementById('cookModal').classList.add('show');
  }

  async function fireCook(id, name) {
    if (confirm(`Уволить ${name}?`)) {
      await supabase.from('profiles').update({ is_active: false }).eq('id', id);
      document.getElementById('cookModal').classList.remove('show');
      loadData();
    }
  }

  function renderSingleCalendar(containerId, cookId) {
    const year = currentDate.getFullYear(), month = currentDate.getMonth();
    const days = new Date(year, month + 1, 0).getDate();
    const firstDay = new Date(year, month, 1).getDay();
    const offset = firstDay === 0? 6 : firstDay - 1;
    const weekDays = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
    let html = '<div class="calendar-header">';
    weekDays.forEach(d => html += `<div>${d}</div>`);
    html += '</div><div class="calendar-grid">';
    for (let i = 0; i < offset; i++) html += `<div></div>`;
    for (let i = 1; i <= days; i++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
      const status = attendanceCache[cookId]?.days.find(d => d.work_date === dateStr)?.status || 'off';
      html += `<div class="day ${status}" onclick="setStatusDirect('${cookId}','${dateStr}')">${i}</div>`
    }
    html += '</div>';
    document.getElementById(containerId).innerHTML = html;
  }

  function renderTabel() {
    document.getElementById('tabelList').style.display = 'block';
    document.getElementById('tabelSingle').style.display = 'none';
    let html = '<div class="table-grid">';
    povaraCache.forEach(p => {
      html += `<div class="table-name" onclick="openTabelPovar('${p.id}')"><div class="avatar">${p.full_name[0]}</div><div><b>${p.full_name}</b><div style="font-size:12px;color:var(--muted)">${p.job_title}</div></div></div>`
    });
    document.getElementById('tabelList').innerHTML = html;
  }

  function openTabelPovar(cookId) {
    document.getElementById('tabelList').style.display = 'none';
    document.getElementById('tabelSingle').style.display = 'block';
    renderSingleCalendar('tabelSingle', cookId);
    document.getElementById('tabelSingle').innerHTML += `<button class="btn-outline" style="margin-top:16px;width:100%" onclick="renderTabel()">← Назад к списку</button>`;
  }

  function renderGrafik() {
    document.getElementById('tinderView').style.display = 'block';
    currentCookIndex = 0;
    renderTinderCard()
  }

  async function setStatusDirect(cookId, dateStr) {
    if (dateStr < new Date().toISOString().split('T')[0]) return;
    const status = brushStatus;
    const existing = attenda
