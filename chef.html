<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit KITCHEN</title><style>
:root{--bg:#0a0a0a;--card:#171717;--card-2:#262626;--text:#f5f5f5;--muted:#a3a3a3;--accent:#f97316;--work:#22c55e;--sick:#f59e0b;--vac:#3b82f6;--off:#64748b;--danger:#ef4444}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent}body{background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif;margin:0}
.app{display:flex;min-height:100vh}.sidebar{width:260px;background:var(--card);padding:20px;position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:95;transition:.3s}
.sidebar.open{transform:translateX(0)}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;z-index:90}.overlay.show{display:block}
.menu button{width:100%;background:transparent;border:none;color:var(--text);text-align:left;padding:12px;border-radius:12px;cursor:pointer;font-weight:500}
.menu button.active{background:var(--card-2)}.content{flex:1;padding:20px}.topbar{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.burger{background:var(--card-2);border:1px solid #333;color:var(--text);padding:10px 16px;border-radius:12px;cursor:pointer;font-size:20px}
.btn{padding:12px 20px;border:none;border-radius:12px;background:var(--accent);color:#000;font-weight:700;cursor:pointer;width:100%}
.btn-outline{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:12px}
.btn-danger{background:var(--danger);color:#fff;padding:8px 12px;border:none;border-radius:8px;cursor:pointer;font-size:12px}
.btn-small{background:var(--card-2);border:1px solid #333;color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:12px}
input,select{width:100%;padding:12px;background:var(--card-2);border:1px solid #333;border-radius:12px;color:var(--text);margin-top:8px}
.povar-card{background:var(--card);padding:16px;border-radius:16px;border:1px solid #262626;margin-bottom:12px}
.povar-head{display:flex;align-items:center;justify-content:space-between}
.povar-info{cursor:pointer}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:#000;font-size:20px;cursor:pointer}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day{aspect-ratio:1;border-radius:10px;background:var(--card-2);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;font-weight:600;user-select:none}
.day.work{background:var(--work);color:#000}.day.sick{background:var(--sick);color:#000}.day.vac{background:var(--vac);color:#fff}.day.off{background:var(--off);color:#fff}
.total{margin-top:12px;padding-top:12px;border-top:1px solid #333;font-weight:700}
.grafik-wrapper{overflow-x:auto}.grafik-grid{display:grid;gap:4px;width:max-content}
.grafik-header,.grafik-name{background:var(--card-2);padding:10px 8px;border-radius:8px;font-weight:700;text-align:center;font-size:12px}
.grafik-name{position:sticky;left:0;z-index:2;text-align:left;min-width:140px;background:var(--card);cursor:pointer}
.grafik-cell{background:var(--card-2);border-radius:8px;text-align:center;padding:10px 8px;font-size:14px;min-width:40px;cursor:pointer;font-weight:700;user-select:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.show{display:flex}.modal-card{background:var(--card);padding:24px;border-radius:20px;width:100%;max-width:480px;z-index:101}
.status-btn{padding:14px;border:none;border-radius:12px;width:100%;margin-top:8px;font-weight:700;cursor:pointer}
.brush-bar{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:8px}
.brush-btn{padding:10px 16px;border-radius:12px;border:2px solid #333;background:var(--card-2);color:var(--text);font-weight:700;cursor:pointer;white-space:nowrap}
.brush-btn.active{border-color:var(--accent);background:var(--accent);color:#000}
.err{color:var(--danger);padding:20px}
#qrcode{margin-top:12px;padding:12px;background:#fff;border-radius:12px;display:inline-block}
.muted{color:var(--muted);font-size:12px;margin-top:8px}
.ok{color:#22c55e}
.brand{color:var(--accent);font-size:22px;font-weight:800;margin-bottom:4px}
.restaurant-name{color:var(--muted);font-size:14px;margin-bottom:20px}
.chef-name{font-size:20px;font-weight:700}
.chef-role{font-size:14px;color:var(--muted)}
.sidebar-chef{padding:12px;border-radius:12px;background:var(--card-2);margin-bottom:20px}
.link-box{word-break:break-all;background:#000;padding:10px;border-radius:8px;margin-top:8px;font-size:12px}
.povar-actions{display:flex;gap:8px;margin-top:12px}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #262626}
</style></head><body>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<div class="app"><div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar"><h2 style="color:var(--accent)">HotPit KITCHEN</h2>
<div id="sidebarChef" class="sidebar-chef" style="display:none">
  <div style="font-size:12px;color:var(--muted)" id="sidebarRole">Шеф-повар</div>
  <div id="sidebarChefName" style="font-weight:700"></div>
</div>
<div id="restName" style="color:var(--muted);font-size:12px;margin-bottom:16px">Загрузка...</div>
<nav class="menu"><button class="tab-btn active" data-tab="personal">👨‍🍳 Команда Кухни</button><button class="tab-btn" data-tab="tabel">📋 Табель</button><button class="tab-btn" data-tab="grafik">📅 График</button><button id="logoutBtn">Выйти</button></nav></aside>
<main class="content"><div class="topbar"><button class="burger" id="burgerBtn">☰</button>
<div style="flex:1">
  <div class="brand">HotPit KITCHEN</div>
  <div class="restaurant-name" id="pageSubtitle">Загрузка ресторана...</div>
  <div class="chef-name" id="pageTitle">Загрузка...</div>
  <div class="chef-role" id="pageRole">Загрузка...</div>
</div>
<button class="btn" id="addBtn" style="width:auto">+ Пригласить</button></div>

<div id="tab-content">
<div data-tab-content="personal"><h3>Команда</h3><div id="povaraList">Загрузка...</div></div>
<div data-tab-content="tabel" style="display:none"><div style="display:flex;gap:10px;margin-bottom:20px"><button class="btn-outline" id="prevMonthT" style="width:auto"><</button><div id="monthYearT" style="flex:1;text-align:center;font-weight:700"></div><button class="btn-outline" id="nextMonthT" style="width:auto">></button></div><div id="tabelList">Загрузка...</div></div>
<div data-tab-content="grafik" style="display:none">
  <div class="brush-bar">
    <button class="brush-btn active" data-status="work" style="background:var(--work);color:#000">🟢 Смена</button>
    <button class="brush-btn" data-status="sick" style="background:var(--sick);color:#000">🟡 Б</button>
    <button class="brush-btn" data-status="vac" style="background:var(--vac)">🔵 О</button>
    <button class="brush-btn" data-status="off" style="background:var(--off)">⚪ В</button>
  </div>
  <div style="display:flex;gap:10px;margin-bottom:20px"><button class="btn-outline" id="prevMonthG" style="width:auto"><</button><div id="monthYearG" style="flex:1;text-align:center;font-weight:700"></div><button class="btn-outline" id="nextMonthG" style="width:auto">></button></div>
  <div class="grafik-wrapper" id="grafikList">Загрузка...</div>
</div>
</div></main></div>

<div class="modal" id="addModal"><div class="modal-card">
  <h3 style="margin-top:0">Пригласить повара</h3>
  <input id="cookEmail" type="email" placeholder="Email повара">
  <select id="cookJob">
    <option>Су-шеф</option><option>Повар</option><option>Повар горячего цеха</option>
    <option>Повар холодного цеха</option><option>Повар-универсал</option>
    <option>Повар-кондитер</option><option>Пиццайоло</option><option>Сушист</option><option>Мойщик посуды</option>
  </select>
  <input id="cookSalary" type="number" placeholder="Ставка в час">
  <button class="btn" id="genInviteBtn">Сгенерировать ссылку</button>
  <div id="inviteLink" class="muted"></div>
  <div id="qrcode"></div>
  <button class="btn-outline" style="margin-top:12px;width:100%" onclick="document.getElementById('addModal').classList.remove('show')">Закрыть</button>
</div></div>

<div class="modal" id="statusModal"><div class="modal-card"><h3>Статус на <span id="statusDate"></span></h3>
<button class="status-btn" style="background:var(--work)" id="btnWork">🟢 Смена</button>
<button class="status-btn" style="background:var(--sick)" id="btnSick">🟡 Больничный</button>
<button class="status-btn" style="background:var(--vac)" id="btnVac">🔵 Отпуск</button>
<button class="status-btn" style="background:var(--off)" id="btnOffStatus">⚪ Выходной</button>
<button class="btn-outline" style="margin-top:12px;width:100%" id="btnCancel">Отмена</button></div></div>

<div class="modal" id="povarModal"><div class="modal-card" id="povarModalCard"></div></div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supabase = createClient('https://xljogkyropyocvuuodfl.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs');
let currentTab='personal',myRestaurantId=null,currentDate=new Date(),povaraCache=[],attendanceCache={},tempStatusData={},me=null,headChef=null,brushStatus='work';

document.getElementById('burgerBtn').onclick=()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')}
document.getElementById('overlay').onclick=()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
document.querySelectorAll('.tab-btn').forEach(btn=>btn.onclick=()=>{currentTab=btn.dataset.tab;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('[data-tab-content]').forEach(c=>c.style.display=c.dataset.tabContent===currentTab?'block':'none');loadData()});
document.getElementById('logoutBtn').onclick=()=>supabase.auth.signOut().then(()=>location.href='/index.html');

document.querySelectorAll('.brush-btn').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.brush-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');brushStatus=btn.dataset.status});

function updateMonthLabels(){
  document.getElementById('monthYearT').textContent=currentDate.toLocaleString('ru',{month:'long',year:'numeric'});
  document.getElementById('monthYearG').textContent=currentDate.toLocaleString('ru',{month:'long',year:'numeric'});
}
document.getElementById('prevMonthT').onclick=()=>{currentDate.setMonth(currentDate.getMonth()-1);updateMonthLabels();loadData()}
document.getElementById('nextMonthT').onclick=()=>{currentDate.setMonth(currentDate.getMonth()+1);updateMonthLabels();loadData()}
document.getElementById('prevMonthG').onclick=()=>{currentDate.setMonth(currentDate.getMonth()-1);updateMonthLabels();loadData()}
document.getElementById('nextMonthG').onclick=()=>{currentDate.setMonth(currentDate.getMonth()+1);updateMonthLabels();loadData()}

document.getElementById('addBtn').onclick=()=>document.getElementById('addModal').classList.add('show');

function fireCook(cookId,name){if(confirm(`Уволить ${name}?`)){supabase.from('profiles').update({is_active:false}).eq('id',cookId).then(()=>loadData())}}

async function genInvite(){
  const email = document.getElementById('cookEmail').value.trim();
  const job = document.getElementById('cookJob').value;
  const salary = Number(document.getElementById('cookSalary').value)||0;
  const msgBox = document.getElementById('inviteLink');
  if(!email ||!email.includes('@')) return msgBox.innerHTML = `<div class="err">Введи email повара</div>`;
  if(!salary) return msgBox.innerHTML = `<div class="err">Укажи ставку</div>`;

  const link = `${location.origin}/register.html?role=cook&restaurant_id=${myRestaurantId}&email=${encodeURIComponent(email)}&job=${encodeURIComponent(job)}&salary=${salary}`;
  msgBox.innerHTML = `Должность: <b>${job}</b> • Ставка: <b>${salary}₽/ч</b><br>Скинь повару ссылку:<div class="link-box"><a href="${link}" target="_blank" style="color:var(--accent)">${link}</a></div>`;
  navigator.clipboard.writeText(link);
  document.getElementById('qrcode').innerHTML = '';
  new QRCode(document.getElementById("qrcode"), { text: link, width: 200, height: 200 });
  msgBox.innerHTML += `<div class="ok">✓ Ссылка скопирована</div>`;
}
document.getElementById('genInviteBtn').onclick=genInvite;

function openStatusModal(cookId,dateStr){if(dateStr<new Date().toISOString().split('T')[0])return;tempStatusData={cookId,dateStr};document.getElementById('statusDate').textContent=new Date(dateStr).toLocaleDateString('ru');document.getElementById('statusModal').classList.add('show')}

document.getElementById('btnWork').onclick=()=>setStatus('work');
document.getElementById('btnSick').onclick=()=>setStatus('sick');
document.getElementById('btnVac').onclick=()=>setStatus('vac');
document.getElementById('btnOffStatus').onclick=()=>setStatus('off');
document.getElementById('btnCancel').onclick=()=>document.getElementById('statusModal').classList.remove('show');

async function setStatus(status){document.getElementById('statusModal').classList.remove('show');const {cookId,dateStr}=tempStatusData;const existing=attendanceCache[cookId]?.days.find(d=>d.work_date===dateStr);try{if(status==='off'&&existing)await supabase.from('attendance').delete().eq('id',existing.id);else if(existing)await supabase.from('attendance').update({status}).eq('id',existing.id);else await supabase.from('attendance').insert({cook_id:cookId,restaurant_id:myRestaurantId,work_date:dateStr,status})}catch(e){alert('Ошибка: '+e.message)}loadData()}

function renderTotal(cookId){const data=attendanceCache[cookId];if(!data)return;const workDays=data.days.filter(d=>d.status==='work').length;const salary = Number(data.cook.salary) || 0; const total=workDays*8*salary;const el=document.getElementById(`total-${cookId}`);if(el)el.textContent=`${workDays} смен = ${total.toLocaleString()}₽`}

function openPovarCard(cookId){
  const data = attendanceCache[cookId];
  if(!data) return;
  const p = data.cook;
  const workDays = data.days.filter(d=>d.status==='work').length;
  const sickDays = data.days.filter(d=>d.status==='sick').length;
  const vacDays = data.days.filter(d=>d.status==='vac').length;
  const offDays = data.days.filter(d=>d.status==='off').length;
  const salary = Number(p.salary) || 0;
  const total = workDays * 8 * salary;

  document.getElementById('povarModalCard').innerHTML = `
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:20px">
      <div class="avatar" style="width:60px;height:60px;font-size:28px">${p.full_name[0]}</div>
      <div>
        <h3 style="margin:0">${p.full_name}</h3>
        <div class="muted">${p.job_title || 'Повар'}</div>
        <div class="muted">Ставка: ${salary}₽/ч</div>
      </div>
    </div>
    <h4>Статистика за ${currentDate.toLocaleString('ru',{month:'long'})}</h4>
    <div class="stat-row"><span>Смен</span><span><b>${workDays}</b></span></div>
    <div class="stat-row"><span>Больничных</span><span><b>${sickDays}</b></span></div>
    <div class="stat-row"><span>Отпусков</span><span><b>${vacDays}</b></span></div>
    <div class="stat-row"><span>Выходных</span><span><b>${offDays}</b></span></div>
    <div class="stat-row" style="border:none"><span>ЗП за месяц</span><span style="color:var(--work);font-size:18px"><b>${total.toLocaleString()}₽</b></span></div>
    <div class="povar-actions">
      <button class="btn-small" onclick="document.getElementById('povarModal').classList.remove('show');document.querySelector('[data-tab=\\'tabel\\']').click()">📋 Табель</button>
      <button class="btn-small" onclick="document.getElementById('povarModal').classList.remove('show');document.querySelector('[data-tab=\\'grafik\\']').click()">📅 График</button>
    </div>
    <button class="btn-danger" style="width:100%;margin-top:12px" onclick="fireCook('${p.id}','${p.full_name}');document.getElementById('povarModal').classList.remove('show')">🔴 Уволить</button>
    <button class="btn-outline" style="width:100%;margin-top:8px" onclick="document.getElementById('povarModal').classList.remove('show')">Закрыть</button>
  `;
  document.getElementById('povarModal').classList.add('show');
}

function renderGrafik(){const year=currentDate.getFullYear(),month=currentDate.getMonth(),days=new Date(year,month+1,0).getDate();let html=`<div class="grafik-grid" style="grid-template-columns:140px repeat(${days},40px)"><div class="grafik-header">Сотрудник</div>`;for(let i=1;i<=days;i++)html+=`<div class="grafik-header">${i}</div>`;povaraCache.forEach(p=>{html+=`<div class="grafik-name" data-id="${p.id}">${p.full_name}</div>`;for(let i=1;i<=days;i++){const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;const status=attendanceCache[p.id]?.days.find(d=>d.work_date===dateStr)?.status||'off';const symbol=status==='work'?'С':status==='sick'?'Б':status==='vac'?'О':'В';html+=`<div class="grafik-cell ${status}" data-id="${p.id}" data-date="${dateStr}">${symbol}</div>`}});html+='</div>';document.getElementById('grafikList').innerHTML=povaraCache.length?html:'<div>Нет данных</div>';setTimeout(()=>{document.querySelectorAll('.grafik-cell').forEach(c=>c.addEventListener('click',()=>setStatusDirect(c.dataset.id,c.dataset.date)));document.querySelectorAll('.grafik-name').forEach(n=>n.addEventListener('click',()=>openPovarCard(n.dataset.id)))},100)}

async function setStatusDirect(cookId,dateStr){
  const status = brushStatus;
  const existing=attendanceCache[cookId]?.days.find(d=>d.work_date===dateStr);
  try{if(status==='off'&&existing)await supabase.from('attendance').delete().eq('id',existing.id);else if(existing)await supabase.from('attendance').update({status}).eq('id',existing.id);else await supabase.from('attendance').insert({cook_id:cookId,restaurant_id:myRestaurantId,work_date:dateStr,status})}catch(e){alert('Ошибка: '+e.message)}loadData()
}

async function loadData(){
  try{
    const {data:{user}} = await supabase.auth.getUser();
    if(!user) return location.href='/index.html';
    let {data:prof} = await supabase.from('profiles').select('*,restaurants(name)').eq('id',user.id).single();
    if(!prof ||!prof.restaurant_id) throw new Error('Профиль не найден');
    me = prof; myRestaurantId=prof.restaurant_id;
    document.getElementById('restName').textContent=prof.restaurants?.name || 'Ресторан';

    const {data:allStaff} = await supabase.from('profiles').select('*').eq('restaurant_id',myRestaurantId).eq('is_active',true).order('created_at',{ascending:true});
    headChef = allStaff.find(p => p.role === 'chef') || allStaff.find(p => p.role === 'owner') || me;
    document.getElementById('pageSubtitle').innerText = prof.restaurants?.name;
    document.getElementById('pageTitle').innerText = headChef.full_name || 'Шеф';
    document.getElementById('pageRole').innerText = headChef.role === 'owner'? 'Владелец' : 'Шеф-повар';
    document.getElementById('sidebarChef').style.display = 'block';
    document.getElementById('sidebarRole').innerText = headChef.role === 'owner'? 'Владелец' : 'Шеф-повар';
    document.getElementById('sidebarChefName').innerText = headChef.full_name || 'Шеф';

    const year=currentDate.getFullYear(),month=currentDate.getMonth(),days=new Date(year,month+1,0).getDate(),start=`${year}-${String(month+1).padStart(2,'0')}-01`,end=`${year}-${String(month+1).padStart(2,'0')}-${days}`;
    updateMonthLabels();
    const {data:povara}=await supabase.from('profiles').select('*').eq('restaur
