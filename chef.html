<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit KITCHEN</title>
<style>
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:16px}
.top-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:24px}
.burger{background:#1a1a1a;border:none;width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#666;cursor:pointer}
.brand{color:#f97316;font-size:20px;font-weight:800;line-height:1.2}
.rest{color:#f97316;font-size:20px;font-weight:800}
.role{color:#888;font-size:14px;margin-top:4px}
.name{color:#fff;font-size:22px;font-weight:700;margin-top:2px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-head h2{font-size:20px;margin:0}
.btn-invite{background:#f97316;color:#000;border:none;width:100%;padding:14px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:16px}
.card{background:#111;border:1px solid #222;border-radius:10px;padding:14px 16px;margin-bottom:10px;font-size:16px}
input,select{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:12px;margin:8px 0;color:#fff;font-size:15px}
</style>
</head>
<body>

  <div class="top-row">
    <button class="burger" onclick="openSidebar()">☰</button>
    <div>
      <div class="brand">HotPit<br>KITCHEN</div>
      <div class="rest">| <span id="restName">Загрузка...</span></div>
      <div class="role">Шеф-повар</div>
      <div class="name" id="shefName">Загрузка...</div>
    </div>
  </div>

  <div class="section-head"><h2>Команда</h2></div>
  <button class="btn-invite" onclick="openInviteModal()">+ Пригласить</button>
  
  <div id="teamLoad" style="color:#888;font-size:14px">Загрузка...</div>
  <div id="teamList"></div>

  <div id="sidebarOverlay" onclick="closeSidebar()" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:998"></div>
  <div id="sidebar" style="position:fixed;top:0;left:-280px;width:280px;height:100%;background:#111;z-index:999;transition:0.3s;padding:20px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h3 style="color:#f97316;margin:0">Меню</h3>
      <button onclick="closeSidebar()" style="font-size:28px;background:none;border:none;color:#fff;cursor:pointer">×</button>
    </div>
    <a href="./chef.html" onclick="closeSidebar()" style="display:block;padding:12px 0;color:#fff;text-decoration:none;border-bottom:1px solid #222">Главная</a>
    <a href="./orders.html" onclick="closeSidebar()" style="display:block;padding:12px 0;color:#fff;text-decoration:none;border-bottom:1px solid #222">Заказы</a>
    <a href="./menu.html" onclick="closeSidebar()" style="display:block;padding:12px 0;color:#fff;text-decoration:none;border-bottom:1px solid #222">Меню ресторана</a>
    <a href="#" onclick="logout()" style="display:block;padding:12px 0;color:#fff;text-decoration:none;border-bottom:1px solid #222">Выйти</a>
  </div>

  <div id="inviteModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;z-index:1000;padding:20px">
    <div style="background:#111;border-radius:12px;padding:20px;width:100%;max-width:400px">
      <h3>Пригласить сотрудника</h3>
      <input id="inviteEmail" type="email" placeholder="Email повара">
      <select id="inviteRole"><option value="cook">Повар</option><option value="chef">Су-Шеф</option></select>
      <input id="inviteJob" placeholder="Должность: Повар горячего цеха">
      <input id="inviteSalary" type="number" placeholder="Ставка в час: 700">
      <button class="btn-invite" onclick="generateLink()">Сгенерировать ссылку</button>
      <input id="inviteLink" readonly placeholder="Тут появится ссылка">
      <button onclick="closeInviteModal()" style="width:100%;background:#222;color:#fff;border:none;padding:12px;border-radius:8px;margin-top:8px">Закрыть</button>
    </div>
  </div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
import {SUPABASE_URL, SUPABASE_ANON_KEY} from './js/config.js'
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let myRestaurantId = null;

async function loadChefData(){
  const { data: { user } } = await supabase.auth.getUser();
  if(!user){ location.href='./index.html'; return; }

  const {data: profile} = await supabase.from('profiles').select('full_name, restaurant_id, restaurants(name)').eq('id', user.id).single();
  if(!profile){ return; }
  
  myRestaurantId = profile.restaurant_id;
  document.getElementById('restName').innerText = profile.restaurants?.name || '...';
  document.getElementById('shefName').innerText = profile.full_name;
  document.getElementById('teamLoad').innerText = '';

  const {data: team} = await supabase.from('profiles').select('*').eq('restaurant_id', myRestaurantId).neq('role', 'owner');
  const teamDiv = document.getElementById('teamList');
  teamDiv.innerHTML = '';
  if(team.length === 0) teamDiv.innerHTML = '<div style="color:#888">Поваров пока нет</div>';
  
  team.forEach(p=>{
    const job = p.job_title || 'Повар';
    const salary = p.salary ? ` - ${p.salary}₽/ч` : '';
    teamDiv.innerHTML += `<div class="card"><b>${p.full_name}</b><br><span style="color:#888;font-size:14px">${job}${salary}</span></div>`
  })
}
loadChefData();

function openSidebar(){document.getElementById('sidebar').style.left='0';document.getElementById('sidebarOverlay').style.display='block'}
function closeSidebar(){document.getElementById('sidebar').style.left='-280px';document.getElementById('sidebarOverlay').style.display='none'}
window.openSidebar=openSidebar; window.closeSidebar=closeSidebar;

function openInviteModal(){document.getElementById('inviteModal').style.display='flex'}
function closeInviteModal(){document.getElementById('inviteModal').style.display='none'}
window.openInviteModal=openInviteModal; window.closeInviteModal=closeInviteModal;

function generateLink(){
  const email=document.getElementById('inviteEmail').value;
  const role=document.getElementById('inviteRole').value;
  const job=document.getElementById('inviteJob').value || 'Повар';
  const salary=document.getElementById('inviteSalary').value || 0;
  const link = `register.html?role=${role}&restaurant_id=${myRestaurantId}&email=${encodeURIComponent(email)}&job=${encodeURIComponent(job)}&salary=${salary}`;
  document.getElementById('inviteLink').value = location.origin + '/' + link;
}
window.generateLink=generateLink;

async function logout(){await supabase.auth.signOut();location.href='./index.html'}
window.logout=logout;
</script></body></html>
