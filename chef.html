<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit KITCHEN - ChefOS</title><style>
:root{--bg:#0a0a0a;--card:#171717;--card-2:#262626;--text:#f5f5f5;--muted:#a3a3a3;--accent:#f97316;--work:#22c55e;--sick:#f59e0b;--vac:#3b82f6;--in:#06b6d4;--out:#ec4899;--off:#555;--danger:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 80% -20%,rgba(249,115,22,0.12),transparent),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}
.app{display:flex;min-height:100vh}
.sidebar{width:260px;background:var(--card);border-right:1px solid #262626;padding:20px;display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:95;transition:transform.3s}
.sidebar.open{transform:translateX(0)}
.sidebar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.sidebar h2{color:var(--accent);font-size:24px}
.close-sidebar{background:transparent;border:none;color:var(--muted);font-size:24px;cursor:pointer;padding:0 4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;z-index:90}.overlay.show{display:block}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.menu button{width:100%;background:transparent;border:none;color:var(--text);text-align:left;padding:12px;border-radius:8px;cursor:pointer;font-weight:400;font-size:15px}
.menu button.active,.menu button:hover{background:var(--card-2)}

/* НОВЫЙ НАДЕЖНЫЙ АККОРДЕОН ChefOS */
.menu-parent{font-weight:700!important; color:var(--accent)!important; display:flex; justify-content:space-between; align-items:center}
.menu-item.has-submenu > .menu-parent::after{content:'▼'; font-size:12px; transition:transform .2s}
.menu-item.has-submenu.open > .menu-parent::after{transform:rotate(180deg)}
.menu-item .submenu{max-height:0; overflow:hidden; transition:max-height .25s ease; padding-left:15px; border-left:2px solid #f9731620; margin-left:10px; margin-top:4px}
.menu-item.open .submenu{max-height:500px}
.submenu button{font-size:14px; color:var(--muted); padding:10px 12px}
.submenu button:hover{color:var(--accent); background:#f9731610}

.content{flex:1;padding:24px;margin-left:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.burger{background:var(--card-2);border:1px solid #333;color:var(--text);padding:10px 16px;border-radius:8px;cursor:pointer;font-size:20px;line-height:1}
.povar-card{background:var(--card);padding:20px;border-radius:16px;margin-bottom:16px;border:1px solid #262626}
.povar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:#000;font-size:20px}
.btn{padding:12px 20px;border:none;border-radius:10px;background:var(--accent);color:#000;font-weight:700;cursor:pointer;width:100%;font-size:15px}
.btn-outline{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:10px 14px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600}
.btn-danger{background:var(--danger);color:#fff;padding:10px 14px;border:none;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600}
input,select{width:100%;padding:12px;background:var(--card-2);border:1px solid #333;border-radius:10px;color:var(--text);margin-top:8px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day-header{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:4px}
.day{aspect-ratio:1;border-radius:10px;background:var(--card-2);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;font-weight:600;pointer-events:auto; touch-action:manipulation;position:relative}
.day.work{background:var(--work);color:#000}.day.sick{background:var(--sick);color:#000}.day.vac{background:var(--vac);color:#fff}
.day.in{background:var(--in);color:#000}.day.out{background:var(--out);color:#fff}.day.off{background:var(--off);color:#aaa}
.day.done{background:linear-gradient(135deg, var(--in) 50%, var(--out) 50%);color:#000}
.day.today{border:2px solid var(--accent)}
.day.past{opacity:0.4;cursor:not-allowed}
.total{margin-top:16px;padding-top:16px;border-top:1px solid #333;font-weight:700;font-size:15px;color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.show{display:flex}.modal-card{background:var(--card);padding:24px;border-radius:20px;width:100%;max-width:420px;border:1px solid #262626}
.status-btn{padding:14px;border:none;border-radius:12px;width:100%;margin-top:8px;font-weight:700;cursor:pointer}
.sidebar-chef{padding:12px;border-radius:12px;background:var(--card-2);margin-bottom:20px}
.muted{color:var(--muted);font-size:12px;margin-top:8px}
.ok{color:#22c55e}.err{color:var(--danger);padding:20px}
.link-box{word-break:break-all;background:#000;padding:10px;border-radius:8px;margin-top:8px;font-size:12px}
#qrcode{margin-top:12px;padding:12px;background:#fff;border-radius:12px;display:inline-block}
@media(min-width:901px){.sidebar{position:static;transform:translateX(0)}.content{margin-left:260px}.burger,.close-sidebar{display:none}}
</style>
