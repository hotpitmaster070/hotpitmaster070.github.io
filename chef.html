<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit KITCHEN</title><style>
:root{--bg:#0a0a0a;--card:#171717;--card-2:#262626;--text:#f5f5f5;--muted:#a3a3a3;--accent:#f97316;--work:#22c55e;--sick:#f59e0b;--vac:#3b82f6;--off:#64748b;--danger:#ef4444}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none}body{background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif;margin:0;overflow-x:hidden}
.app{display:flex;min-height:100vh}.sidebar{width:260px;background:var(--card);padding:20px;position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:95;transition:.3s}
.sidebar.open{transform:translateX(0)}.sidebar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.close-btn{background:var(--card-2);border:none;color:var(--text);width:36px;height:36px;border-radius:10px;font-size:20px;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;z-index:90}.overlay.show{display:block}
.menu button{width:100%;background:transparent;border:none;color:var(--text);text-align:left;padding:12px;border-radius:12px;cursor:pointer;font-weight:500;font-size:15px}
.menu button.active{background:var(--card-2)}.content{flex:1;padding:20px}.topbar{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.burger{background:var(--card-2);border:1px solid #333;color:var(--text);padding:10px 16px;border-radius:12px;cursor:pointer;font-size:20px}
.btn{padding:12px 20px;border:none;border-radius:12px;background:var(--accent);color:#000;font-weight:700;cursor:pointer;width:100%}
.btn-outline{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:12px}
.btn-danger{background:var(--danger);color:#fff;padding:8px 12px;border:none;border-radius:8px;cursor:pointer;font-size:12px}
.btn-small{background:var(--card-2);border:1px solid #333;color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:12px}
input,select{width:100%;padding:12px;background:var(--card-2);border:1px solid #333;border-radius:12px;color:var(--text);margin-top:8px}
.povar-card{background:var(--card);padding:16px;border-radius:16px;border:1px solid #262626;margin-bottom:12px}
.povar-info{display:flex;gap:12px;align-items:center}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:#000;font-size:20px}
.avatar-big{width:80px;height:80px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:#000;font-size:36px;margin:0 auto 16px}
.tinder-card{background:var(--card);padding:24px;border-radius:24px;border:2px solid #262626;text-align:center;margin-bottom:16px}
.tinder-actions{display:flex;justify-content:space-between;margin-bottom:16px}
.tinder-actions button{background:var(--card-2);border:none;color:var(--text);width:50px;height:50px;border-radius:50%;font-size:24px;cursor:pointer}
.calendar-header{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
.calendar-header div{text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;background:#222;border:2px solid #333;cursor:pointer;font-size:16px}
.day.work{background:var(--work);color:#000;border-color:var(--work)}
.day.sick{background:var(--sick);color:#000;border-color:var(--sick)}
.day.vac{background:var(--vac);color:#000;border-color:var(--vac)}
.brush-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);padding:12px;display:flex;gap:8px;z-index:80;border-top:1px solid #262626}
.brush-btn{flex:1;padding:14px;border-radius:14px;border:2px solid #333;background:var(--card-2);color:var(--text);font-weight:700;cursor:pointer;font-size:14px}
.brush-btn.active{border-color:var(--accent);background:var(--accent);color:#000}
.table-view{display:none;overflow-x:auto}
.table-grid{display:grid;gap:4px;min-width:800px}
.table-header{display:contents}
.table-header div{padding:8px;text-align:center;font-size:11px;color:var(--muted);font-weight:600;background:var(--card-2);border-radius:6px}
.table-row{display:contents}
.table-name{padding:8px;background:var(--card);border-radius:6px;font-weight:600;display:flex;align-items:center;gap:8px;position:sticky;left:0}
.table-cell{aspect-ratio:1;border-radius:6px;background:#222;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer}
.table-cell.work{background:var(--work)}.table-cell.sick{background:var(--sick)}.table-cell.vac{background:var(--vac)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.show{display:flex}.modal-card{background:var(--card);padding:24px;border-radius:20px;width:100%;max-width:480px}
.brand{color:var(--accent);font-size:22px;font-weight:800}
.restaurant-name{color:var(--muted);font-size:14px;margin-bottom:20px}
.chef-name{font-size:20px;font-weight:700}
.chef-role{font-size:14px;color:var(--muted)}
.sidebar-chef{padding:12px;border-radius:12px;background:var(--card-2);margin-bottom:20px}
#qrcode{margin-top:12px;padding:12px;background:#fff;border-radius:12px;display:inline-block}
.link-box{word-break:break-all;background:#000;padding:10px;border-radius:8px;margin-top:8px;font-size:12px}
.salary-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #262626}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #262626}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.hint-bottom{padding-bottom:90px}
.ok{color:#22c55e}.err{color:var(--danger)}
</style></head><body>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<div class="app"><div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header"><h2 style="color:var(--accent);margin:0">HotPit</h2><button class="close-btn" id="closeSidebar">×</button></div>
<div id="sidebarChef" class="sidebar-chef" style="display:none"><div style="font-size:12px;color:var(--muted)" id="sidebarRole">Шеф-повар</div><div id="sidebarChefName" style="font-weight:700"></div></div>
<div id="restName" style="color:var(--muted);font-size:12px;margin-bottom:16px">Загрузка...</div>
<nav class="menu">
<button class="tab-btn active" data-tab="personal">👨‍🍳 Команда</button>
<button class="tab-btn" data-tab="tabel">📋 Табель</button>
<button class="tab-btn" data-tab="grafik">📅 График</button>
<button class="tab-btn" data-tab="salary">💰 Зарплата</button>
<button class="tab-btn" data-tab="mission">💛 Миссия</button>
<button id="logoutBtn">Выйти</button></nav></aside>
<main class="content hint-bottom"><div class="topbar"><button class="burger" id="burgerBtn">☰</button>
<div style="flex:1"><div class="brand">HotPit KITCHEN</div><div class="restaurant-name" id="pageSubtitle">Загрузка...</div><div class="chef-name" id="pageTitle">Загрузка...</div><div class="chef-role" id="pageRole">Загрузка...</div></div>
<button class="btn" id="addBtn" style="width:auto">+ Пригласить</button></div>
<div id="tab-content">
<div data-tab-content="personal"><h3>Команда</h3><div id="povaraList">Загрузка...</div></div>

<div data-tab-content="tabel" style="display:none">
  <div style="display:flex;gap:10px;margin-bottom:20px"><button class="btn-outline" id="prevMonthT" style="width:auto"><</button><div id="monthYearT" style="flex:1;text-align:center;font-weight:700"></div><button class="btn-outline" id="nextMonthT" style="width:auto">></button></div>
  <div class="table-view" id="tabelTable"></div>
</div>

<div data-tab-content="grafik" style="display:none">
  <div style="display:flex;gap:10px;margin-bottom:12px;align-items:center">
    <button class="btn-outline" id="prevMonthG" style="width:auto"><</button>
    <div id="monthYearG" style="flex:1;text-align:center;font-weight:700;font-size:18px"></div>
    <button class="btn-outline" id="nextMonthG" style="width:auto">></button>
    <button class="btn-outline" id="toggleViewBtn" style="width:auto">📊 Таблица</button>
  </div>
  <div id="tinderView">
    <div class="tinder-actions"><button onclick="prevCook()">←</button><button onclick="nextCook()">→</button></div>
    <div class="tinder-card" id="currentCookCard"></div>
    <div id="currentCookCalendar"></div>
  </div>
  <div class="table-view" id="grafikTable"></div>
</div>

<div data-tab-content="salary" style="display:none"><h3>Ведомость за <span id="monthYearS"></span></h3><button class="btn" style="margin-bottom:16px" id="exportBtn">📄 Экспорт PDF</button><div id="salaryList">Загрузка...</div></div>
<div data-tab-content="mission" style="display:none"><h3>💛 Миссия HotPit</h3><div class="povar-card"><p>С каждого часа работы мы отчисляем 1% в фонд помощи детям.</p><div class="stat-row"><span>Собрано в этом месяце</span><b id="missionTotal">0₽</b></div><div class="stat-row"><span>Помогли детям</span><b>3</b></div></div></div>
</div></main></div>

<div class="brush-bar" id="brushBar" style="display:none">
  <button class="brush-btn active" data-status="work" style="background:var(--work);color:#000">🟢 Смена</button>
  <button class="brush-btn" data-status="sick" style="background:var(--sick);color:#000">🟡 Б</button>
  <button class="brush-btn" data-status="vac" style="background:var(--vac)">🔵 О</button>
  <button class="brush-btn" data-status="off" style="background:var(--off)">⚪ Стереть</button>
</div>

<div class="modal" id="addModal"><div class="modal-card"><h3 style="margin-top:0">Пригласить повара</h3><input id="cookEmail" type="email" placeholder="Email повара"><select id="cookJob"><option>Су-шеф</option><option>Повар</option><option>Повар горячего цеха</option><option>Повар холодного цеха</option><option>Повар-универсал</option><option>Повар-кондитер</option><option>Пиццайоло</option><option>Сушист</option><option>Мойщик посуды</option></select><input id="cookSalary" type="number" placeholder="Ставка в час"><button class="btn" id="genInviteBtn">Сгенерировать ссылку</button><div id="inviteLink" class="muted"></div><div id="qrcode"></div><button class="btn-outline" style="margin-top:12px;width:100%" onclick="document.getElementById('addModal').classList.remove('show')">Закрыть</button></div></div>

<div class="modal" id="cookModal"><div class="modal-card" id="cookModalCard"></div></div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supabase = createClient('https://xljogkyropyocvuuodfl.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs');
let currentTab='personal',myRestaurantId=null,currentDate=new Date(),povaraCache=[],attendanceCache={},brushStatus='work',currentCookIndex=0,viewMode='tinder',me=null,headChef=null;

const closeSidebar = ()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
document.getElementById('burgerBtn').onclick=()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')}
document.getElementById('closeSidebar').onclick=closeSidebar;
document.getElementById('overlay').onclick=closeSidebar;

document.querySelectorAll('.tab-btn').forEach(btn=>btn.onclick=()=>{currentTab=btn.dataset.tab;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('[data-tab-content]').forEach(c=>c.style.display=c.dataset.tabContent===currentTab?'block':'none');document.getElementById('brushBar').style.display = currentTab==='grafik'?'flex':'none';loadData();closeSidebar()});
document.querySelectorAll('.brush-btn').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.brush-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');brushStatus=btn.dataset.status});

function updateMonthLabels(){
  const month = currentDate.toLocaleString('ru',{month:'long',year:'numeric'});
  document.getElementById('monthYearT').textContent=month;
  document.getElementById('monthYearG').textContent=month;
  document.getElementById('monthYearS').textContent=month;
}
document.getElementById('prevMonthT').onclick=()=>{currentDate.setMonth(currentDate.getMonth()-1);updateMonthLabels();renderTable('tabel')}
document.getElementById('nextMonthT').onclick=()=>{currentDate.setMonth(currentDate.getMonth()+1);updateMonthLabels();renderTable('tabel')}
document.getElementById('prevMonthG').onclick=()=>{currentDate.setMonth(currentDate.getMonth()-1);updateMonthLabels();renderGrafik()}
document.getElementById('nextMonthG').onclick=()=>{currentDate.setMonth(currentDate.getMonth()+1);updateMonthLabels();renderGrafik()}
document.getElementById('toggleViewBtn').onclick=()=>{viewMode=viewMode==='tinder'?'table':'tinder';document.getElementById('tinderView').style.display=viewMode==='tinder'?'block':'none';document.getElementById('grafikTable').style.display=viewMode==='table'?'block':'none';document.getElementById('toggleViewBtn').innerText=viewMode==='tinder'?'📊 Таблица':'👆 Тиндер';renderGrafik()}
document.getElementById('addBtn').onclick=()=>document.getElementById('addModal').classList.add('show');

async function genInvite(){
  const email = document.getElementById('cookEmail').value.trim();
  const job = document.getElementById('cookJob').value;
  const salary = Number(document.getElementById('cookSalary').value)||0;
  const msgBox = document.getElementById('inviteLink');
  if(!email ||!email.includes('@')) return msgBox.innerHTML = `<div class="err">Введи email повара</div>`;
  if(!salary) return msgBox.innerHTML = `<div class="err">Укажи ставку</div>`;
  const link = `${location.origin}/register.html?role=cook&restaurant_id=${myRestaurantId}&email=${encodeURIComponent(email)}&job=${encodeURIComponent(job)}&salary=${salary}`;
  msgBox.innerHTML = `Должность: <b>${job}</b> • Ставка: <b>${salary}₽/ч</b><br>Скинь повару ссылку:<div class="link-box"><a href="${link}" target="_blank" style="color:var(--accent)">${link}</a></div>`;
  navigator.clipboard.writeText(link);
  document.getElementById('qrcode').innerHTML = '';
  new QRCode(document.getElementById("qrcode"), { text: link, width: 200, height: 200 });
  msgBox.innerHTML += `<div class="ok">✓ Ссылка скопирована</div>`;
}
document.getElementById('genInviteBtn').onclick=genInvite;

function nextCook(){currentCookIndex=(currentCookIndex+1)%povaraCache.length;renderTinderCard()}
function prevCook(){currentCookIndex=(currentCookIndex-1+povaraCache.length)%povaraCache.length;renderTinderCard()}

function renderTinderCard(){
  if(povaraCache.length===0)return;
  const p=povaraCache[currentCookIndex];
  document.getElementById('currentCookCard').innerHTML=`<div class="avatar-big">${p.full_name[0]}</div><h2 style="margin:0">${p.full_name}</h2><div style="color:var(--muted)">${p.job_title} • ${p.salary}₽/ч</div><button class="btn-small" style="margin-top:12px" onclick="openCookCard('${p.id}')">👤 Карточка</button><div style="color:var(--muted);margin-top:8px;font-size:12px">Свайп ← → чтобы переключить</div>`;
  renderSingleCalendar('currentCookCalendar',p.id);
}

function openCookCard(cookId){
  const cook = povaraCache.find(p=>p.id===cookId);
  const data = attendanceCache[cookId]?.days || [];
  const stats = {work:0,sick:0,vac:0,off:0};
  data.forEach(d=>stats[d.status]++);
  const salary = Number(cook.salary)||0;
  const zp = stats.work * 8 * salary;
  document.getElementById('cookModalCard').innerHTML = `
    <div style="display:flex;gap:16px;margin-bottom:20px"><div class="avatar-big" style="width:60px;height:60px;font-size:28px;margin:0">${cook.full_name[0]}</div><div><h3 style="margin:0">${cook.full_name}</h3><div style="color:var(--muted)">${cook.job_title}</div><div style="color:var(--muted)">Ставка: ${salary}₽/ч</div></div></div>
    <h4>Статистика за ${currentDate.toLocaleString('ru',{month:'long'})}</h4>
    <div class="stat-row"><span>Смен</span><b>${stats.work}</b></div><div class="stat-row"><span>Больничных</span><b>${stats.sick}</b></div><div class="stat-row"><span>Отпусков</span><b>${stats.vac}</b></div><div class="stat-row"><span>ЗП за месяц</span><b style="color:#22c55e">${zp.toLocaleString()}₽</b></div>
    <button class="btn-danger" style="width:100%;margin:16px 0" onclick="fireCook('${cookId}','${cook.full_name}')">Уволить</button>
    <button class="btn-outline" style="width:100%" onclick="document.getElementById('cookModal').classList.remove('show')">Закрыть</button>`;
  document.getElementById('cookModal').classList.add('show');
}

async function fireCook(id, name){
  if(confirm(`Уволить ${name}?`)){
    await supabase.from('profiles').update({is_active:false}).eq('id',id);
    document.getElementById('cookModal').classList.remove('show');
    loadData();
  }
}

function renderSingleCalendar(containerId, cookId){
  const year=currentDate.getFullYear(),month=currentDate.getMonth();
  const days=new Date(year,month+1,0).getDate();
  const firstDay=new Date(year,month,1).getDay();
  const offset = firstDay === 0? 6 : firstDay - 1;
  const weekDays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  let html = '<div class="calendar-header">';
  weekDays.forEach(d=>html+=`<div>${d}</div>`);
  html+='</div><div class="calendar-grid">';
  for(let i=0;i<offset;i++) html+=`<div></div>`;
  for(let i=1;i<=days;i++){
    const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    const status=attendanceCache[cookId]?.days.find(d=>d.work_date===dateStr)?.status||'off';
    html+=`<div class="day ${status}" onclick="setStatusDirect('${cookId}','${dateStr}')">${i}</div>`
  }
  html+='</div>';
  document.getElementById(containerId).innerHTML = html;
}

function renderTable(type){
  const container = document.getElementById(type+'Table');
  container.style.display='block';
  const year=currentDate.getFullYear(),month=currentDate.getMonth();
  const days=new Date(year,month+1,0).getDate();
  let html = '<div class="table-grid" style="grid-template-columns:160px repeat('+days+',40px)">';
  html += '<div class="table-header"><div>Повар</div>';
  for(let i=1;i<=days;i++) html+=`<div>${i}</div>`;
  html+='</div>';
  povaraCache.forEach(p=>{
    html += `<div class="table-row"><div class="table-name"><div class="avatar" style="width:30px;height:30px;font-size:14px">${p.full_name[0]}</div>${p.full_name}</div>`;
    for(let i=1;i<=days;i++){
      const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
      const status=attendanceCache[p.id]?.days.find(d=>d.work_date===dateStr)?.status||'off';
      html+=`<div class="table-cell ${status}" onclick="setStatusDirect('${p.id}','${dateStr}')">${status==='work'?'8':''}</div>`
    }
    html+='</div>';
  });
  html+='</div>';
  container.innerHTML=html;
}

function renderGrafik(){
  if(viewMode==='tinder'){document.getElementById('tinderView').style.display='block';document.getElementById('grafikTable').style.display='none';currentCookIndex=0;renderTinderCard()}
  else{renderTable('grafik')}
}

async function setStatusDirect(cookId,dateStr){
  if(dateStr<new Date().toISOString().split('T')[0])return;
  const status = brushStatus;
  const existing=attendanceCache[cookId]?.days.find(d=>d.work_date===dateStr);
  try{
    if(status==='off'&&existing)await supabase.from('attendance').delete().eq('id',existing.id);
    else if(existing)await supabase.from('attendance').update({status}).eq('id',existing.id);
    else await supabase.from('attendance').insert({cook_id:cookId,restaurant_id:myRestaurantId,work_date:dateStr,status})
  }catch(e){alert('Ошибка: '+e.message)}
  await loadData();
  renderGrafik();
}

function renderSalary(){
  let html='';
  povaraCache.forEach(p=>{
    const workDays=attendanceCache[p.id]?.days.filter(d=>d.status==='work').length||0;
    const salary = Number(p.salary) || 0;
    const total=workDays*8*salary;
    html+=`<div class="salary-row"><div><b>${p.full_name}</b><div style="font-size:12px;color:var(--muted)">${workDays} смен</div></div><b>${total.toLocaleString()}₽</b></div>`
  });
  document.getElementById('salaryList').innerHTML=html||'<div class="empty-state">Нет данных</div>';
  document.getElementById('missionTotal').innerText = Math.round(povaraCache.reduce((sum,p)=>sum+((attendanceCache[p.id]?.days.filter(d=>d.status==='work').length||0)*8*(Number(p.salary)||0)),0)*0.01).toLocaleString()+'₽';
}

async function loadData(){
  try{
    const {data:{user}} = await supabase.auth.getUser();
    if(!user) return location.href='/index.html';
    let {data:prof} = await supabase.from('profiles').select('*,restaurants(name)').eq('id',user.id).single();
    if(!prof ||!prof.restaurant_id) throw new Error('Профиль не найден');
    me = prof; myRestaurantId=prof.restaurant_id;
    document.getElementById('restName').textContent=prof.restaurants?.name;
    const {data:allStaff} = await supabase.from('profiles').select('*').eq('restaurant_id',myRestaurantId).eq('is_active',true);
    headChef = allStaff.find(p => p.role === 'chef') || allStaff.find(p => p.role === 'owner') || me;
    document.getElementById('pageSubtitle').innerText = prof.restaurants?.name;
    document.getElementById('pageTitle').innerText = headChef.full_name || 'Шеф';
    document.getElementById('pageRole').innerText = headChef.role === 'owner'? 'Владелец' : 'Шеф-повар';
    document.getElementById('sidebarChef').style.display = 'block';
    document.getElementById('sidebarRole').innerText = headChef.role === 'owner'? 'Владелец' : 'Шеф-повар';
    document.getElementById('sidebarChefName').innerText = headChef.full_name || 'Шеф';

    const year=currentDate.getFullYear(),month=currentDate.getMonth(),days=new Date(year,month+1,0).getDate(),start=`${year}-${String(month+1).padStart(2,'0')}-01`,end=`${year}-${String(month+1).padStart(2,'0')}-${days}`;
    updateMonthLabels();

    const {data:povara}=await supabase.from('profiles').select('*').eq('restaurant_id',myRestaurantId).eq('is_active',true).eq('role','cook');
    const {data:attendance}=await supabase.from('attendance').select('*').eq('restaurant_id',myRestaurantId).gte('work_date',start).lte('work_date',end);
    povaraCache=povara||[];
    attendanceCache={};
    povaraCache.forEach(p=>attendanceCache[p.id]={cook:p,days:(attendance||[]).filter(a=>a.cook_id===p.id)});

    let povaraHTML = '';
    povaraCache.forEach(p=>{
      povaraHTML += `<div class="povar-card"><div class="povar-info"><div class="avatar">${p.full_name[0]}</div><div><b>${p.full_name}</b><div style="color:var(--muted);font-size:12px">${p.job_title} • ${p.salary}₽/ч</div></div></div><button class="btn-small" style="margin-top:12px" onclick="openCookCard('${p.id}')">Открыть карточку</button></div>`
    });
    document.getElementById('povaraList').innerHTML = povaraHTML || '<div class="empty-state">Поваров пока нет</div>';

    if(currentTab==='grafik') renderGrafik();
    if(currentTab==='tabel') renderTable('tabel');
    if(currentTab==='salary') renderSalary();

  }catch(e){
    console.error(e);
    document.getElementById('povaraList').innerHTML=`<div class="err">Ошибка: ${e.message}</div>`
  }
}

document.getElementById('exportBtn').onclick=()=>alert('PDF экспорт в v4.1');
document.getElementById('logoutBtn').onclick=()=>supabase.auth.signOut().then(()=>location.href='/index.html');

loadData();
</script></body></html>
