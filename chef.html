<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit KITCHEN</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<div class="app">
  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <h2 style="color:var(--accent)">HotPit KITCHEN</h2>
    <div id="sidebarChef" class="sidebar-chef" style="display:none">
      <div style="font-size:12px;color:var(--muted)" id="sidebarRole">Шеф-повар</div>
      <div id="sidebarChefName" style="font-weight:700"></div>
    </div>
    <div id="restName" style="color:var(--muted);font-size:12px;margin-bottom:16px">Загрузка...</div>
    <nav class="menu">
      <button class="tab-btn active" data-tab="personal">👨‍🍳 Команда Кухни</button>
      <button class="tab-btn" data-tab="tabel">📋 Табель</button>
      <button class="tab-btn" data-tab="grafik">📅 График</button>
      <button id="logoutBtn">Выйти</button>
    </nav>
  </aside>

  <main class="content">
    <div class="topbar">
      <button class="burger" id="burgerBtn">☰</button>
      <div style="flex:1">
        <div class="brand">HotPit KITCHEN</div>
        <div class="restaurant-name" id="pageSubtitle">Загрузка ресторана...</div>
        <div class="chef-name" id="pageTitle">Загрузка...</div>
        <div class="chef-role" id="pageRole">Загрузка...</div>
      </div>
      <button class="btn" id="addBtn" style="width:auto">+ Пригласить</button>
    </div>

    <div id="tab-content">
      <div data-tab-content="personal">
        <h3>Команда</h3>
        <div id="povaraList">Загрузка...</div>
      </div>

      <div data-tab-content="tabel" style="display:none">
        <div style="display:flex;gap:10px;margin-bottom:20px">
          <button class="btn-outline" id="prevMonthT" style="width:auto"><</button>
          <div id="monthYearT" style="flex:1;text-align:center;font-weight:700"></div>
          <button class="btn-outline" id="nextMonthT" style="width:auto">></button>
        </div>
        <div id="tabelList">Загрузка...</div>
      </div>

      <div data-tab-content="grafik" style="display:none">
        <div style="display:flex;gap:10px;margin-bottom:20px">
          <button class="btn-outline" id="prevMonthG" style="width:auto"><</button>
          <div id="monthYearG" style="flex:1;text-align:center;font-weight:700"></div>
          <button class="btn-outline" id="nextMonthG" style="width:auto">></button>
        </div>
        <div class="grafik-wrapper" id="grafikList">Загрузка...</div>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="addModal">
  <div class="modal-card">
    <h3 style="margin-top:0">Пригласить повара</h3>
    <input id="cookEmail" type="email" placeholder="Email повара">
    <select id="cookJob">
      <option>Су-шеф</option><option>Повар</option><option>Повар горячего цеха</option>
      <option>Повар холодного цеха</option><option>Повар-универсал</option>
      <option>Повар-кондитер</option><option>Пиццайоло</option><option>Сушист</option><option>Мойщик посуды</option>
    </select>
    <input id="cookSalary" type="number" placeholder="Ставка в час">
    <button class="btn" id="genInviteBtn">Сгенерировать ссылку</button>
    <div id="inviteLink" class="muted"></div>
    <div id="qrcode"></div>
    <button class="btn-outline" style="margin-top:12px;width:100%" onclick="document.getElementById('addModal').classList.remove('show')">Закрыть</button>
  </div>
</div>

<div class="modal" id="statusModal">
  <div class="modal-card">
    <h3>Статус на <span id="statusDate"></span></h3>
    <button class="status-btn" style="background:var(--work)" onclick="setStatus('work')">Смена</button>
    <button class="status-btn" style="background:var(--sick)" onclick="setStatus('sick')">Больничный</button>
    <button class="status-btn" style="background:var(--vac)" onclick="setStatus('vac')">Отпуск</button>
    <button class="status-btn" style="background:var(--card-2)" onclick="setStatus('off')">Выходной</button>
    <button class="btn-outline" style="margin-top:12px;width:100%" onclick="document.getElementById('statusModal').classList.remove('show')">Отмена</button>
  </div>
</div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supabase = createClient('https://xljogkyropyocvuuodfl.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs');
let currentTab='personal',myRestaurantId=null,currentDate=new Date(),povaraCache=[],attendanceCache={},tempStatusData={},me=null,headChef=null;

document.getElementById('burgerBtn').onclick=()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')}
document.getElementById('overlay').onclick=()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
document.querySelectorAll('.tab-btn').forEach(btn=>btn.onclick=()=>{currentTab=btn.dataset.tab;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('[data-tab-content]').forEach(c=>c.style.display=c.dataset.tabContent===currentTab?'block':'none');loadData()});
document.getElementById('logoutBtn').onclick=()=>supabase.auth.signOut().then(()=>location.href='/index.html');

function updateMonthLabels(){
  document.getElementById('monthYearT').textContent=currentDate.toLocaleString('ru',{month:'long',year:'numeric'});
  document.getElementById('monthYearG').textContent=currentDate.toLocaleString('ru',{month:'long',year:'numeric'});
}
document.getElementById('prevMonthT').onclick=()=>{currentDate.setMonth(currentDate.getMonth()-1);updateMonthLabels();loadData()}
document.getElementById('nextMonthT').onclick=()=>{currentDate.setMonth(currentDate.getMonth()+1);updateMonthLabels();loadData()}
document.getElementById('prevMonthG').onclick=()=>{currentDate.setMonth(currentDate.getMonth()-1);updateMonthLabels();loadData()}
document.getElementById('nextMonthG').onclick=()=>{currentDate.setMonth(currentDate.getMonth()+1);updateMonthLabels();loadData()}

document.getElementById('addBtn').onclick=()=>document.getElementById('addModal').classList.add('show');

function fireCook(cookId,name){if(confirm(`Уволить ${name}?`)){supabase.from('profiles').update({is_active:false}).eq('id',cookId).then(()=>loadData())}}

async function genInvite(){
  const email = document.getElementById('cookEmail').value.trim();
  const job = document.getElementById('cookJob').value;
  const salary = Number(document.getElementById('cookSalary').value)||0;
  const msgBox = document.getElementById('inviteLink');
  if(!email ||!email.includes('@')) return msgBox.innerHTML = `<div class="err">Введи email повара</div>`;
  if(!salary) return msgBox.innerHTML = `<div class="err">Укажи ставку</div>`;

  const link = `${location.origin}/register.html?role=cook&restaurant_id=${myRestaurantId}&email=${encodeURIComponent(email)}&job=${encodeURIComponent(job)}&salary=${salary}`;
  msgBox.innerHTML = `Должность: <b>${job}</b> • Ставка: <b>${salary}₽/ч</b><br>Скинь повару ссылку:<div class="link-box"><a href="${link}" target="_blank" style="color:var(--accent)">${link}</a></div>`;
  navigator.clipboard.writeText(link);
  document.getElementById('qrcode').innerHTML = '';
  new QRCode(document.getElementById("qrcode"), { text: link, width: 200, height: 200 });
  msgBox.innerHTML += `<div class="ok">✓ Ссылка скопирована</div>`;
}
document.getElementById('genInviteBtn').onclick=genInvite;

function openStatusModal(cookId,dateStr){if(dateStr<new Date().toISOString().split('T')[0])return;tempStatusData={cookId,dateStr};document.getElementById('statusDate').textContent=new Date(dateStr).toLocaleDateString('ru');document.getElementById('statusModal').classList.add('show')}
async function setStatus(status){document.getElementById('statusModal').classList.remove('show');const {cookId,dateStr}=tempStatusData;const existing=attendanceCache[cookId]?.days.find(d=>d.work_date===dateStr);try{if(status==='off'&&existing)await supabase.from('attendance').delete().eq('id',existing.id);else if(existing)await supabase.from('attendance').update({status}).eq('id',existing.id);else await supabase.from('attendance').insert({cook_id:cookId,restaurant_id:myRestaurantId,work_date:dateStr,status})}catch(e){alert('Ошибка: '+e.message)}loadData()}
function renderTotal(cookId){const data=attendanceCache[cookId];if(!data)return;const workDays=data.days.filter(d=>d.status==='work').length;const salary = Number(data.cook.salary) || 0; const total=workDays*8*salary;const el=document.getElementById(`total-${cookId}`);if(el)el.textContent=`${workDays} смен = ${total.toLocaleString()}₽`}
function renderGrafik(){const year=currentDate.getFullYear(),month=currentDate.getMonth(),days=new Date(year,month+1,0).getDate();let html=`<div class="grafik-grid" style="grid-template-columns:140px repeat(${days},40px)"><div class="grafik-header">Сотрудник</div>`;for(let i=1;i<=days;i++)html+=`<div class="grafik-header">${i}</div>`;povaraCache.forEach(p=>{html+=`<div class="grafik-name">${p.full_name}</div>`;for(let i=1;i<=days;i++){const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;const status=attendanceCache[p.id]?.days.find(d=>d.work_date===dateStr)?.status||'off';const symbol=status==='work'?'С':status==='sick'?'Б':status==='vac'?'О':'-';html+=`<div class="grafik-cell ${status}" data-id="${p.id}" data-date="${dateStr}">${symbol}</div>`}});html+='</div>';document.getElementById('grafikList').innerHTML=povaraCache.length?html:'<div>Нет данных</div>';document.querySelectorAll('.grafik-cell').forEach(c=>c.onclick=()=>openStatusModal(c.dataset.id,c.dataset.date))}

async function loadData(){
  try{
    const {data:{user}} = await supabase.auth.getUser();
    if(!user) return location.href='/index.html';
    let {data:prof} = await supabase.from('profiles').select('*,restaurants(name)').eq('id',user.id).single();
    if(!prof ||!prof.restaurant_id) throw new Error('Профиль не найден');
    me = prof; myRestaurantId=prof.restaurant_id;
    document.getElementById('restName').textContent=prof.restaurants?.name || 'Ресторан';

    const {data:allStaff} = await supabase.from('profiles').select('*').eq('restaurant_id',myRestaurantId).eq('is_active',true).order('created_at',{ascending:true});
    headChef = allStaff.find(p => p.role === 'chef') || allStaff.find(p => p.role === 'owner') || me;
    document.getElementById('pageSubtitle').innerText = prof.restaurants?.name;
    document.getElementById('pageTitle').innerText = headChef.full_name || 'Шеф';
    document.getElementById('pageRole').innerText = headChef.role === 'owner'? 'Владелец' : 'Шеф-повар';
    document.getElementById('sidebarChef').style.display = 'block';
    document.getElementById('sidebarRole').innerText = headChef.role === 'owner'? 'Владелец' : 'Шеф-повар';
    document.getElementById('sidebarChefName').innerText = headChef.full_name || 'Шеф';

    const year=currentDate.getFullYear(),month=currentDate.getMonth(),days=new Date(year,month+1,0).getDate(),start=`${year}-${String(month+1).padStart(2,'0')}-01`,end=`${year}-${String(month+1).padStart(2,'0')}-${days}`;
    updateMonthLabels();
    const {data:povara}=await supabase.from('profiles').select('*').eq('restaurant_id',myRestaurantId).eq('is_active',true).eq('role','cook');
    const {data:attendance}=await supabase.from('attendance').select('*').eq('restaurant_id',myRestaurantId).gte('work_date',start).lte('work_date',end);
    povaraCache=povara||[];attendanceCache={};povaraCache.forEach(p=>attendanceCache[p.id]={cook:p,days:(attendance||[]).filter(a=>a.cook_id===p.id)});

    let povaraHTML = '';
    povaraCache.forEach(p=>{
      const job = p.job_title || 'Повар';
      const salary = Number(p.salary) || 0;
      povaraHTML += `<div class="povar-card"><div class="povar-head"><div style="display:flex;gap:12px;align-items:center"><div class="avatar">${p.full_name[0]}</div><div><b>${p.full_name}</b><div style="color:var(--muted);font-size:12px">${job} • ${salary}₽/ч</div></div></div><button class="btn-danger" data-id="${p.id}" data-name="${p.full_name}">Уволить</button></div></div>`
    });
    document.getElementById('povaraList').innerHTML = povaraHTML || '<div class="muted">Поваров пока нет. Нажмите + Пригласить</div>';
    document.querySelectorAll('.btn-danger').forEach(b=>b.onclick=()=>fireCook(b.dataset.id,b.dataset.name));

    let tabelHTML = '';
    povaraCache.forEach(p=>{
      let daysHtml='';
      for(let i=0;i<days;i++){const day=i+1;const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;const status=attendanceCache[p.id]?.days.find(d=>d.work_date===dateStr)?.status||'off';daysHtml+=`<div class="day ${status}" data-id="${p.id}" data-date="${dateStr}">${day}</div>`}
      tabelHTML+=`<div class="povar-card"><div class="povar-head"><div style="display:flex;gap:12px;align-items:center"><div class="avatar">${p.full_name[0]}</div><div><b>${p.full_name}</b><div style="color:var(--muted);font-size:14px">${p.job_title || 'Повар'}</div></div></div></div><div class="calendar-grid">${daysHtml}</div><div class="total" id="total-${p.id}">0₽</div></div>`
    });
    document.getElementById('tabelList').innerHTML=tabelHTML;
    document.querySelectorAll('.day').forEach(d=>d.onclick=()=>openStatusModal(d.dataset.id,d.dataset.date));
    povaraCache.forEach(p=>renderTotal(p.id));renderGrafik()
  }catch(e){
    console.error(e);
    document.getElementById('povaraList').innerHTML=`<div class="err">Ошибка: ${e.message}</div>`
  }
}
loadData();
</script></body></html>
