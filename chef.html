<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit KITCHEN</title><style>
:root{--bg:#0a0a0a;--card:#171717;--card-2:#262626;--text:#f5f5f5;--muted:#a3a3a3;--accent:#f97316;--work:#22c55e;--sick:#f59e0b;--vac:#3b82f6;--danger:#ef4444}
*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif;margin:0}
.app{display:flex;min-height:100vh}.sidebar{width:260px;background:var(--card);padding:20px;position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:95;transition:.3s}
.sidebar.open{transform:translateX(0)}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;z-index:90}.overlay.show{display:block}
.menu button{width:100%;background:transparent;border:none;color:var(--text);text-align:left;padding:12px;border-radius:12px;cursor:pointer;font-weight:500}
.menu button.active{background:var(--card-2)}.content{flex:1;padding:20px}.topbar{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.burger{background:var(--card-2);border:1px solid #333;color:var(--text);padding:10px 16px;border-radius:12px;cursor:pointer;font-size:20px}
.btn{padding:10px 16px;border:none;border-radius:10px;background:var(--accent);color:#000;font-weight:700;cursor:pointer}
.povar-card{background:var(--card);padding:16px;border-radius:16px;border:1px solid #262626;margin-bottom:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:#000;font-size:20px}
.brand-line{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800}
.brand-name{color:var(--accent)}.brand-separator{color:var(--muted)}.restaurant-name{color:var(--text);font-size:22px;font-weight:800}
.err{color:var(--danger);padding:20px}
</style></head><body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<div class="app"><div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar"><h2 style="color:var(--accent)">HotPit KITCHEN</h2>
<nav class="menu"><button class="tab-btn active" data-tab="personal">👨‍🍳 Команда</button><button id="logoutBtn">Выйти</button></nav></aside>
<main class="content"><div class="topbar"><button class="burger" id="burgerBtn">☰</button>
<div><div class="brand-line"><span class="brand-name">HotPit KITCHEN</span><span class="brand-separator">|</span><span class="restaurant-name" id="pageSubtitle">Mery</span></div></div></div>
<div id="povaraList">Загрузка...</div></main></div>

<script>
const SUPABASE_URL = 'https://xljogkyropyocvuuodfl.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs'
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

document.getElementById('burgerBtn').onclick=()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')}
document.getElementById('overlay').onclick=()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
document.getElementById('logoutBtn').onclick=()=>supabase.auth.signOut().then(()=>location.href='/index.html');

async function loadData(){
  try{
    const {data:{user}} = await supabase.auth.getUser();
    if(!user) return location.href='/index.html';

    const {data:prof} = await supabase.from('profiles').select('*').eq('id',user.id).single();
    if(!prof ||!prof.restaurant_id) throw new Error('Нет restaurant_id');

    const {data:povara} = await supabase.from('profiles').select('*').eq('restaurant_id',prof.restaurant_id).eq('is_active',true).eq('role','cook');
    
    let html = '';
    povara.forEach(p=>{
      html += `<div class="povar-card"><div style="display:flex;gap:12px;align-items:center"><div class="avatar">${p.full_name[0]}</div><div><b>${p.full_name}</b><div style="color:var(--muted);font-size:12px">${p.job_title || 'Повар'}</div></div></div></div>`
    });
    document.getElementById('povaraList').innerHTML = html || 'Поваров нет';

  }catch(e){
    document.getElementById('povaraList').innerHTML=`<div class="err">${e.message}</div>`
  }
}
loadData();
</script></body></html>
