<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit KITCHEN - ChefOS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap');
:root{--bg:#0a0a0a;--card:#171717;--card-2:#1e1e1e;--text:#f5f5f5;--muted:#a3a3a3;--accent:#ff6b00;--border:#262626}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 80% -20%,rgba(255,107,0,.12),transparent),var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
.app{display:flex;min-height:100vh}
.sidebar{width:280px;background:var(--card);border-right:1px solid var(--border);padding:20px;display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:95;transition:.3s}
.sidebar.open{transform:translateX(0)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;z-index:90}.overlay.show{display:block}
.menu{display:flex;flex-direction:column;gap:4px;margin-top:16px}
.menu button{width:100%;background:transparent;border:none;color:#9f9f9f;text-align:left;padding:12px 14px;border-radius:10px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:12px;border-left:3px solid transparent}
.menu button.active,.menu button:hover{background:rgba(255,107,0,.08);color:#fff;border-left-color:var(--accent)}
.menu-parent{font-weight:700!important;color:#fff!important;background:rgba(255,107,0,.12)!important;width:100%;border:none;padding:12px 14px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.submenu{max-height:0;overflow:hidden;transition:.3s;padding-left:14px;border-left:2px solid #ff6b0040;margin-left:12px;margin-top:8px;display:flex;flex-direction:column;gap:2px}
.submenu.open{max-height:400px}
.lang-switch{display:flex;gap:4px;background:#1e1e1e;padding:4px;border-radius:20px;border:1px solid var(--border)}
.lang-btn{background:transparent;border:none;color:var(--muted);padding:4px 10px;border-radius:14px;font-size:11px;font-weight:700;cursor:pointer}
.lang-btn.active{background:var(--accent);color:#000}
.content{flex:1;padding:24px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.burger{background:var(--card-2);border:1px solid #333;color:var(--text);padding:8px 12px;border-radius:10px;cursor:pointer}
.close-btn{background:transparent;border:1px solid #333;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.acc-card{border:1px solid var(--border);border-radius:16px;margin-bottom:12px;background:var(--card-2);border-left:3px solid transparent;overflow:hidden}
.acc-card.open{border-left-color:var(--accent);background:#242424}
.acc-head{display:flex;justify-content:space-between;align-items:center;font-weight:600;padding:18px 20px;cursor:pointer}
.acc-body{max-height:0;overflow:hidden;transition:.35s;opacity:0;padding:0 20px}
.acc-card.open.acc-body{max-height:800px;opacity:1;padding:0 20px 20px}
.btn{background:var(--accent);border:none;color:#fff;padding:10px 22px;border-radius:20px;font-weight:700;cursor:pointer;margin-top:16px}
input{width:100%;padding:12px 14px;background:#111;border:1px solid #333;border-radius:10px;color:var(--text);margin-top:8px}
@media(min-width:901px){.sidebar{position:static;transform:translateX(0)}.burger{display:none}.close-btn{display:none!important}}
</style></head><body>
<div class="app">
<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:14px">
      <img id="brandLogo" src="logo.png" width="54" height="54" style="object-fit:contain;border-radius:10px" onerror="this.style.display='none'">
      <div style="line-height:1">
        <div style="color:#FF6A00;font-weight:900;font-size:26px">HotPit</div>
        <div id="brandSub" style="letter-spacing:5px;font-size:12px">KITCHEN</div>
        <div style="margin-top:6px;background:#FF6A00;color:#fff;font-weight:800;font-size:11px;padding:3px 14px;border-radius:14px;display:inline-block">ChefOS</div>
      </div>
    </div>
    <button class="close-btn" id="closeBtn">✕</button>
  </div>
  <div id="restName" style="color:var(--muted);font-size:11px;margin-top:14px;letter-spacing:.5px">...</div>
  <nav class="menu" id="sideMenu">
    <!-- генерируется из JS без хардкода -->
  </nav>
</aside>
<main class="content">
  <div class="topbar">
    <button class="burger" id="burgerBtn">☰</button>
    <div class="lang-switch">
      <button data-lang="az" class="lang-btn">AZ</button>
      <button data-lang="ru" class="lang-btn active">RU</button>
      <button data-lang="en" class="lang-btn">EN</button>
    </div>
  </div>

  <div id="tab-dashboard" data-tab-content="dashboard"><h2 data-i18n="home">Home</h2><div id="dTeam"></div></div>
  <div id="tab-personal" data-tab-content="personal" style="display:none"><div id="povaraList"></div></div>
  <div id="tab-tabel" data-tab-content="tabel" style="display:none"><div id="tabelList"></div></div>
  <div id="tab-stock" data-tab-content="stock" style="display:none"><div id="stockList"></div></div>
  <div id="tab-settings" data-tab-content="settings" style="display:none">
    <div class="acc-card open" id="accShift">
      <div class="acc-head"><span data-i18n="shift">Shifts</span><span>⌃</span></div>
      <div class="acc-body"><input type="time" id="startTime" value="08:00"><input type="time" id="endTime" value="23:00" style="margin-top:8px"></div>
    </div>
    <div class="acc-card" id="accAccounting">
      <div class="acc-head"><span data-i18n="accounting">Accounting</span><span>⌄</span></div>
      <div class="acc-body"><input id="acc_email" placeholder="email"><input id="acc_tg" placeholder="@telegram" style="margin-top:8px"><input id="acc_phone" placeholder="+994..." style="margin-top:8px"></div>
    </div>
    <button class="btn" id="saveBtn" data-i18n="save">Save</button>
  </div>
</main>
</div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supabase = createClient('https://xljogkyropyocvuuodfl.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs');

const I18N={
  ru:{home:"Главная",personnel:"Персонал",timetable:"Табель",dashboard:"Дашборд",stock:"Склад",settings:"Настройки",shift:"Смены",accounting:"Бухгалтерия",save:"Сохранить",logout:"Выйти",chefos:"ChefOS"},
  az:{home:"Ev",personnel:"Heyət",timetable:"Cədvəl",dashboard:"Panel",stock:"Anbar",settings:"Tənzimləmələr",shift:"Növbələr",accounting:"Mühasibat",save:"Yadda saxla",logout:"Çıxış",chefos:"ChefOS"},
  en:{home:"Home",personnel:"Staff",timetable:"Schedule",dashboard:"Dashboard",stock:"My Stock",settings:"Settings",shift:"Shifts",accounting:"Accounting",save:"Save",logout:"Logout",chefos:"ChefOS"}
};

const MENU=[
  {id:'dashboard',icon:'🏠',i18n:'home'},
  {id:'personal',icon:'👤',i18n:'personnel'},
  {id:'tabel',icon:'📅',i18n:'timetable'},
  {type:'parent', id:'chefParent', i18n:'chefos', icon:'🍳', children:[
    {id:'dashboard',icon:'📊',i18n:'dashboard'},
    {id:'stock',icon:'📦',i18n:'stock', href:'/stock.html'},
  ]},
  {id:'settings',icon:'⚙️',i18n:'settings'}
];

let lang=localStorage.getItem('hotpit_lang')||'ru';
const $=id=>document.getElementById(id);

function renderMenu(){
  const t=I18N[lang];
  const side=$('sideMenu');
  side.innerHTML = MENU.map(m=>{
    if(m.type==='parent'){
      return `<div class="menu-block"><button class="menu-parent" id="btn-${m.id}"><span>${m.icon} ${t[m.i18n]}</span><span>⌃</span></button><div class="submenu open" id="sub-${m.id}">${m.children.map(c=>`<button class="tab-btn" data-tab="${c.id}" data-href="${c.href||''}">${c.icon} <span data-i18n="${c.i18n}">${t[c.i18n]}</span></button>`).join('')}</div></div>`;
    } else {
      return `<button class="tab-btn ${m.id==='dashboard'?'active':''}" data-tab="${m.id}">${m.icon} <span data-i18n="${m.i18n}">${t[m.i18n]}</span></button>`;
    }
  }).join('') + `<button id="logoutBtn" style="margin-top:20px">🚪 <span data-i18n="logout">${t.logout}</span></button>`;
  bindTabs();
}

function setLang(l){
  lang=l; localStorage.setItem('hotpit_lang',l);
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.dataset.i18n; if(I18N[l][k]) el.textContent=I18N[l][k];
  });
  renderMenu();
}
document.querySelectorAll('.lang-btn').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

function bindTabs(){
  document.querySelectorAll('.tab-btn').forEach(btn=>btn.onclick=()=>{
    const href=btn.dataset.href; if(href){ location.href=href; return; }
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
    const tab=btn.dataset.tab;
    document.querySelectorAll('[data-tab-content]').forEach(c=>c.style.display=c.dataset.tabContent===tab?'block':'none');
    closeSB();
  });
  const parentBtn=$('btn-chefParent'); if(parentBtn){ parentBtn.onclick=()=>{ $('sub-chefParent').classList.toggle('open'); }; }
}

function openSB(){ $('sidebar').classList.add('open'); $('overlay').classList.add('show'); }
function closeSB(){ $('sidebar').classList.remove('open'); $('overlay').classList.remove('show'); }
$('burgerBtn').onclick=openSB; $('closeBtn').onclick=closeSB; $('overlay').onclick=closeSB;

document.querySelectorAll('.acc-head').forEach(h=>h.onclick=()=>{
  const card=h.parentElement; card.classList.toggle('open');
  const arrow=h.querySelector('span:last-child'); if(arrow) arrow.textContent=card.classList.contains('open')?'⌃':'⌄';
});

renderMenu(); setLang(lang);

// Oracle-level: данные с БД, без хардкода лого и названия
let myRestaurantId=null;
async function init(){
  const {data:{user}}=await supabase.auth.getUser(); if(!user) return location.href='/index.html';
  const {data:prof}=await supabase.from('profiles').select('restaurant_id, restaurants(id,name,logo_url)').eq('id',user.id).maybeSingle();
  if(!prof?.restaurant_id) return location.href='/index.html';
  myRestaurantId=prof.restaurant_id;
  if(prof.restaurants){
    $('restName').textContent=prof.restaurants.name;
    if(prof.restaurants.logo_url) $('brandLogo').src=prof.restaurants.logo_url;
  }
}
init();

$('saveBtn').onclick=async()=>{
  // тут твой save в restaurant_settings без хардкода
  const payload={ restaurant_id:myRestaurantId, start_time:$('startTime').value, end_time:$('endTime').value, acc_email:$('acc_email').value, acc_tg:$('acc_tg').value };
  const {error}=await supabase.from('restaurant_settings').upsert(payload,{onConflict:'restaurant_id'});
  if(error) alert(error.message); else alert(I18N[lang].save+' ✓');
};
document.getElementById('sideMenu').addEventListener('click', e=>{
  if(e.target.closest('#logoutBtn')) supabase.auth.signOut().then(()=>location.href='/index.html');
});
document.querySelector('[data-tab="dashboard"]').click();
</script>
</body></html>
