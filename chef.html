<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit KITCHEN</title><style>
:root{--bg:#0a0a0a;--card:#171717;--card-2:#262626;--text:#f5f5f5;--muted:#a3a3a3;--accent:#f97316;--work:#22c55e;--sick:#f59e0b;--vac:#3b82f6;--danger:#ef4444}
*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif;margin:0}
.app{display:flex;min-height:100vh}.sidebar{width:260px;background:var(--card);padding:20px;position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:95;transition:.3s}
.sidebar.open{transform:translateX(0)}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;z-index:90}.overlay.show{display:block}
.menu button{width:100%;background:transparent;border:none;color:var(--text);text-align:left;padding:12px;border-radius:12px;cursor:pointer;font-weight:500}
.menu button.active{background:var(--card-2)}.content{flex:1;padding:20px}.topbar{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.burger{background:var(--card-2);border:1px solid #333;color:var(--text);padding:10px 16px;border-radius:12px;cursor:pointer;font-size:20px}
.btn{padding:12px 20px;border:none;border-radius:12px;background:var(--accent);color:#000;font-weight:700;cursor:pointer}
.btn-outline{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn-danger{background:var(--danger);color:#fff;padding:8px 12px;border:none;border-radius:8px;cursor:pointer;font-size:12px}
input,select{width:100%;padding:12px;background:var(--card-2);border:1px solid #333;border-radius:12px;color:var(--text);margin-top:8px}
.povar-card{background:var(--card);padding:16px;border-radius:16px;border:1px solid #262626;margin-bottom:12px}
.povar-head{display:flex;align-items:center;justify-content:space-between}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:#000}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day{aspect-ratio:1;border-radius:10px;background:var(--card-2);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;font-weight:600}
.day.work{background:var(--work);color:#000}.day.sick{background:var(--sick);color:#000}.day.vac{background:var(--vac);color:#fff}
.total{margin-top:12px;padding-top:12px;border-top:1px solid #333;font-weight:700}
.grafik-wrapper{overflow-x:auto}.grafik-grid{display:grid;gap:4px;width:max-content}
.grafik-header,.grafik-name{background:var(--card-2);padding:10px 8px;border-radius:8px;font-weight:700;text-align:center;font-size:12px}
.grafik-name{position:sticky;left:0;z-index:2;text-align:left;min-width:140px;background:var(--card)}
.grafik-cell{background:var(--card-2);border-radius:8px;text-align:center;padding:10px 8px;font-size:14px;min-width:40px;cursor:pointer;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.show{display:flex}.modal-card{background:var(--card);padding:24px;border-radius:20px;width:100%;max-width:420px}
.status-btn{padding:14px;border:none;border-radius:12px;width:100%;margin-top:8px;font-weight:700;cursor:pointer}
.err{color:var(--danger);padding:20px}
</style></head><body>
<div class="app"><div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar"><h2 style="color:var(--accent)">HotPit KITCHEN</h2><div id="restName" style="color:var(--muted);font-size:12px;margin-bottom:16px">Загрузка...</div>
<nav class="menu"><button class="tab-btn active" data-tab="personal">👨‍🍳 Команда Кухни</button><button class="tab-btn" data-tab="tabel">📋 Табель</button><button class="tab-btn" data-tab="grafik">📅 График</button><button id="logoutBtn">Выйти</button></nav></aside>
<main class="content"><div class="topbar"><button class="burger" id="burgerBtn">☰</button><h1 id="pageTitle">👨‍🍳 Команда Кухни</h1><button class="btn" id="addBtn" style="margin-left:auto">+ Добавить</button></div>
<div id="tab-content">
<div data-tab-content="personal"><div id="povaraList">Загрузка...</div></div>
<div data-tab-content="tabel" style="display:none"><div style="display:flex;gap:10px;margin-bottom:20px"><button class="btn-outline" id="prevMonthT"><</button><div id="monthYearT" style="flex:1;text-align:center;font-weight:700"></div><button class="btn-outline" id="nextMonthT">></button></div><div id="tabelList">Загрузка...</div></div>
<div data-tab-content="grafik" style="display:none"><div style="display:flex;gap:10px;margin-bottom:20px"><button class="btn-outline" id="prevMonthG"><</button><div id="monthYearG" style="flex:1;text-align:center;font-weight:700"></div><button class="btn-outline" id="nextMonthG">></button></div><div class="grafik-wrapper" id="grafikList">Загрузка...</div></div>
</div></main></div>
<div class="modal" id="addModal"><div class="modal-card"><h3>Новый сотрудник кухни</h3><div id="modalBody"></div><div style="display:flex;gap:10px;margin-top:16px"><button class="btn-outline" id="cancelBtn" style="flex:1">Отмена</button><button class="btn" id="saveBtn" style="flex:1">Сохранить</button></div></div></div>
<div class="modal" id="statusModal"><div class="modal-card"><h3>Статус на <span id="statusDate"></span></h3>
<button class="status-btn" style="background:var(--work)" onclick="setStatus('work')">Смена</button>
<button class="status-btn" style="background:var(--sick)" onclick="setStatus('sick')">Больничный</button>
<button class="status-btn" style="background:var(--vac)" onclick="setStatus('vac')">Отпуск</button>
<button class="status-btn" style="background:var(--card-2)" onclick="setStatus('off')">Выходной</button>
<button class="btn-outline" style="margin-top:12px;width:100%" onclick="document.getElementById('statusModal').classList.remove('show')">Отмена</button></div></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supabase = createClient('https://xljogkyropyocvuuodfl.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs');
let currentTab='personal',myRestaurantId=null,currentDate=new Date(),povaraCache=[],attendanceCache={},tempStatusData={};
const JOB_TITLES = ['Су-шеф','Повар','Повар горячего цеха','Повар холодного цеха','Повар-универсал','Повар-кондитер','Пиццайоло','Сушист','Мойщик посуды'];
document.getElementById('burgerBtn').onclick=()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')}
document.getElementById('overlay').onclick=()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
document.querySelectorAll('.tab-btn').forEach(btn=>btn.onclick=()=>{currentTab=btn.dataset.tab;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('pageTitle').innerText=btn.textContent.trim();document.querySelectorAll('[data-tab-content]').forEach(c=>c.style.display=c.dataset.tabContent===currentTab?'block':'none');loadData()});
document.getElementById('logoutBtn').onclick=()=>supabase.auth.signOut().then(()=>location.href='/index.html');
function updateMonth(){document.getElementById('monthYearT').textContent=currentDate.toLocaleString('ru',{month:'long',year:'numeric'});document.getElementById('monthYearG').textContent=currentDate.toLocaleString('ru',{month:'long',year:'numeric'});loadData()}
document.getElementById('prevMonthT').onclick=()=>{currentDate.setMonth(currentDate.getMonth()-1);updateMonth()}
document.getElementById('nextMonthT').onclick=()=>{currentDate.setMonth(currentDate.getMonth()+1);updateMonth()}
document.getElementById('prevMonthG').onclick=()=>{currentDate.setMonth(currentDate.getMonth()-1);updateMonth()}
document.getElementById('nextMonthG').onclick=()=>{currentDate.setMonth(currentDate.getMonth()+1);updateMonth()}
document.getElementById('addBtn').onclick=()=>{const rolesHtml = JOB_TITLES.map(r=>`<option>${r}</option>`).join('');document.getElementById('modalBody').innerHTML=`<input id="newPovarName" placeholder="ФИО"><input id="newPovarEmail" type="email" placeholder="Email"><input id="newPovarPass" type="password" placeholder="Пароль 6+"><select id="newPovarRole">${rolesHtml}</select><input id="newPovarSalary" type="number" placeholder="Ставка в час">`;document.getElementById('addModal').classList.add('show')};
document.getElementById('cancelBtn').onclick=()=>document.getElementById('addModal').classList.remove('show');
document.getElementById('saveBtn').onclick=async()=>{const name=document.getElementById('newPovarName').value;const email=document.getElementById('newPovarEmail').value;const pass=document.getElementById('newPovarPass').value;const {data} = await supabase.auth.signUp({email,password:pass});await supabase.from('profiles').insert({id:data.user.id,full_name:name,role:'cook',job_title:document.getElementById('newPovarRole').value,restaurant_id:myRestaurantId,salary:Number(document.getElementById('newPovarSalary').value),salary_type:'hourly',is_active:true});document.getElementById('addModal').classList.remove('show');loadData()};
async function fireCook(cookId,name){if(confirm(`Уволить ${name}?`)){await supabase.from('profiles').update({is_active:false}).eq('id',cookId);loadData()}}
function openStatusModal(cookId,dateStr){if(dateStr<new Date().toISOString().split('T')[0])return;tempStatusData={cookId,dateStr};document.getElementById('statusDate').textContent=new Date(dateStr).toLocaleDateString('ru');document.getElementById('statusModal').classList.add('show')}
async function setStatus(status){document.getElementById('statusModal').classList.remove('show');const {cookId,dateStr}=tempStatusData;const existing=attendanceCache[cookId]?.days.find(d=>d.work_date===dateStr);try{if(status==='off'&&existing)await supabase.from('attendance').delete().eq('id',existing.id);else if(existing)await supabase.from('attendance').update({status}).eq('id',existing.id);else await supabase.from('attendance').insert({cook_id:cookId,restaurant_id:myRestaurantId,work_date:dateStr,status})}catch(e){alert('Ошибка: '+e.message)}loadData()}
function renderTotal(cookId){const data=attendanceCache[cookId];if(!data)return;const workDays=data.days.filter(d=>d.status==='work').length;const total=workDays*8*data.cook.salary;document.getElementById(`total-${cookId}`)&&(document.getElementById(`total-${cookId}`).textContent=`${workDays} смен = ${total.toLocaleString()}₽`)}
function renderGrafik(){const year=currentDate.getFullYear(),month=currentDate.getMonth(),days=new Date(year,month+1,0).getDate();let html=`<div class="grafik-grid" style="grid-template-columns:140px repeat(${days},40px)"><div class="grafik-header">Сотрудник</div>`;for(let i=1;i<=days;i++)html+=`<div class="grafik-header">${i}</div>`;povaraCache.forEach(p=>{html+=`<div class="grafik-name">${p.full_name}</div>`;for(let i=1;i<=days;i++){const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;const status=attendanceCache[p.id]?.days.find(d=>d.work_date===dateStr)?.status||'off';const symbol=status==='work'?'С':status==='sick'?'Б':status==='vac'?'О':'-';html+=`<div class="grafik-cell ${status}" onclick="openStatusModal('${p.id}','${dateStr}')">${symbol}</div>`}});html+='</div>';document.getElementById('grafikList').innerHTML=povaraCache.length?html:'<div>Нет данных</div>'}
async function loadData(){
  try{
    const {data:{user}} = await supabase.auth.getUser();
    if(!user) return location.href='/index.html';
    
    // ФИКС: Защита от null + автосоздание профиля
    let {data:prof, error: profErr} = await supabase.from('profiles').select('*,restaurants(name)').eq('id',user.id).single();
    
    if(profErr || !prof){
      document.getElementById('tab-content').innerHTML = `<div class="err">Профиль не найден. Создай ресторан в index.html сначала.</div>`;
      return;
    }
    
    if(!prof.restaurant_id){
      document.getElementById('tab-content').innerHTML = `<div class="err">У вас нет ресторана. Зайдите через index.html и создайте.</div>`;
      return;
    }
    
    myRestaurantId=prof.restaurant_id;
    document.getElementById('restName').textContent=prof.restaurants?.name || 'Ресторан';
    
    const year=currentDate.getFullYear(),month=currentDate.getMonth(),days=new Date(year,month+1,0).getDate(),start=`${year}-${String(month+1).padStart(2,'0')}-01`,end=`${year}-${String(month+1).padStart(2,'0')}-${days}`;
    updateMonth();
    
    const {data:povara}=await supabase.from('profiles').select('*').eq('restaurant_id',myRestaurantId).eq('is_active',true).in('role',['cook','chef']);
    const {data:attendance}=await supabase.from('attendance').select('*').eq('restaurant_id',myRestaurantId).gte('work_date',start).lte('work_date',end);
    povaraCache=povara||[];attendanceCache={};povaraCache.forEach(p=>attendanceCache[p.id]={cook:p,days:(attendance||[]).filter(a=>a.cook_id===p.id)});
    
    document.getElementById('povaraList').innerHTML=povaraCache.map(p=>`<div class="povar-card"><div class="povar-head"><div style="display:flex;gap:12px;align-items:center"><div class="avatar">${p.full_name[0]}</div><div><b>${p.full_name}</b><div style="color:var(--muted);font-size:14px">${p.job_title} • ${p.salary}₽/ч</div></div></div>${p.role==='cook'?`<button class="btn-danger" onclick="fireCook('${p.id}','${p.full_name}')">Уволить</button>`:''}</div></div>`).join('');
    
    document.getElementById('tabelList').innerHTML=povaraCache.map(p=>{const today=new Date().toISOString().split('T')[0];const daysHtml=Array.from({length:days},(_,i)=>{const day=i+1;const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;const status=attendanceCache[p.id]?.days.find(d=>d.work_date===dateStr)?.status||'off';return`<div class="day ${status}" onclick="openStatusModal('${p.id}','${dateStr}')">${day}</div>`}).join('');return`<div class="povar-card"><div class="povar-head"><div style="display:flex;gap:12px;align-items:center"><div class="avatar">${p.full_name[0]}</div><div><b>${p.full_name}</b><div style="color:var(--muted);font-size:14px">${p.job_title}</div></div></div></div><div class="calendar-grid">${daysHtml}</div><div class="total" id="total-${p.id}">0₽</div></div>`}).join('');
    povaraCache.forEach(p=>renderTotal(p.id));renderGrafik()
  }catch(e){document.getElementById('povaraList').innerHTML=`<div class="err">${e.message}</div>`}
loadData();window.openStatusModal=openStatusModal;window.setStatus=setStatus;window.fireCook=fireCook;
</script></body></html>
