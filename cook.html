<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отметка - HotPit</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#0a0a0a;--card:#171717;--card-2:#262626;--text:#f5f5f5;--muted:#a3a3a3;--accent:#f97316;--radius:20px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1200px 600px at 80% -20%,rgba(249,115,22,0.12),transparent),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

 .card{background:var(--card); padding:40px; border-radius:var(--radius); border:1px solid #262626; text-align:center; width:100%; max-width:420px; box-shadow:0 20px 50px rgba(0,0,0,0.5)}
 .logo{width:70px; height:70px; border-radius:16px; object-fit:cover; margin:0 auto 16px; border:2px solid var(--accent)}
  h1{color:var(--accent); margin:0 0 8px; font-size:28px; font-weight:800}
 .sub{color:var(--muted); font-size:14px; margin-bottom:24px}
  input{width:100%;padding:14px;margin:8px 0;background:var(--card-2);border:1px solid #333;border-radius:10px;color:var(--text);font-size:15px;outline:none}
  input:focus{border-color:var(--accent)}
 .btn{width:100%; padding:18px; font-size:18px; font-weight:800; border:none; border-radius:10px; cursor:pointer; margin:8px 0; transition:0.2s}
 .btn:active{transform:scale(0.97)}
 .btn-primary{background:var(--accent);color:#000}
 .btn-primary:hover{filter:brightness(1.1)}
 .btn-green{background:#22c55e; color:#fff}
 .btn-red{background:#ef4444; color:#fff}
 .info{color:var(--muted); margin-top:15px; font-size:14px}
 .late{color:#ef4444; font-weight:bold}
 .ontime{color:#22c55e; font-weight:bold}
</style>
</head>
<body>

<div class="card" id="loginCard" style="display:none">
  <h1>HotPit</h1>
  <p class="sub">Вход для персонала</p>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Пароль">
  <button class="btn btn-primary" onclick="login()">Войти</button>
</div>

<div class="card" id="markCard" style="display:none">
  <img id="restLogo" class="logo" src="" style="display:none">
  <h1 id="restName">Ресторан</h1>
  <p class="sub" id="userInfo"></p>
  <button class="btn btn-green" id="btnIn" onclick="mark('in')">ОТМЕТИТЬ ПРИХОД</button>
  <button class="btn btn-red" id="btnOut" onclick="mark('out')" style="display:none">ОТМЕТИТЬ УХОД</button>
  <p class="info" id="status"></p>
</div>

<script>
const SUPA_URL = 'https://xljogkyropyocvuuodfl.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs';
const supabase = window.supabase.createClient(SUPA_URL, SUPA_KEY);

const urlParams = new URLSearchParams(window.location.search);
const restaurant_id = urlParams.get('restaurant_id');

let currentUser = null;
let startTime = '10:00';

async function init(){
  if(!restaurant_id) { alert('Ошибка: нет restaurant_id в QR'); return; }

  const {data: rest} = await supabase.from('restaurants').select('name,start_time,logo_url').eq('id',restaurant_id).single();
  if(rest){
    document.getElementById('restName').textContent = rest.name;
    startTime = rest.start_time || '10:00';
    if(rest.logo_url){
      document.getElementById('restLogo').src = rest.logo_url;
      document.getElementById('restLogo').style.display = 'block';
    }
  }

  const {data: {session}} = await supabase.auth.getSession();
  if(session){
    currentUser = session.user;
    showMarkScreen();
  } else {
    document.getElementById('loginCard').style.display = 'block';
  }
}

async function login(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const {error} = await supabase.auth.signInWithPassword({email,password});
  if(error) alert(error.message); else location.reload();
}

async function showMarkScreen(){
  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('markCard').style.display = 'block';
  const {data: profile} = await supabase.from('profiles').select('name').eq('id',currentUser.id).single();
  document.getElementById('userInfo').textContent = `Привет, ${profile?.name || 'Сотрудник'}! Смена с ${startTime}`;

  const TODAY = new Date().toISOString().split('T')[0];
  const {data: att} = await supabase.from('attendance').select('*').eq('user_id',currentUser.id).eq('work_date',TODAY).eq('restaurant_id',restaurant_id).single();
  if(att?.time_in) document.getElementById('btnIn').style.display='none';
  if(att?.time_in &&!att?.time_out) document.getElementById('btnOut').style.display='block';
}

async function mark(type){
  const now = new Date();
  const time = now.toTimeString().split(' ')[0].substring(0,5);
  const TODAY = now.toISOString().split('T')[0];

  if(type==='in'){
    const status = time > startTime? 'late' : 'on_time';
    await supabase.from('attendance').insert({
      user_id: currentUser.id, restaurant_id, work_date: TODAY, time_in: time, status
    });
    const msg = status==='late'? `Отмечено в ${time}. <span class="late">Опоздание</span>` : `Отмечено в ${time}. <span class="ontime">Вовремя</span>`;
    document.getElementById('status').innerHTML = msg;
    document.getElementById('btnIn').style.display='none';
    document.getElementById('btnOut').style.display='block';
  }
  if(type==='out'){
    await supabase.from('attendance').update({time_out: time}).eq('user_id',currentUser.id).eq('work_date',TODAY).eq('restaurant_id',restaurant_id);
    document.getElementById('status').textContent = `Уход отмечен в ${time}`;
    document.getElementById('btnOut').style.display='none';
  }
}

init();
</script>
</body>
  </html>
