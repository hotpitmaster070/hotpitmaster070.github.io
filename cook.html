<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit | Повар</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="auth-wrap">
  <h1 id="name">Загрузка...</h1>
  <p id="status">Проверяем авторизацию...</p>
  <button id="btn" class="btn-primary" style="display:none" onclick="toggleShift()">...</button>
  <div id="msg" style="margin-top:12px;font-size:13px"></div>
</div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
import {SUPABASE_URL, SUPABASE_ANON_KEY} from './js/config.js'
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let cookId=null, restaurantId=null, today=new Date().toISOString().split('T')[0];

async function init(){
  const {data:{user}} = await supabase.auth.getUser();
  if(!user) return location.href='./index.html';
  cookId = user.id;
  const {data:cook, error} = await supabase.from('profiles').select('full_name, restaurant_id, role').eq('id', cookId).eq('is_active', true).single();
  if(error ||!cook){ document.getElementById('name').innerHTML='<div style="color:#f87171">Профиль не найден</div>'; return }
  if(cook.role!== 'cook'){ document.getElementById('name').innerHTML='<div style="color:#f87171">У вас нет доступа</div>'; return }
  restaurantId = cook.restaurant_id;
  document.getElementById('name').textContent = cook.full_name;
  const {data:shift} = await supabase.from('attendance').select('id').eq('cook_id', cookId).eq('work_date', today).eq('status', 'work').maybeSingle();
  updateBtn(!!shift);
}

function updateBtn(onShift){
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  btn.style.display='block';
  if(onShift){
    btn.textContent='Уйти со смены';
    btn.className='btn-danger';
    status.innerHTML='<div style="color:#22c55e">Вы на смене</div>';
  } else {
    btn.textContent='Прийти на смену';
    btn.className='btn-primary';
    status.textContent='Не на смене';
  }
}

window.toggleShift = async()=>{
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  btn.disabled=true; msg.textContent = 'Сохраняю...';
  const onShift = btn.textContent.includes('Уйти');
  try{
    if(!onShift){
      await supabase.from('attendance').insert({ cook_id: cookId, restaurant_id: restaurantId, work_date: today, status: 'work' })
    }else{
      await supabase.from('attendance').delete().eq('cook_id', cookId).eq('work_date', today)
    }
    updateBtn(!onShift);
    msg.textContent = '';
  }catch(e){ msg.innerHTML = `<div style="color:#f87171">${e.message}</div>`; }
  btn.disabled=false;
}
init()
</script></body></html>
