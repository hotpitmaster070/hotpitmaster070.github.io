<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title id="pageTitle">HotPit Регистрация</title>
<style>
:root{--bg:#0a0a0a;--card:#171717;--card-2:#262626;--text:#f5f5f5;--muted:#a3a3a3;--accent:#f97316}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 80% -20%,rgba(249,115,22,0.12),transparent),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--card);padding:24px;border-radius:20px;width:100%;max-width:420px;border:1px solid #262626}
h1{font-size:22px;margin-bottom:8px}
.muted{color:var(--muted);font-size:14px;margin-bottom:16px}
input{width:100%;padding:12px;background:var(--card-2);border:1px solid #333;border-radius:10px;color:var(--text);margin-top:8px;font-size:15px}
button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#000;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px}
button[disabled]{opacity:.6;cursor:not-allowed}
.err{color:#f87171;font-size:14px;margin-top:8px}
.ok{color:#22c55e;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Регистрация</h1>
  <div class="muted" id="restInfo">Загрузка...</div>

  <div id="createRestBlock" style="display:none">
    <input id="restName" type="text" placeholder="Название ресторана">
  </div>

  <input id="fullName" type="text" placeholder="Ваше ФИО">
  <input id="email" type="email" placeholder="Email" readonly>
  <input id="password" type="password" placeholder="Придумайте пароль 6+ символов">
  <button id="regBtn">Создать аккаунт</button>
  <div id="msg"></div>
</div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const SUPABASE_URL = 'https://xljogkyropyocvuuodfl.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs'
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(location.search);
let role = params.get('role'); // chef или cook
let restaurant_id = params.get('restaurant_id');
let email = params.get('email');

document.getElementById('email').value = email || '';
const msgBox = document.getElementById('msg');
const restInfo = document.getElementById('restInfo');
const title = document.getElementById('title');
const pageTitle = document.getElementById('pageTitle');
const regBtn = document.getElementById('regBtn');
const createRestBlock = document.getElementById('createRestBlock');

let isCreateMode = false;

// РЕЖИМ 1: СОЗДАНИЕ РЕСТОРАНА. /register.html
if(!role &&!restaurant_id){
  isCreateMode = true;
  role = 'chef'; // Первый всегда шеф
  title.textContent = 'Создать ресторан';
  pageTitle.textContent = 'HotPit Создание ресторана';
  regBtn.textContent = 'Создать ресторан и аккаунт';
  restInfo.textContent = 'Вы станете Шеф-поваром и Владельцем';
  document.getElementById('email').readOnly = false;
  createRestBlock.style.display = 'block';
}

// РЕЖИМ 2: ПРИГЛАШЕНИЕ. /register.html?role=cook&restaurant_id=xxx&email=xxx
else if(role && restaurant_id && email){
  if(role === 'chef'){
    title.textContent = 'Регистрация Шефа';
    pageTitle.textContent = 'HotPit Регистрация Шефа';
    regBtn.textContent = 'Создать аккаунт Шефа';
  } else if(role === 'cook'){
    title.textContent = 'Регистрация Повара';
    pageTitle.textContent = 'HotPit Регистрация Повара';
    regBtn.textContent = 'Создать аккаунт Повара';
  }
  loadRestName();
}

// ОШИБКА
else {
  restInfo.innerHTML = `<div class="err">Неверная ссылка приглашения</div>`;
  regBtn.disabled = true;
}

async function loadRestName(){
  const {data: rest, error} = await supabase.from('restaurants').select('name').eq('id', restaurant_id).maybeSingle();
  if(error ||!rest){
    restInfo.innerHTML = `<div class="err">Ресторан не найден</div>`;
    regBtn.disabled = true;
    return;
  }
  restInfo.textContent = `Вас пригласили в ресторан: ${rest.name}`;
}

document.getElementById('regBtn').onclick = async ()=>{
  const fullName = document.getElementById('fullName').value.trim();
  const password = document.getElementById('password').value;
  const emailVal = document.getElementById('email').value.trim();
  const restNameVal = document.getElementById('restName').value.trim();
  msgBox.innerHTML = '';

  if(!fullName || password.length < 6 ||!emailVal) return msgBox.innerHTML = `<div class="err">Заполни все поля. Пароль 6+ символов</div>`;
  if(isCreateMode &&!restNameVal) return msgBox.innerHTML = `<div class="err">Введи название ресторана</div>`;

  regBtn.disabled = true;
  msgBox.innerHTML = `<div class="muted">Создаем аккаунт...</div>`;

  // 1. Создаем юзера в Auth
  const {data: signUpData, error: signUpErr} = await supabase.auth.signUp({
    email: emailVal,
    password
  });
  if(signUpErr) {
    regBtn.disabled = false;
    return msgBox.innerHTML = `<div class="err">${signUpErr.message}</div>`;
  }
  const user = signUpData.user;
  let final_restaurant_id = restaurant_id;

  // 2. Если это создание ресторана - создаем ресторан
  if(isCreateMode){
    const {data: newRest, error: restErr} = await supabase.from('restaurants').insert({name: restNameVal}).select().single();
    if(restErr) return msgBox.innerHTML = `<div class="err">${restErr.message}</div>`;
    final_restaurant_id = newRest.id;
  }

  // 3. Создаем профиль
  const final_role = isCreateMode? 'chef' : role;

  const profileData = {
    id: user.id,
    full_name: fullName,
    role: final_role,
    restaurant_id: final_restaurant_id,
    is_active: true
  };

  // Если это шеф - даем ему должность и ставку 0
  if(final_role === 'chef'){
    profileData.job_title = 'Шеф-повар';
    profileData.salary = 0;
    profileData.salary_type = 'monthly';
  }

  const {error: profErr} = await supabase.from('profiles').insert(profileData);
  if(profErr) {
    regBtn.disabled = false;
    return msgBox.innerHTML = `<div class="err">${profErr.message}</div>`;
  }

  msgBox.innerHTML = `<div class="ok">Готово! Заходим в кабинет...</div>`;

  // 4. СРАЗУ ЛОГИНИМ ЧТОБЫ БЫЛА СЕССИЯ
  const {error: loginErr} = await supabase.auth.signInWithPassword({email: emailVal, password})
  if(loginErr){
    regBtn.disabled = false;
    return msgBox.innerHTML = `<div class="err">Аккаунт создан. Зайди вручную через /index.html</div>`;
  }

  // Реддирект
  setTimeout(()=>{
    if(final_role === 'chef') location.href='/chef.html';
    if(final_role === 'cook') location.href='/cook.html';
  }, 800)
}
</script></body></html>
