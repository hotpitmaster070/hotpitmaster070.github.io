<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Регистрация</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px">
<div class="card" style="width:100%;max-width:420px">
  <h1 id="title">Регистрация</h1>
  <div class="sub" id="restInfo">Загрузка ресторана...</div>
  <input id="name" placeholder="Ваше имя">
  <input id="email" type="email" placeholder="Email" readonly>
  <input id="password" type="password" placeholder="Пароль">
  <button class="btn-primary" id="regBtn" style="width:100%">Создать аккаунт Шефа</button>
  <div id="msg" class="sub"></div>
</div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
import {SUPABASE_URL, SUPABASE_ANON_KEY} from './js/config.js'
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(location.search);
const role = params.get('role');
const restaurant_id = params.get('restaurant_id');
const email = params.get('email');
const job = params.get('job');
const salary = params.get('salary');

const title = document.getElementById('title');
const restInfo = document.getElementById('restInfo');
const emailInput = document.getElementById('email');
const regBtn = document.getElementById('regBtn');
const msg = document.getElementById('msg');

// 1. Меняем заголовок и кнопку
if(role==='chef'){
  title.innerText='Регистрация Шефа';
  regBtn.innerText='Создать аккаунт Шефа';
} else if(role==='cook'){
  title.innerText='Регистрация Повара';
  regBtn.innerText='Создать аккаунт Повара';
}

// 2. Подставляем email
if(email){emailInput.value = email}

// 3. Грузим название ресторана
async function loadRest(){
  if(!restaurant_id){restInfo.innerHTML=`<span style="color:#f87171">Ошибка в ссылке</span>`;return}
  const {data} = await supabase.from('restaurants').select('name').eq('id',restaurant_id).single();
  if(data){restInfo.innerText = `Вас пригласили в ресторан: ${data.name}`}
}
loadRest();

// 4. Регистрация
regBtn.onclick=async()=>{
  regBtn.disabled=true;
  const {data,error}=await supabase.auth.signUp({email:emailInput.value,password:document.getElementById('password').value});
  if(error){msg.innerHTML=`<span style="color:#f87171">${error.message}</span>`;regBtn.disabled=false;return}
  
  await supabase.from('profiles').insert({
    id:data.user.id,full_name:document.getElementById('name').value,
    role, restaurant_id, job_title:job||'Повар',
    salary:Number(salary)||0, is_active:true
  });
  msg.innerHTML=`<span style="color:#22c55e">Готово! Войдите в аккаунт</span>`;
  setTimeout(()=>location.href='./index.html',2000)
}
</script></body></html>
