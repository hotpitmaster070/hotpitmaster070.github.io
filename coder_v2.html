<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit Coder v2 - Авто</title>
<style>
:root{--bg:#0a0a0a;--card:#171717;--card2:#262626;--accent:#f97316;--ok:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:16px;min-height:100vh}
.card{background:var(--card);border:1px solid #262626;border-radius:16px;padding:18px;margin-bottom:14px}
h2{color:var(--accent)}h3{margin-bottom:10px}
label{font-size:11px;color:#a3a3a3;margin-top:10px;display:block;text-transform:uppercase}
input,textarea{width:100%;padding:12px;background:var(--card2);border:1px solid #333;border-radius:10px;color:#fff;margin-top:6px;font-size:14px}
textarea{min-height:80px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#000;font-weight:800;cursor:pointer;margin-top:10px;font-size:15px}
.btn-ok{background:var(--ok)} .btn-outline{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.log{white-space:pre-wrap;font-size:12px;background:#000;padding:12px;border-radius:10px;margin-top:10px;max-height:400px;overflow:auto}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.muted{color:#a3a3a3;font-size:12px}
</style></head><body>
<h2>🤖 HotPit Coder v2</h2><div class="muted" style="margin-bottom:16px">Скажи что сделать - он сам закодит и зальет</div>

<div class="card">
<h3>⚙️ Настройки (1 раз)</h3>
<label>GitHub Token ghp_...</label><input id="ghToken" type="password" placeholder="ghp_...">
<div class="row"><div><label>Owner</label><input id="ghOwner" value="hotpitmaster070"></div><div><label>Repo</label><input id="ghRepo" value="hotpitmaster070.github.io"></div></div>
<label>Groq API Key (бесплатно) gsk_...</label><input id="aiKey" type="password" placeholder="gsk_...">
<div class="muted">Где взять: groq.com -> API Keys -> Create. Бесплатно, 10 сек.</div>
</div>

<div class="card">
<h3>📄 Файл</h3>
<div class="row"><input id="ghPath" value="chef.html"><button class="btn btn-outline" id="loadBtn" style="margin-top:6px">📥 Загрузить</button></div>
<textarea id="code" placeholder="Код загрузится сюда..." style="min-height:120px"></textarea>
</div>

<div class="card">
<h3>💬 Твое задание кодеру</h3>
<textarea id="task" placeholder="Например: Добавь в мой склад кнопку Списать. При нажатии пусть списывает товар и пишет причину."></textarea>
<button class="btn" id="doBtn">🚀 Сделать и залить</button>
<div id="log" class="log" style="display:none"></div>
</div>

<div class="card" id="previewCard" style="display:none">
<h3>👀 Результат</h3>
<textarea id="fixed" style="min-height:200px"></textarea>
<button class="btn btn-ok" id="pushBtn">✅ Залить на GitHub</button>
</div>

<script>
function b64D(s){return decodeURIComponent(atob(s).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''))}
function b64E(s){return btoa(encodeURIComponent(s).replace(/%([0-9A-F]{2})/g,(m,p)=>String.fromCharCode('0x'+p)))}
function log(t){const el=document.getElementById('log'); el.style.display='block'; el.textContent+=t+"\n"; el.scrollTop=el.scrollHeight;}
document.getElementById('loadBtn').onclick=async()=>{
  const token=ghToken.value, owner=ghOwner.value, repo=ghRepo.value, path=ghPath.value;
  log('Гружу '+path+'...');
  try{
    const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{headers:{Authorization:`token ${token}`}});
    const d=await r.json(); const c=b64D(d.content); code.value=c; log(`✅ Загрузил ${c.length} симв. SHA ${d.sha.slice(0,7)}`); log.dataset.sha=d.sha;
  }catch(e){log('❌ '+e.message)}
}
document.getElementById('doBtn').onclick=async()=>{
  const aiKey=document.getElementById('aiKey').value.trim();
  const taskText=document.getElementById('task').value.trim();
  const fileCode=document.getElementById('code').value;
  if(!aiKey){alert('Вставь Groq ключ gsk_...'); return;}
  if(!taskText){alert('Напиши задание'); return;}
  log('🤖 Отправляю задание ИИ...');
  const systemPrompt=`Ты senior fullstack разработчик HotPit KITCHEN. У тебя есть файл chef.html (Supabase + vanilla JS). Твоя задача - выполнить задание пользователя и вернуть ПОЛНЫЙ исправленный HTML файл, без объяснений, только код в блоке \`\`\`html. Сохрани дизайн, темную тему, все существующие функции. Не ломай Supabase логику. Если чинишь табель - помни что id=modalButtons и класс show а не hidden. Если добавляешь функцию - делай надежно с try/catch.`;
  try{
    const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST', headers:{'Authorization':'Bearer '+aiKey,'Content-Type':'application/json'},
      body:JSON.stringify({model:'llama-3.3-70b-versatile', messages:[{role:'system',content:systemPrompt},{role:'user',content:`Задание: ${taskText}\n\nФайл chef.html (первые 18000 симв):\n${fileCode.slice(0,18000)}`}], temperature:0.2})
    });
    const data=await res.json();
    let out=data.choices?.[0]?.message?.content||'';
    log('✅ ИИ ответил, парсю...');
    const m=out.match(/```html([\s\S]*?)```/)||out.match(/```([\s\S]*?)```/);
    const fixed=m?m[1]:out;
    document.getElementById('fixed').value=fixed.trim();
    document.getElementById('previewCard').style.display='block';
    log('Готово! Проверь внизу и жми Залить.');
  }catch(e){log('❌ Ошибка ИИ: '+e.message)}
}
document.getElementById('pushBtn').onclick=async()=>{
  const token=ghToken.value, owner=ghOwner.value, repo=ghRepo.value, path=ghPath.value;
  const fixed=document.getElementById('fixed').value;
  log('Заливаю на GitHub...');
  try{
    const getRes=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{headers:{Authorization:`token ${token}`}});
    const getData=await getRes.json();
    const sha=getData.sha;
    const putRes=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{
      method:'PUT', headers:{Authorization:`token ${token}`,'Content-Type':'application/json'},
      body:JSON.stringify({message:`feat: ${document.getElementById('task').value.slice(0,60)} via Coder v2`, content:b64E(fixed), sha})
    });
    const putData=await putRes.json();
    if(putRes.ok){log(`✅ ЗАЛИТО! https://${owner}.github.io/${path}\nОбнови сайт через 30 сек.`)}
    else throw new Error(JSON.stringify(putData));
  }catch(e){log('❌ '+e.message)}
}
['ghToken','ghOwner','ghRepo','aiKey'].forEach(id=>{const v=localStorage.getItem(id); if(v) document.getElementById(id).value=v; document.getElementById(id).addEventListener('change',()=>localStorage.setItem(id,document.getElementById(id).value))});
</script>
</body></html>
