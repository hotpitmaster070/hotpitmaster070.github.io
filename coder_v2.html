<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HOTPIT Кодер v2.1 FIX</title><style>body{background:#111;color:#fff;font-family:sans-serif;padding:12px;max-width:500px;margin:0 auto}input,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:12px;border:1px solid #333;background:#222;color:#fff}button{background:#ff6a00;border:none;font-weight:bold}</style></head><body>
<h2>🔥 HOTPIT Кодер v2.1 FIX</h2>
<input id="ghToken" placeholder="GitHub token ghp_...">
<input id="groqKey" placeholder="Groq key gsk_...">
<button onclick="localStorage.setItem('gh',ghToken.value);localStorage.setItem('groq',groqKey.value);alert('Сохранено')">💾 Сохранить</button>
<div style="display:flex;gap:8px"><input id="fileName" value="chef.html" style="flex:1"><button onclick="loadFile()" style="width:auto">📥 Загрузить</button></div>
<textarea id="codeArea" rows="4"></textarea>
<div id="fileInfo" style="font-size:12px;color:#aaa"></div>
<textarea id="task" rows="4" placeholder="Задание: что починить"></textarea>
<button onclick="doTask()">🚀 Сделать и залить</button>
<div id="log" style="background:#000;color:#0f0;padding:10px;border-radius:10px;white-space:pre-wrap;min-height:80px">Готов...</div>
<script>
let currentSHA=null,currentContent="";function log(t){let el=document.getElementById('log');el.textContent+="\n"+t;el.scrollTop=el.scrollHeight}
function getHeaders(){return{'Authorization':'Bearer '+document.getElementById('ghToken').value.trim(),'Accept':'application/vnd.github.v3+json'}}
async function loadFile(){const file=fileName.value.trim();const token=ghToken.value.trim();if(!token){alert('Вставь токен');return}log('Гружу '+file+'...');try{let res=await fetch(`https://api.github.com/repos/hotpitmaster070/hotpitmaster070.github.io/contents/${file}`,{headers:getHeaders()});let data=await res.json();if(!res.ok){log('❌ '+data.message);if(data.message.includes('Not Found')){currentSHA=null;fileInfo.textContent='Новый файл';}return}currentSHA=data.sha;currentContent=atob(data.content.replace(/\n/g,''));codeArea.value=currentContent.substring(0,300);fileInfo.textContent=`✅ ${currentContent.length} симв. SHA ${currentSHA.slice(0,7)}`;log(fileInfo.textContent)}catch(e){log('❌ '+e.message)}}
async function doTask(){const gKey=groqKey.value.trim();if(!currentContent)await loadFile();log('🤖 Отправляю в Groq...');try{let r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+gKey,'Content-Type':'application/json'},body:JSON.stringify({model:'llama-3.3-70b-versatile',temperature:0.2,messages:[{role:'system',content:'Ты Senior Frontend Dev. Верни ПОЛНЫЙ исправленный HTML файл в ```html'}, {role:'user',content:`ФАЙЛ ${fileName.value}:\n${currentContent}\n\nЗАДАНИЕ: ${task.value}`} ]})});let d=await r.json();if(!r.ok){log('❌ Groq: '+d.error.message);return}let code=d.choices[0].message.content;let m=code.match(/```html([\s\S]*?)```/i)||code.match(/```([\s\S]*?)```/);if(m)code=m[1];code=code.trim();log(`✅ Получил ${code.length} симв. Заливаю...`);let b64=btoa(unescape(encodeURIComponent(code)));let body={message:`fix: ${task.value}`,content:b64};if(currentSHA)body.sha=currentSHA;let put=await fetch(`https://api.github.com/repos/hotpitmaster070/hotpitmaster070.github.io/contents/${fileName.value}`,{method:'PUT',headers:getHeaders(),body:JSON.stringify(body)});let pd=await put.json();if(!put.ok){log('❌ Заливка: '+pd.message);return}currentSHA=pd.content.sha;currentContent=code;log(`🎉 ГОТОВО! https://hotpitmaster070.github.io/${fileName.value}?v=${Date.now()}`)}catch(e){log('❌ '+e.message)}}
(function(){ghToken.value=localStorage.getItem('gh')||'';groqKey.value=localStorage.getItem('groq')||'';})()
</script></body></html>
