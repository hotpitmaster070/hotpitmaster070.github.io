<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotPit - Stock</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
:root{--bg:#0a0a0a;--card:#171717;--card-2:#1e1e1e;--text:#f5f5f5;--muted:#a3a3a3;--accent:#ff6b00;--border:#262626;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0} body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif}
.app{display:flex;min-height:100vh} .sidebar{width:280px;background:var(--card);border-right:1px solid var(--border);padding:20px;position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:95;transition:.3s}
.sidebar.open{transform:translateX(0)} .overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;z-index:90}.overlay.show{display:block}
.menu button{width:100%;background:transparent;border:none;color:#9f9f9f;text-align:left;padding:12px 14px;border-radius:10px;cursor:pointer;display:flex;gap:12px}
.menu button.active{background:rgba(255,107,0,.08);color:#fff;border-left:3px solid var(--accent)}
.content{flex:1;padding:24px} .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.lang-switch{display:flex;gap:4px;background:#1e1e1e;padding:4px;border-radius:20px;border:1px solid var(--border)}
.lang-btn{background:transparent;border:none;color:var(--muted);padding:4px 10px;border-radius:14px;font-size:11px;font-weight:700;cursor:pointer}.lang-btn.active{background:var(--accent);color:#000}
.card{background:var(--card-2);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.btn{background:var(--accent);border:none;color:#fff;padding:10px 18px;border-radius:20px;font-weight:700;cursor:pointer}
input,select{width:100%;padding:12px;background:#111;border:1px solid #333;border-radius:10px;color:var(--text);margin-top:8px}
table{width:100%;border-collapse:collapse} th{color:var(--muted);font-size:11px;text-align:left;padding:10px} td{padding:12px 10px;border-top:1px solid #262626;font-size:13px}
.burger{background:var(--card-2);border:1px solid #333;color:var(--text);padding:8px 12px;border-radius:10px}
@media(min-width:901px){.sidebar{position:static;transform:translateX(0)}.burger{display:none}}
</style></head><body>
<div class="app">
<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar">
  <div style="display:flex;gap:14px;align-items:center">
    <img src="logo.png" width="54" height="54" onerror="this.style.display='none'">
    <div><div style="color:#FF6A00;font-weight:900;font-size:26px;line-height:1">HotPit</div><div style="letter-spacing:5px;font-size:12px">STOCK</div></div>
  </div>
  <div id="restName" style="color:var(--muted);font-size:11px;margin-top:14px">...</div>
  <nav class="menu" style="margin-top:16px">
    <button class="tab-btn active" data-tab="list">📦 My Stock</button>
    <button class="tab-btn" data-tab="history">📜 History (stock_moves)</button>
    <button id="backBtn" style="margin-top:20px">← ChefOS</button>
  </nav>
</aside>
<main class="content">
  <div class="topbar">
    <button class="burger" id="burgerBtn">☰</button>
    <div class="lang-switch"><button data-lang="az" class="lang-btn">AZ</button><button data-lang="ru" class="lang-btn active">RU</button><button data-lang="en" class="lang-btn">EN</button></div>
  </div>
  <div id="tab-list" data-tab-content="list">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2>Items</h2><button class="btn" id="reloadBtn">Reload</button></div>
    <input id="search" placeholder="Search items...">
    <div class="card" style="margin-top:12px;overflow:auto"><table><thead><tr><th>Product</th><th>Last moves</th><th>Action</th></tr></thead><tbody id="stockBody"></tbody></table></div>
    <div class="card"><h3>Быстрый приход в stock_moves</h3><select id="itemSelect"></select><input id="qtyInput" type="number" placeholder="Qty e.g. 5"><select id="typeInput"><option value="in">Приход</option><option value="out">Списание</option><option value="waste">Waste</option></select><button class="btn" id="addMoveBtn" style="margin-top:10px;width:100%">Save to stock_moves</button></div>
  </div>
  <div id="tab-history" data-tab-content="history" style="display:none"><div id="histList"></div></div>
</main>
</div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supabase = createClient('https://xljogkyropyocvuuodfl.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs');
const $=id=>document.getElementById(id);
let lang=localStorage.getItem('hotpit_lang')||'ru', myRestaurantId=null;
function setLang(l){lang=l;localStorage.setItem('hotpit_lang',l);document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));}
document.querySelectorAll('.lang-btn').forEach(b=>b.onclick=()=>setLang(b.dataset.lang)); setLang(lang);
$('burgerBtn').onclick=()=>{$('sidebar').classList.add('open');$('overlay').classList.add('show')}; $('overlay').onclick=()=>{$('sidebar').classList.remove('open');$('overlay').classList.remove('show')};
document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('[data-tab-content]').forEach(c=>c.style.display=c.dataset.tabContent===b.dataset.tab?'block':'none');$('sidebar').classList.remove('open');$('overlay').classList.remove('show')});
$('backBtn').onclick=()=>location.href='/chef.html';

async function init(){
  const {data:{user}}=await supabase.auth.getUser(); if(!user) return location.href='/index.html';
  const {data:prof}=await supabase.from('profiles').select('restaurant_id, restaurants(name)').eq('id',user.id).maybeSingle();
  if(!prof?.restaurant_id) return;
  myRestaurantId=prof.restaurant_id;
  if(prof.restaurants) $('restName').textContent=prof.restaurants.name;
  loadItems();
  loadHistory();
}
async function loadItems(){
  const q=$('search').value.trim();
  let req=supabase.from('items').select('id,name').limit(100);
  if(q) req=req.ilike('name','%'+q+'%');
  const {data}=await req;
  $('stockBody').innerHTML=(data||[]).map(i=>`<tr><td>${i.name}</td><td id="last-${i.id}" style="color:var(--muted)">...</td><td><button class="btn" onclick="quick('${i.id}')">+ move</button></td></tr>`).join('');
  $('itemSelect').innerHTML=(data||[]).map(i=>`<option value="${i.id}">${i.name}</option>`).join('');
  // подгружаем последний move для каждого
  for(const it of (data||[])){
    const {data:mv}=await supabase.from('stock_moves').select('qty,created_at').eq('restaurant_id',myRestaurantId).eq('item_id',it.id).order('created_at',{ascending:false}).limit(1).maybeSingle();
    if(mv){ const el=document.getElementById('last-'+it.id); if(el) el.textContent=mv.qty+' @ '+new Date(mv.created_at).toLocaleDateString(); }
  }
}
window.quick=(id)=>{ $('itemSelect').value=id; window.scrollTo(0,document.body.scrollHeight); }

async function loadHistory(){
  const {data}=await supabase.from('stock_moves').select('qty,created_at, items(name)').eq('restaurant_id',myRestaurantId).order('created_at',{ascending:false}).limit(100);
  $('histList').innerHTML=(data||[]).map(m=>`<div class="card"><b>${m.items?.name||'item'}</b> — ${m.qty} <span style="color:var(--muted)">${new Date(m.created_at).toLocaleString()}</span></div>`).join('')||'<div class="card">No moves yet</div>';
}

$('search').oninput=loadItems; $('reloadBtn').onclick=()=>{loadItems(); loadHistory();}
$('addMoveBtn').onclick=async()=>{
  const item_id=$('itemSelect').value, qty=parseFloat($('qtyInput').value), type=$('typeInput').value;
  if(!item_id||!qty) return alert('Выбери товар и qty');
  const finalQty= type==='out'||type==='waste' ? -Math.abs(qty) : Math.abs(qty);
  const {error}=await supabase.from('stock_moves').insert({restaurant_id:myRestaurantId, item_id, qty:finalQty});
  if(error) return alert(error.message);
  $('qtyInput').value=''; loadHistory(); loadItems();
};
init();
</script>
</body></html>
